/* Insulina — DM2 na APS (NPH/Regular), conforme Caderno AB 36 e PCDT DM2 */
function nphTitrate(dose,gj,hypo){
  // retorna [nova dose, texto, classe]
  if(hypo||gj<70){const red=Math.max(4,Math.round(dose*0.1));return [Math.max(0,dose-red),`Hipoglicemia: reduzir ${red} UI (4 UI ou 10%, o que for maior). Investigar causa.`,'bad']}
  if(gj<80)return [Math.max(0,dose-2),'Jejum abaixo da meta: reduzir 2 UI.','warn'];
  if(gj<=130)return [dose,'Jejum na meta (80–130): manter a dose.','ok'];
  if(gj<=180)return [dose+2,'Jejum acima da meta: aumentar 2 UI e reavaliar em 3 dias.','warn'];
  return [dose+4,'Jejum > 180: aumentar 4 UI e reavaliar em 3 dias.','bad'];
}

/* Risco cardiovascular — Escore de Risco Global de Framingham (D'Agostino 2008), categorias SBC */
function framingham(fem,age,tc,hdl,sbp,trt,smk,dm){
  const L=Math.log;
  const s=fem?2.32888*L(age)+1.20904*L(tc)-0.70833*L(hdl)+(trt?2.82263:2.76157)*L(sbp)+0.52873*smk+0.69154*dm-26.1931
             :3.06117*L(age)+1.12370*L(tc)-0.93263*L(hdl)+(trt?1.99881:1.93303)*L(sbp)+0.65451*smk+0.57367*dm-23.9802;
  return 1-Math.pow(fem?0.95012:0.88936,Math.exp(s));
}

  const ck=(p,arr)=>arr.map((l,i)=>`<label class="opt"><input type="checkbox" id="${p}-${i}" data-l="${esc(l)}"><span>${esc(l)}</span></label>`).join('');
  m.innerHTML=`<section class="panel">
    <div class="ph"><h2>Risco cardiovascular</h2><span class="code">Framingham ERG · 10 anos · SBC</span></div>
    <fieldset class="q"><legend>1. Já tem alguma condição de alto risco?</legend><div class="opts" style="grid-template-columns:1fr">${ck('rcvh',RCV_HIGH)}</div></fieldset>
    <div class="card">
      <div class="lbl">2. Escore de Framingham (30 a 74 anos)</div>
      <div class="sexo opts">
        <label class="opt"><input type="radio" name="rcv-sx" id="rcv-f" value="f" checked><span>Mulher</span></label>

      </div>
      <div class="grid2">
        <div class="field"><label for="rcv-age">Idade (anos)</label><input id="rcv-age" inputmode="numeric" value="56"></div>
        <div class="field"><label for="rcv-pas">PA sistólica (mmHg)</label><input id="rcv-pas" inputmode="numeric" value="138"></div>
        <div class="field"><label for="rcv-ct">Colesterol total</label><input id="rcv-ct" inputmode="numeric" value="215"></div>
        <div class="field"><label for="rcv-hdl">HDL</label><input id="rcv-hdl" inputmode="numeric" value="48"></div>
      </div>
      <div class="opts" style="grid-template-columns:1fr">
        <label class="opt"><input type="checkbox" id="rcv-trt"><span>Usa anti-hipertensivo</span></label>
        <label class="opt"><input type="checkbox" id="rcv-smk"><span>Tabagista atual</span></label>
        <label class="opt"><input type="checkbox" id="rcv-dm"><span>Diabetes</span></label>
      </div>
      <p class="ex" id="rcv-ex">Exemplo: substitua pelos dados da pessoa</p>
    </div>
    <fieldset class="q"><legend>3. Fatores agravantes (sobem uma categoria se o risco for intermediário)</legend><div class="opts" style="grid-template-columns:1fr">${ck('rcva',RCV_AGR)}</div></fieldset>
    ${resultBox('rcv-r')}
    ${copyBtn()}
    <table class="scale"><tbody>
      <tr><td>Baixo</td><td>&lt; 5% em 10 anos. MEV; estatina se LDL persistir acima da meta (&lt; 130).</td></tr>
      <tr><td>Intermediário</td><td>5–20% (homem) ou 5–10% (mulher). MEV + estatina de moderada intensidade; meta LDL &lt; 100.</td></tr>
      <tr><td>Alto</td><td>&gt; 20% (homem) ou &gt; 10% (mulher), ou condição de alto risco. Estatina de alta intensidade quando possível; meta LDL &lt; 70.</td></tr>
    </tbody></table>
    <p class="note">Escore de Risco Global de Framingham (eventos coronarianos, AVC, doença arterial periférica e IC em 10 anos) com as categorias da Atualização da Diretriz de Dislipidemias e Prevenção da Aterosclerose (SBC 2017). Pessoas com DCV estabelecida estão em risco muito alto (meta LDL &lt; 50) e não precisam do escore. Na estatina disponível no SUS: sinvastatina 20–40 mg é moderada; atorvastatina 40–80 mg é alta intensidade. Confira o protocolo do seu município.</p>
  </section>`;
  let line='';
  const upd=()=>{
    const r=$('#rcv-r'),fem=$('#rcv-f').checked,age=num($('#rcv-age').value),sbp=num($('#rcv-pas').value),tc=num($('#rcv-ct').value),hdl=num($('#rcv-hdl').value);
    const trt=$('#rcv-trt').checked,smk=$('#rcv-smk').checked,dm=$('#rcv-dm').checked;
    const hi=[...m.querySelectorAll('[id^="rcvh-"]:checked')].map(c=>c.dataset.l),ag=[...m.querySelectorAll('[id^="rcva-"]:checked')].map(c=>c.dataset.l);
    const dcv=m.querySelector('#rcvh-0').checked;
    if(hi.length){
      const t=dcv?'Muito alto risco':'Alto risco';
      r.className='result bad';
      r.innerHTML=`<div class="lbl">Classificação</div><div class="big" style="font-size:1.5rem">${t}</div><div class="sub">Por condição clínica: ${esc(hi[0].split(':')[0])}${hi.length>1?` e mais ${hi.length-1}`:''}. Não é preciso calcular o escore. Meta LDL &lt; ${dcv?50:70} mg/dL.</div>`;

    }
    if(!(age>=30&&age<=74)||!(sbp>60)||!(tc>50)||!(hdl>5)){r.className='result';r.innerHTML='<div class="sub">Preencha idade (30 a 74 anos), PA sistólica, colesterol total e HDL.</div>';line='';return}
    const p=framingham(fem,age,tc,hdl,sbp,trt,+smk,+dm)*100;
    const hiCut=fem?10:20;
    let cat=p<5?0:p<=hiCut?1:2;const up=cat===1&&ag.length>0;if(up)cat=2;
    const names=['Baixo risco','Risco intermediário','Alto risco'],cls=['ok','warn','bad'][cat],meta=[130,100,70][cat];
    r.className='result '+cls;
    r.innerHTML=`<div class="lbl">Risco em 10 anos (Framingham)</div><div class="big">${fmt(p)}<small>%</small></div><div class="sub"><span class="pill ${cls}">${names[cat]}</span>${up?' reclassificado por fator agravante':''} · meta LDL &lt; ${meta} mg/dL</div>`;

  };
  m.querySelectorAll('input').forEach(i=>{i.addEventListener('input',()=>{$('#rcv-ex').hidden=true;upd()});i.addEventListener('change',upd)});
  upd();bindCopy(()=>line);
}

/* Rastreios por idade e sexo */
function rastreios(o){
  const {age,fem,colo,sexo,hist,gest,fumo,am,fhmama,fhcolo,frat}=o;const R=[];
  const add=(st,t,d,src,alt)=>R.push({st,t,d,src,alt});
  // Colo do útero
  if(colo){
    if(hist)add('no','Citopatológico (colo do útero)','Não indicado após histerectomia total por causa benigna.','INCA 2016');
    else if(age<25)add('no','Citopatológico (colo do útero)','Rastreio começa aos 25 anos.','INCA 2016');
    else if(age<=64)add(sexo?'yes':'maybe','Citopatológico (colo do útero)',sexo?'25 a 64 anos: 2 exames anuais; se ambos normais, a cada 3 anos.':'Indicado a quem já teve atividade sexual (25 a 64 anos).','INCA 2016','Teste de DNA-HPV (a cada 5 anos, 25–64 anos) sendo implantado no SUS desde 2024: confira se já está disponível no seu município.');
    else add('maybe','Citopatológico (colo do útero)','Acima de 64 anos: pode encerrar se tiver 2 exames negativos nos últimos 5 anos. Nunca rastreada: 2 exames com intervalo de 1 a 3 anos.','INCA 2016');
  }
  // Mama
  if(fem){
    if(age>=50&&age<=69)add('yes','Mamografia','50 a 69 anos: a cada 2 anos.','MS/INCA','SBM/CBR/FEBRASGO: anual dos 40 aos 74 anos. O MS anunciou em 2025 ampliação do acesso (40–49 sob demanda e até 74 anos): confira a nota técnica vigente.');
    else if(age>=40&&age<50)add('maybe','Mamografia','40 a 49 anos: fora da faixa do rastreio organizado do MS; decisão compartilhada.','MS/INCA','SBM/CBR/FEBRASGO recomendam anual a partir de 40 anos.');
    else if(age>69&&age<=74)add('maybe','Mamografia','70 a 74 anos: decisão compartilhada conforme saúde geral.','MS/INCA','Sociedades: manter até 74 anos ou mais se expectativa de vida > 7 anos.');
    else add('no','Mamografia',age<40?'Rastreio não indicado antes dos 40 anos sem risco elevado.':'Acima de 74 anos: individualizar.','MS/INCA');
    if(fhmama)add('maybe','Mama: risco elevado','História familiar importante (parente de 1º grau < 50 anos, câncer de mama bilateral ou masculino, ovário): rastreio anual a partir dos 35 anos e considerar encaminhamento para avaliação de risco.','INCA');
  }
  // Colorretal
  if(age>=50&&age<=75)add('yes','Câncer colorretal','50 a 75 anos: pesquisa de sangue oculto nas fezes (imunoquímico) anual, ou colonoscopia a cada 10 anos.','Caderno AB 29','USPSTF: começar aos 45 anos.');
  else if(age>=45&&age<50)add('maybe','Câncer colorretal','45 a 49 anos: USPSTF recomenda começar; no Brasil, a referência da APS é a partir dos 50.','USPSTF 2021');
  else if(age>75&&age<=85)add('maybe','Câncer colorretal','76 a 85 anos: individualizar conforme rastreios prévios e saúde geral.','USPSTF 2021');
  else add('no','Câncer colorretal','Fora da faixa de rastreio.','Caderno AB 29');
  if(fhcolo)add('maybe','Colorretal: risco elevado','Parente de 1º grau com câncer colorretal ou adenoma avançado: colonoscopia a partir dos 40 anos (ou 10 anos antes do caso mais jovem), a cada 5 anos.','Consenso');
  // Próstata
  if(!fem&&age>=50&&age<=69)add('maybe','Próstata (PSA)','Rastreio populacional não recomendado pelo MS/INCA. Se a pessoa pedir, fazer decisão compartilhada sobre riscos e benefícios.','MS/INCA','SBU: oferecer a partir de 50 anos (45 se negro ou com história familiar).');
  // Osteoporose
  if(fem&&age>=65)add('yes','Densitometria óssea','Mulheres com 65 anos ou mais.','USPSTF / consensos');
  else if(fem&&age>=50&&frat)add('maybe','Densitometria óssea','Pós-menopausa < 65 anos com fatores de risco (baixo peso, fratura prévia, corticoide, tabagismo, história familiar): considerar, idealmente com FRAX.','USPSTF / consensos');
  else if(!fem&&age>=70)add('maybe','Densitometria óssea','Homens com 70 anos ou mais: evidência limitada; considerar se fatores de risco.','Consensos');
  // Pulmão
  if(fumo&&age>=50&&age<=80&&am>=20)add('maybe','Câncer de pulmão','50 a 80 anos com ≥ 20 anos-maço, fumante atual ou parou há < 15 anos: TC de baixa dose anual (USPSTF). Não é programa do SUS; oferecer cessação do tabagismo.','USPSTF 2021');
  // AAA
  if(!fem&&fumo&&age>=65&&age<=75)add('maybe','Aneurisma de aorta abdominal','Homem 65 a 75 anos que já fumou: USG de abdome uma vez.','USPSTF 2019');
  // Cardiometabólico
  if(age>=18)add('yes','Pressão arterial','Medir em toda consulta; ao menos anual a partir de 18 anos (a cada 2 anos se < 120x80 e sem fatores de risco).','Caderno AB 37');
  if(age>=35&&age<=70)add('maybe','Diabetes','Glicemia de jejum/HbA1c se sobrepeso ou obesidade, HAS, história familiar ou outros fatores de risco; repetir a cada 3 anos se normal.','MS / USPSTF');
  if((!fem&&age>=35)||(fem&&age>=45))add('yes','Dislipidemia','Perfil lipídico: homens ≥ 35 e mulheres ≥ 45 anos (mais cedo se risco cardiovascular aumentado).','Caderno AB 29');
  // Sorologias
  add('yes','HIV','Ao menos uma vez na vida; repetir após exposição de risco e periodicamente (a cada 3–6 meses) em populações-chave e PrEP.','MS');
  add('yes','Sífilis','Pessoas com vida sexual ativa conforme risco; gestantes no 1º e 3º trimestres e no parto.','MS');
  add('yes','Hepatite B','Testar ao menos uma vez (HBsAg); vacinar se não imune.','PCDT Hepatite B');
  add(age>=40?'yes':'maybe','Hepatite C',age>=40?'Pessoas com 40 anos ou mais: testar ao menos uma vez.':'Testar se fatores de risco (uso de drogas, transfusão antes de 1993, HIV, diálise, tatuagem em locais sem controle, populações-chave).','PCDT Hepatite C');
  if(gest)add('yes','Gestante','TR de HIV, sífilis, hepatites B e C no 1º trimestre (ou 1ª consulta), repetir HIV e sífilis no 3º trimestre e no parto; toxoplasmose, glicemia, urocultura conforme pré-natal.','MS');
  return R;
}
function renderRAST(m){
  m.innerHTML=`<section class="panel">
    <div class="ph"><h2>Rastreios por idade e sexo</h2><span class="code">INCA · MS · USPSTF</span></div>
    <div class="card">
      <div class="grid2"><div class="field"><label for="ra-age">Idade (anos)</label><input id="ra-age" inputmode="numeric" value="52"></div></div>
      <div class="sexo opts"><label class="opt"><input type="radio" name="ra-sx" id="ra-f" checked><span>Mulher</span></label><label class="opt"><input type="radio" name="ra-sx" id="ra-m"><span>Homem</span></label></div>
      <div class="opts soft" style="grid-template-columns:1fr">
        <label class="opt"><input type="checkbox" id="ra-colo" checked><span>Tem colo do útero</span></label>
        <label class="opt"><input type="checkbox" id="ra-sexo" checked><span>Já teve atividade sexual</span></label>
        <label class="opt"><input type="checkbox" id="ra-hist"><span>Histerectomia total por causa benigna</span></label>
        <label class="opt"><input type="checkbox" id="ra-gest"><span>Gestante</span></label>
        <label class="opt"><input type="checkbox" id="ra-fumo"><span>Fuma ou já fumou</span></label>
        <label class="opt"><input type="checkbox" id="ra-fhm"><span>História familiar de câncer de mama/ovário</span></label>
        <label class="opt"><input type="checkbox" id="ra-fhc"><span>Parente de 1º grau com câncer colorretal</span></label>
        <label class="opt"><input type="checkbox" id="ra-frat"><span>Fatores de risco para osteoporose</span></label>
      </div>
      <div class="field" id="ra-amf" hidden><label for="ra-am">Anos-maço</label><input id="ra-am" inputmode="decimal" placeholder="cigarros/dia ÷ 20 × anos"></div>
      <p class="ex" id="ra-ex">Exemplo: substitua pelos dados da pessoa</p>
    </div>
    <div id="ra-r" style="display:grid;gap:8px"></div>
    ${copyBtn()}
    <p class="note">Indicado = recomendação do MS/INCA para a faixa. Avaliar = decisão compartilhada, fator de risco ou divergência entre diretrizes. As recomendações mudam: confira as notas técnicas vigentes do INCA e do MS.</p>
  </section>`;
  let line='';
  const upd=()=>{
    const age=num($('#ra-age').value),fem=$('#ra-f').checked;$('#ra-amf').hidden=!$('#ra-fumo').checked;
    m.querySelectorAll('#ra-colo,#ra-hist,#ra-gest,#ra-fhm,#ra-frat').forEach(e=>e.closest('label').hidden=!fem);
    const r=$('#ra-r');if(!(age>=0&&age<120)){r.innerHTML='<div class="result"><div class="sub">Informe a idade.</div></div>';line='';return}
    const R=rastreios({age,fem,colo:fem&&$('#ra-colo').checked,sexo:$('#ra-sexo').checked,hist:$('#ra-hist').checked,gest:fem&&$('#ra-gest').checked,fumo:$('#ra-fumo').checked,am:num($('#ra-am').value)||0,fhmama:fem&&$('#ra-fhm').checked,fhcolo:$('#ra-fhc').checked,frat:$('#ra-frat').checked});
    const ST={yes:['Indicado','ok'],maybe:['Avaliar','warn'],no:['Não indicado','muted']};
    const order={yes:0,maybe:1,no:2};R.sort((a,b)=>order[a.st]-order[b.st]);
    r.innerHTML=R.map(x=>`<div class="node" style="${x.st==='no'?'opacity:.7':''}"><div class="ph"><h3>${esc(x.t)}</h3><span class="pill ${ST[x.st][1]==='muted'?'':ST[x.st][1]}" style="${ST[x.st][1]==='muted'?'color:var(--muted)':''}">${ST[x.st][0]}</span></div><div>${esc(x.d)}</div>${x.alt?`<div class="note">${esc(x.alt)}</div>`:''}<div class="code">${esc(x.src)}</div></div>`).join('');
    const yes=R.filter(x=>x.st==='yes').map(x=>x.t),may=R.filter(x=>x.st==='maybe').map(x=>x.t);
    line=`Rastreios (${fem?'mulher':'homem'}, ${age} anos): indicados: ${yes.join('; ')||'nenhum'}${may.length?'. Avaliar/decisão compartilhada: '+may.join('; '):''}.`;
  };
  m.querySelectorAll('input').forEach(i=>{i.addEventListener('input',()=>{$('#ra-ex').hidden=true;upd()});i.addEventListener('change',upd)});
  upd();bindCopy(()=>line);
}

const drugsIn=t=>{const tt=norm(t);return DRUGS.filter(d=>new RegExp(norm(d[1])).test(tt))};
function drugCard(d,o){
  const [n,,lim,drc,ge,la,be]=d;const rows=[];const all=!o.gest&&!o.lact&&!o.idoso;
  const low=o.tfg>0&&lim>0&&o.tfg<lim;
  rows.push(['DRC',drc,low]);
  if(all||o.gest)rows.push(['Gestação',ge,/contraindicad|não usar|evitar|suspender/i.test(ge)]);
  if(all||o.lact)rows.push(['Lactação',la,/contraindicad|evitar|suspender/i.test(la)]);
  if((all||o.idoso)&&be)rows.push(['Idoso (Beers)',be,/^evitar/i.test(be)]);
  const flag=rows.some(r=>r[2]);
  return `<div class="node" style="${flag?'border-color:var(--warn)':''}"><h3>${esc(n)}</h3><div class="rows">${rows.map(([k,v,w])=>`<div><span>${k}</span><span style="text-align:right;${w?'color:var(--warn);font-weight:600':''}">${esc(v)}</span></div>`).join('')}</div></div>`;
}

function renderMEL(m){

    <div class="ph"><h2>Lesão suspeita de melanoma</h2><span class="code">Glasgow 7 pontos · ABCDE · EFG</span></div>

    <details><summary>Exame e conduta</summary><ul>
      <li>Examinar toda a pele com boa luz, incluindo couro cabeludo, unhas, plantas, região genital e mucosas; palpar linfonodos regionais.</li>
      <li>Fotografar a lesão com régua ou fita métrica ao lado, para comparar e para teledermatologia.</li>
      <li>Lesão suspeita: encaminhar à dermatologia com prioridade pela regulação (ou teledermatologia/Telessaúde, se disponível). Se a equipe faz biópsia, preferir excisional com margem de 1–2 mm; não fazer shaving, cauterização ou crioterapia de lesão pigmentada suspeita.</li>
      <li>Dúvida sem critérios de alto risco: reavaliar em 8–12 semanas com foto comparativa.</li>
      <li>Para todos: fotoproteção (evitar sol das 10 h às 16 h, roupas, chapéu, protetor FPS ≥ 30) e autoexame mensal da pele.</li></ul></details>
    <p class="note">Glasgow: 3 ou mais pontos indica encaminhamento por suspeita de câncer (NICE). Os critérios ajudam a decidir quem encaminhar; não substituem a dermatoscopia nem o exame histopatológico.</p>
  </section>`;
  let line='';
  const upd=()=>{
    const ck=[...m.querySelectorAll('input[type=checkbox]:checked')],r=$('#mel-r');
    const by=k=>ck.filter(c=>c.dataset.k===k);
    const g=by('g7').reduce((s,c)=>s+(+c.dataset.v),0),ab=by('abcde').length,efg=by('efg').length,out=by('out').length,rf=by('rf');
    const high=g>=3||efg===3||out>0,mid=!high&&(ab>=2||g>0||by('abcde').some(c=>c.id==='mel-abcde-4'));
    const cls=high?'bad':mid?'warn':'ok';
    const ct=high?'Suspeita de melanoma: encaminhar à dermatologia com prioridade.':mid?'Alguns sinais presentes: considerar dermatoscopia/teledermatologia ou reavaliar em 8–12 semanas com foto.':ck.length?'Sem critérios de suspeita: orientar fotoproteção e autoexame.':'Marque os achados da lesão abaixo.';
    r.className='result '+(ck.length?cls:'');
    r.innerHTML=`<div class="lbl">Glasgow 7 pontos</div><div class="big">${g}<small>/10</small></div>
      <div class="rows"><div><span>ABCDE</span><span>${ab}/5</span></div><div><span>EFG</span><span>${efg}/3</span></div><div><span>Outros sinais de alerta</span><span>${out}</span></div><div><span>Fatores de risco</span><span>${rf.length}</span></div></div>
      <div class="sub">${ck.length?`<span class="pill ${cls}">${high?'Alto risco':mid?'Atenção':'Baixo risco'}</span> `:''}${ct}</div>`;
    const loc=$('#mel-loc').value.trim();
    const achados=[...by('g7'),...by('abcde'),...by('efg'),...by('out')].map(c=>c.dataset.l.replace(/^[A-E] · /,''));
    line=ck.length?`Lesão pigmentada${loc?' ('+loc+')':''}: Glasgow ${g}/10, ABCDE ${ab}/5, EFG ${efg}/3${achados.length?'. Achados: '+[...new Set(achados)].join('; ').toLowerCase():''}${rf.length?'. Fatores de risco: '+rf.map(c=>c.dataset.l).join('; ').toLowerCase():''}. ${ct}`:'';
  };
  m.querySelectorAll('input').forEach(i=>i.addEventListener('input',upd));
  m.querySelectorAll('input[type=checkbox]').forEach(i=>i.addEventListener('change',upd));
  $('#clr').onclick=()=>{m.querySelectorAll('input:checked').forEach(i=>i.checked=false);upd();window.scrollTo(0,0)};
  upd();bindCopy(()=>line);
}

<button class="upd" id="upd" hidden>Nova versão do Kit: toque para atualizar</button>
<script>
/* PWA: funciona offline e se atualiza sozinho quando há versão nova */
if('serviceWorker' in navigator){
  let refreshing=false;
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      const check=()=>reg.update().catch(()=>{});
      setInterval(check,30*60*1000);
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});
    }).catch(()=>{});
  });
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing)return;
    const b=document.getElementById('upd');
    // Se a pessoa ainda não interagiu, recarrega direto; senão oferece o botão
    if(!window.__touched){refreshing=true;location.reload();return}
    b.hidden=false;b.onclick=()=>{refreshing=true;location.reload()};
  });
  ['input','pointerdown','keydown'].forEach(e=>addEventListener(e,()=>{window.__touched=true},{once:true,capture:true}));
}
</script>
