<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
.upd{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;border:0;border-radius:999px;background:var(--accent);color:var(--accent-fg);font:600 .9rem var(--f-ui);padding:10px 18px;box-shadow:0 4px 14px rgb(0 0 0/.25);cursor:pointer}</style>
</head>
<body>
<style>
/* Layout: menu lateral de seções (gaveta no celular, fixo no PC) + abas internas em chips; paleta roxa com destaque coral */
:root{
  --bg:#f6f4fb; --surface:#ffffff; --sunk:#ede9f7; --line:#dcd5ec;
  --fg:#1f1933; --muted:#625a78; --accent:#6a3fd1; --accent-fg:#ffffff; --accent-soft:#ebe4fc; --accent2:#e2694f; --accent2-soft:#fde8e1;
  --ok:#1f7a3a; --ok-soft:#dff1e4; --warn:#93600a; --warn-soft:#f8ecd3; --bad:#a3262a; --bad-soft:#f7dede;
  --f-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14111c; --surface:#1c1827; --sunk:#262037; --line:#382f4d;
  --fg:#ede9f6; --muted:#a79fbe; --accent:#b39cff; --accent-fg:#1a1030; --accent-soft:#33285a; --accent2:#ff9b82; --accent2-soft:#43261f;
  --ok:#6fcf8a; --ok-soft:#163423; --warn:#e6b45a; --warn-soft:#3a2c12; --bad:#f08a8a; --bad-soft:#3d1a1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14111c; --surface:#1c1827; --sunk:#262037; --line:#382f4d;
  --fg:#ede9f6; --muted:#a79fbe; --accent:#b39cff; --accent-fg:#1a1030; --accent-soft:#33285a; --accent2:#ff9b82; --accent2-soft:#43261f;
  --ok:#6fcf8a; --ok-soft:#163423; --warn:#e6b45a; --warn-soft:#3a2c12; --bad:#f08a8a; --bad-soft:#3d1a1b; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px 0;display:grid;gap:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.rx{margin:0;white-space:pre-wrap;font:13px/1.5 var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto}
.rxcard h3{margin:0;font-size:.95rem}
.rec{font-size:.82rem;background:var(--accent-soft);color:var(--fg);border-radius:8px;padding:8px 12px}
h1{margin:0;font-size:1.15rem;letter-spacing:-.01em}
h1 small{font-weight:500;color:var(--muted);font-size:.8rem;margin-left:6px}
.search{position:relative}
.search input{padding:8px 12px;border-radius:999px;font-size:.92rem;background:var(--bg)}
#qres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgb(0 0 0/.18);max-height:60vh;overflow-y:auto;z-index:8;display:grid}
.qr{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:baseline;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);font:inherit;padding:9px 12px;cursor:pointer}
.qr:hover,.qr:focus-visible{background:var(--accent-soft)}
.qr.none{display:block;color:var(--muted);font-size:.88rem;cursor:default}
.qs{font:700 .66rem var(--f-ui);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);white-space:nowrap}
.ql{font-weight:600;font-size:.92rem}
.qd{grid-column:2;font-size:.78rem;color:var(--muted)}
.favs{padding-bottom:0;align-items:center}
.favlbl{color:var(--accent2);font-size:1rem;flex:none}
.chip.fav{border-color:var(--accent2)}
.chip.fav[aria-selected="true"]{background:var(--accent2);border-color:var(--accent2);color:#fff}
.ctag{font:700 .62rem var(--f-ui);text-transform:uppercase;letter-spacing:.05em;opacity:.7;margin-right:5px}
.star{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--accent2);font:600 .78rem var(--f-ui);padding:4px 10px;border-radius:999px;cursor:pointer}
.star[aria-pressed="true"]{background:var(--accent2-soft);border-color:var(--accent2)}
.star span{color:var(--fg)}
.menu-btn{flex:none;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;place-content:center;gap:4px;cursor:pointer}
.menu-btn span{display:block;width:18px;height:2px;background:var(--fg);border-radius:2px}
.ttl{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.sec-name{font-weight:600;font-size:.92rem;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top{justify-content:flex-start}
.menu{position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);background:var(--surface);border-right:1px solid var(--line);z-index:30;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 10px calc(16px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));transform:translateX(-105%);transition:transform .22s ease;box-shadow:4px 0 24px rgb(0 0 0/.18)}
.menu-h{font-weight:700;font-size:1.05rem;padding:6px 10px 4px}
.menu-bg{position:fixed;inset:0;background:rgb(0 0 0/.35);z-index:29;opacity:0;pointer-events:none;transition:opacity .2s}
body.menu-open .menu{transform:none}
body.menu-open .menu-bg{opacity:1;pointer-events:auto}
.mg{font:700 .68rem var(--f-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 10px 4px}
.mi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--fg);font:500 .93rem var(--f-ui);padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}
.mi:hover{background:var(--sunk)}
.mi[aria-current="true"]{background:var(--sunk);color:var(--fg);font-weight:700}
.mic{width:32px;height:32px;display:grid;place-items:center;flex:none;border-radius:9px;background:var(--accent-soft);color:var(--accent)}
.mi[aria-current="true"] .mic{background:var(--accent);color:var(--accent-fg)}
.logo{display:inline-grid;align-self:center}
.sec-name{display:inline-flex;align-items:center;gap:6px;min-width:0}
.sec-name span{overflow:hidden;text-overflow:ellipsis}
.ttl h1{white-space:nowrap}
.sec-name svg{flex:none}
.hic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);margin-right:8px;vertical-align:-7px}
.mrow{display:flex;align-items:center;gap:2px}
.mrow .mi{flex:1;min-width:0}
.mx{flex:none;width:36px;height:36px;border:0;background:none;color:var(--muted);border-radius:8px;cursor:pointer;display:grid;place-items:center}
.mx:hover{background:var(--sunk)}
.mx svg{transition:transform .15s}
.mx[aria-expanded="true"] svg{transform:rotate(180deg)}
.msub{display:grid;gap:1px;padding:2px 0 8px 52px}
.msi{border:0;background:none;color:var(--fg);font:400 .86rem var(--f-ui);text-align:left;padding:6px 8px;border-radius:7px;cursor:pointer;line-height:1.3}
.msi:hover{background:var(--sunk)}
.msi[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.msi .ctag{display:inline-block;min-width:34px}
select.chip.pick{appearance:none;-webkit-appearance:none;background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600;padding-right:12px;max-width:9.5em}
.mn{margin-left:auto;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
@media (min-width:1000px){
  .menu{transform:none;box-shadow:none;width:260px;top:0}
  .menu-bg,.menu-btn{display:none}
  header,main{margin-left:260px}
  .menu-h{display:none}
}
@media print{.menu,.menu-bg{display:none!important}header,main{margin-left:0!important}}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 .85rem var(--f-ui);padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}

main .wrap{padding-block:16px 48px;display:grid;gap:16px}
.panel{display:grid;gap:14px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
h2{margin:0;font-size:1.05rem;text-wrap:balance}
.code{font:600 .72rem var(--f-mono);color:var(--muted);letter-spacing:.04em}
.note{color:var(--muted);font-size:.82rem;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}

textarea.soap{width:100%;min-height:60vh;resize:vertical;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--fg);font:13.5px/1.55 var(--f-mono);padding:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 .88rem var(--f-ui);padding:9px 14px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.small{padding:6px 10px;font-size:.8rem}
.sticky-bar{position:sticky;bottom:0;background:var(--bg);padding-block:8px calc(8px + env(safe-area-inset-bottom,0px))}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field label,.lbl{font-size:.74rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input,select{width:100%;font:500 1rem var(--f-ui);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
.inline{display:flex;gap:6px}
.inline input{flex:1}
.sexo{display:flex;gap:6px}
.sexo label{flex:1}

.result{border-radius:var(--r);padding:14px;display:grid;gap:6px;background:var(--sunk)}
.result .big{font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.result .big small{font-size:.9rem;font-weight:600;color:var(--muted);margin-left:4px}
.result .sub{font-size:.9rem}
.pill{display:inline-block;font:700 .78rem var(--f-ui);padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid currentColor}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.result.ok{background:var(--ok-soft)} .result.warn{background:var(--warn-soft)} .result.bad{background:var(--bad-soft)}
.result.ok,.result.warn,.result.bad{color:var(--fg)}
.rows{display:grid;gap:4px;font-size:.9rem;font-variant-numeric:tabular-nums}
.rows div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-block:3px}
.rows div span:first-child{color:var(--muted)}
.alert{border-left:4px solid var(--bad);background:var(--bad-soft);padding:10px 12px;border-radius:6px;font-size:.9rem}
.ex{font:600 .7rem var(--f-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--warn)}

.q{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;margin:0;display:grid;gap:8px}
.q legend{padding:0;font-size:.92rem;font-weight:500;float:left;width:100%}
.q legend b{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px;clear:both}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:block;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:.8rem;line-height:1.25;background:var(--bg);height:100%}
.opt span i{font-style:normal;font-family:var(--f-mono);color:var(--muted);margin-right:4px}
.opt input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.opt input:checked+span i{color:inherit}
.soft .opt input:checked+span{background:var(--accent-soft);color:var(--fg);border-color:var(--accent)}
.soft .opt span{padding-left:34px;position:relative}
.soft .opt span::before{content:'';position:absolute;left:10px;top:9px;width:14px;height:14px;border:2px solid var(--muted);border-radius:4px}
.soft .opt input:checked+span::before{background:var(--accent);border-color:var(--accent)}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.scale{width:100%;border-collapse:collapse;font-size:.84rem;font-variant-numeric:tabular-nums}
.scale td{padding:5px 6px;border-top:1px solid var(--line);vertical-align:top}
.scale td:first-child{white-space:nowrap;font-weight:600;width:1%}
.scale tr.on td{background:var(--accent-soft)}
details{font-size:.86rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:.88rem;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
footer{color:var(--muted);font-size:.78rem}
.flow{display:grid;gap:0;counter-reset:st}
.node{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;font-size:.9rem}
.node h3{margin:0;font-size:.95rem}
.node.step h3::before{counter-increment:st;content:counter(st);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:.75rem;margin-right:8px;vertical-align:1px}
.node.dec{border-style:dashed;border-color:var(--warn);background:var(--warn-soft)}
.node.dec h3{color:var(--fg)}
.node.goal{background:var(--ok-soft);border-color:var(--ok)}
.node ul{margin:0;padding-left:18px;display:grid;gap:3px}
.arrow{justify-self:center;width:2px;height:22px;background:var(--line);position:relative}
.arrow::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--line);border-bottom:0}
.arrow:has(span){height:34px}
.arrow span{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:min(280px,calc(50vw - 36px));font:600 .72rem/1.2 var(--f-ui);color:var(--muted)}
.branch{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.branch .node{font-size:.85rem;align-content:start}
.tag{font:700 .68rem var(--f-ui);text-transform:uppercase;letter-spacing:.06em}
.tag.ok{color:var(--ok)} .tag.warn{color:var(--warn)} .tag.bad{color:var(--bad)}
.node.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--fg)} .node.bad h3{color:var(--bad)}
.branch .node.br-bad{border-left:4px solid var(--bad)} .branch .node.br-warn{border-left:4px solid var(--warn)} .branch .node.br-ok{border-left:4px solid var(--ok)}
.node .sub{color:var(--muted);font-size:.82rem}
.edtag{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:999px;background:var(--accent2-soft);color:var(--accent2);font:700 .66rem var(--f-ui);text-transform:uppercase;letter-spacing:.05em;vertical-align:2px}
.edf{display:grid;gap:10px}
.edf textarea,textarea.nota{width:100%;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:13.5px/1.5 var(--f-mono);padding:10px}
textarea.nota{font-family:var(--f-ui);font-size:.9rem}
.btn svg{vertical-align:-2px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.lbl-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbl-row .btn{text-transform:none;letter-spacing:0}
.edlist{display:grid;gap:6px}
.edrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--fg);font:500 .88rem var(--f-ui);cursor:pointer}
.edrow .edtag{margin:0}
.pdt td:first-child{white-space:normal;width:38%}
.gl{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.9rem}
.gsvg svg{width:100%;max-width:420px;height:auto;display:block;margin:0 auto;color:var(--fg)}
.gsvg svg.ecg{max-width:640px;border-radius:6px}
.toc .tocl{display:flex;flex-wrap:wrap;gap:6px}
.toc .chip{flex:0 1 auto;max-width:100%;white-space:normal;text-align:left;line-height:1.3;font-size:.82rem;padding:5px 11px}
.totop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:6;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.totop:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}
.atsheet{background:#fff;color:#111;padding:28px 24px;font:15px/1.6 Georgia,'Times New Roman',serif;gap:22px}
.ath{text-align:center;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:.85rem}
.att{text-align:center;font-weight:700;letter-spacing:.06em}
.atb{white-space:normal;text-align:justify}
.atf{text-align:center}
.rxsheet{display:none}
.chip.tag{font-size:.74rem;padding:3px 9px;cursor:default;white-space:normal}
.chip.tag.ok{border-color:var(--ok);color:var(--ok)}.chip.tag.warn{border-color:var(--warn);color:var(--warn)}.chip.tag.bad{border-color:var(--bad);color:var(--bad)}
.farmb{gap:4px}
@media (hover:hover) and (pointer:fine){.chips{scrollbar-width:thin;scrollbar-color:var(--line) transparent;padding-bottom:8px}.chips::-webkit-scrollbar{display:block;height:8px}.chips::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}.chips::-webkit-scrollbar-track{background:transparent}}
.side{display:none}
.sdh{font:700 .68rem var(--f-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:4px 8px 8px}
@media (min-width:1180px){body.hasside .side{display:grid;align-content:start;gap:1px;position:fixed;top:0;right:0;bottom:0;width:240px;overflow-y:auto;background:var(--surface);border-left:1px solid var(--line);padding:16px 10px;z-index:6}
 body.hasside header,body.hasside main{margin-right:240px}}
@media print{.side{display:none!important}}
.rxp{white-space:pre-wrap;font:14px/1.65 var(--f-mono);min-height:40vh}
textarea.soap.rxta{min-height:0;overflow:hidden}
.srxv{margin:0;padding-bottom:4px;flex-wrap:wrap;overflow:visible}
.srxv .chip{flex:0 1 auto;max-width:100%;white-space:normal;text-align:left}
.rxpac{display:flex;gap:8px;align-items:flex-end}.rxpac span{flex:1;border-bottom:1px solid #111;height:1.2em}

1. Levonorgestrel 0,15 mg + etinilestradiol 0,03 mg ...... 3 cartelas
   Tomar 1 comprimido por dia, no mesmo horário, por 21 dias. Fazer pausa de 7 dias e iniciar nova cartela no 8º dia.`,n:'Iniciar até o 5º dia da menstruação (ou a qualquer momento, com preservativo por 7 dias). Contraindicada em: enxaqueca com aura, tabagista ≥ 35 anos, HAS não controlada, TEV prévio ou trombofilia, < 6 semanas pós-parto amamentando, doença hepática ativa.'},
 {t:'Minipílula (amamentação ou contraindicação a estrogênio)',rx:`Uso oral
1. Noretisterona 0,35 mg ...... 3 cartelas
   Tomar 1 comprimido por dia, sempre no mesmo horário, sem pausa entre as cartelas.`,n:'Atraso > 3 h: usar preservativo por 2 dias. Alternativa: desogestrel 75 mcg contínuo (atraso tolerado de 12 h), conforme disponibilidade.'},
 {t:'Injetável mensal',rx:`Uso intramuscular
1. Enantato de noretisterona 50 mg + valerato de estradiol 5 mg ...... 1 ampola
   Aplicar 1 ampola IM profunda no 1º dia da menstruação; depois a cada 30 dias (± 3 dias).`,n:'Mesmas contraindicações da pílula combinada.'},
 {t:'Injetável trimestral',rx:`Uso intramuscular
1. Acetato de medroxiprogesterona 150 mg/mL ...... 1 ampola
   Aplicar 1 ampola IM profunda a cada 3 meses (12 semanas).`,n:'Pode ser aplicada com até 4 semanas de atraso. Opção na amamentação. Orientar sangramento irregular/amenorreia e retorno da fertilidade mais lento.'},
 {t:'Contracepção de emergência',rx:`Uso oral
1. Levonorgestrel 1,5 mg ...... 1 comprimido
   Tomar 1 comprimido, dose única, o quanto antes após a relação desprotegida (até 5 dias).`,n:'Mais eficaz nas primeiras 72 h. Alternativa: 2 comprimidos de 0,75 mg juntos. Oferecer método contínuo e testagem para IST.'}]},
rx_trh:{s:'TRH',t:'Terapia hormonal no climatério',rec:RS+'. Conferir contraindicações e a janela (menos de 60 anos ou menos de 10 anos de menopausa)',items:[
 {t:'Com útero: estradiol gel + progesterona contínua',rx:`Uso tópico
1. Estradiol gel 0,06% ...... 1 frasco
   Aplicar 1 dose do aplicador (0,75 mg) por dia na pele do braço ou da coxa, longe das mamas. Não lavar o local por 1 hora.

Uso oral
2. Progesterona micronizada 100 mg ...... 30 cápsulas
   Tomar 1 cápsula à noite, todos os dias.`,n:'Via transdérmica preferida se obesidade, HAS, DM, tabagismo, enxaqueca, TG alto ou risco de TEV. Perimenopausa (menos de 1 ano de amenorreia): progesterona 200 mg à noite do dia 1 ao 12 de cada mês.'},
 {t:'Com útero: estradiol oral + progesterona cíclica',rx:`Uso oral
1. Estradiol 1 mg ...... 30 comprimidos
   Tomar 1 comprimido por dia, todos os dias.
2. Progesterona micronizada 200 mg ...... 12 cápsulas
   Tomar 1 cápsula à noite do 1º ao 12º dia de cada mês.`,n:'Sangramento de privação esperado após o progestagênio. Alternativas ao progestagênio: didrogesterona 10 mg ou medroxiprogesterona 10 mg por 12–14 dias; ou DIU de levonorgestrel 52 mg.'},
 {t:'Sem útero: estrogênio isolado',rx:`Uso oral
1. Estrogênios conjugados 0,3 mg ...... 30 comprimidos
   Tomar 1 comprimido por dia, todos os dias.`,n:'Opções: estradiol 1 mg VO ou estradiol gel 0,5–1,5 mg/dia. Histerectomizada não precisa de progestagênio (exceto endometriose).'},
 {t:'Pós-menopausa > 1 ano: tibolona',rx:`Uso oral
1. Tibolona 2,5 mg ...... 30 comprimidos
   Tomar 1 comprimido por dia, todos os dias.`,n:'Pode usar 1,25 mg. Não associar progestagênio. Evitar após 60 anos e se câncer de mama prévio.'},
 {t:'Síndrome geniturinária: estrogênio vaginal',rx:`Uso vaginal
1. Estriol creme vaginal 1 mg/g ...... 1 bisnaga com aplicador
   Aplicar 1 aplicador cheio (0,5 g) na vagina à noite, por 3 semanas. Depois, 2 vezes por semana.`,n:'Alternativa: promestrieno 10 mg/g. Dose baixa: não precisa de progestagênio. Associar hidratante e lubrificante vaginal.'},
 {t:'Sem hormônio: ondas de calor',rx:`Uso oral
1. Venlafaxina 37,5 mg ...... 30 cápsulas
   Tomar 1 cápsula pela manhã, após o café. Após 1 semana, se necessário, 2 cápsulas (75 mg).`,n:'Receita de controle especial (C1). Alternativas: desvenlafaxina 50 mg, escitalopram 10 mg, paroxetina 7,5–10 mg (evitar com tamoxifeno), gabapentina 300 mg à noite até 900 mg.'}]},
rx_glp1:{s:'GLP-1 (Ozempic, Mounjaro)',t:'Agonistas de GLP-1 e tirzepatida',rec:'Receita em 2 vias com retenção na farmácia (Anvisa, RDC 973/2025), validade de 90 dias; conferir norma vigente',items:[
 {t:'Semaglutida SC (Ozempic) no DM2',rx:`Uso subcutâneo
1. Semaglutida 0,25 mg/0,5 mg caneta (Ozempic) ...... 1 caneta
   Aplicar 0,25 mg por via subcutânea 1 vez por semana, sempre no mesmo dia, por 4 semanas. Depois, 0,5 mg 1 vez por semana.
   Agulha nova a cada aplicação.`,n:'Após pelo menos 4 semanas em 0,5 mg, pode subir para 1 mg e depois 2 mg por semana se a HbA1c não estiver na meta. Reduzir sulfonilureia ou insulina ao iniciar (risco de hipoglicemia).'},
 {t:'Semaglutida SC (Wegovy) na obesidade',rx:`Uso subcutâneo
1. Semaglutida (Wegovy) caneta ...... conforme a dose do mês
   Aplicar por via subcutânea 1 vez por semana, no mesmo dia:
   semanas 1 a 4: 0,25 mg | semanas 5 a 8: 0,5 mg | semanas 9 a 12: 1 mg
   semanas 13 a 16: 1,7 mg | a partir da semana 17: 2,4 mg (manutenção).`,n:'Indicação: IMC ≥ 30, ou ≥ 27 com comorbidade, junto com MEV. Se não tolerar um degrau, ficar mais 4 semanas na dose anterior. Reavaliar: perda menor que 5% após 3 meses na dose de manutenção pede revisão.'},
 {t:'Tirzepatida (Mounjaro): DM2 ou obesidade',rx:`Uso subcutâneo
1. Tirzepatida 2,5 mg caneta (Mounjaro) ...... 1 caneta
   Aplicar 2,5 mg por via subcutânea 1 vez por semana, sempre no mesmo dia, por 4 semanas. Depois, 5 mg 1 vez por semana.`,n:'2,5 mg é só dose de início. Subir 2,5 mg a cada 4 semanas ou mais se precisar: 7,5, 10, 12,5 até 15 mg por semana. Reduz a absorção do anticoncepcional oral: preservativo por 4 semanas após iniciar e após cada aumento (ou método não oral).'},
 {t:'Liraglutida (Saxenda) na obesidade',rx:`Uso subcutâneo
1. Liraglutida 6 mg/mL caneta (Saxenda) ...... 3 canetas
   Aplicar 1 vez ao dia por via subcutânea, no mesmo horário:
   semana 1: 0,6 mg | semana 2: 1,2 mg | semana 3: 1,8 mg | semana 4: 2,4 mg | a partir da semana 5: 3 mg.`,n:'No DM2 (Victoza): 0,6 mg/dia por 1 semana, depois 1,2 mg, até 1,8 mg/dia. Diária: opção se a pessoa prefere aplicação diária ou para custo.'},
 {t:'Semaglutida oral (Rybelsus) no DM2',rx:`Uso oral
1. Semaglutida 3 mg ...... 30 comprimidos
   Tomar 1 comprimido por dia em jejum, com no máximo meio copo de água (120 mL), e esperar 30 minutos antes de comer, beber ou tomar outros remédios.`,n:'Após 30 dias, 7 mg por dia; se precisar, 14 mg após mais 30 dias. Não partir nem mastigar.'}]},
rx_bip:{s:'Bipolar',t:'Transtorno bipolar: estabilizadores de humor',rec:RC,items:[
 {t:'Carbonato de lítio',rx:`Uso oral
1. Carbonato de lítio 300 mg ...... 60 comprimidos
   Tomar 1 comprimido de 12 em 12 horas, após as refeições. Beber 2 a 3 litros de água por dia.`,n:'Antes: creatinina, TSH, cálcio, sódio, β-hCG e ECG (se > 40 anos ou cardiopatia). Litemia 5–7 dias após início e cada ajuste, 12 h após a última dose: alvo 0,6–1,0 mEq/L (manutenção 0,6–0,8). Depois litemia a cada 3–6 meses; creatinina e TSH a cada 6–12 meses. Intoxicação (tremor grosseiro, vômito, diarreia, ataxia, confusão): suspender e urgência. Aumentam a litemia: AINE, IECA/BRA, tiazídico, desidratação.'},
 {t:'Ácido valproico / divalproato',rx:`Uso oral
1. Divalproato de sódio 250 mg ...... 60 comprimidos
   Tomar 1 comprimido de 12 em 12 horas. Aumentar conforme orientação até 750–1.500 mg por dia.`,n:'Nível sérico 50–125 mcg/mL. Hemograma (plaquetas), TGO/TGP e peso no início e a cada 6–12 meses. Evitar em mulher em idade fértil (teratogênico, síndrome do ovário policístico): se usar, contracepção eficaz e ácido fólico. Interage com lamotrigina (dobra o nível dela).'},
 {t:'Carbamazepina',rx:`Uso oral
1. Carbamazepina 200 mg ...... 60 comprimidos
   Tomar 1 comprimido de 12 em 12 horas. Aumentar conforme orientação até 400–1.200 mg por dia.`,n:'Hemograma, sódio e TGO/TGP no início, em 1–2 meses e depois a cada 6–12 meses. Indutora enzimática: reduz anticoncepcional, varfarina e outros. Rash: suspender (risco de Stevens-Johnson).'},
 {t:'Quetiapina (mania ou depressão bipolar)',rx:`Uso oral
1. Quetiapina 25 mg ...... 60 comprimidos
   Tomar 2 comprimidos (50 mg) à noite. Aumentar conforme orientação.`,n:'Depressão bipolar: 50 mg → 300 mg à noite em 4 dias. Mania: 400–800 mg/dia. Sedação, ganho de peso, síndrome metabólica: peso, glicemia e lipídios no início, em 3 meses e anual. Na rede pública, via componente especializado.'},
 {t:'Lamotrigina (manutenção e depressão bipolar)',rx:`Uso oral
1. Lamotrigina 25 mg ...... 30 comprimidos
   Tomar 1 comprimido por dia por 2 semanas; depois 2 comprimidos (50 mg) por dia por 2 semanas; depois 4 comprimidos (100 mg) por dia por 1 semana; depois 200 mg por dia.`,n:'Titulação lenta é obrigatória (rash grave). Com valproato: metade das doses. Não trata mania aguda. Não usar antidepressivo sozinho no bipolar (risco de virada maníaca).'}]},
rx_esq:{s:'Esquizofrenia',t:'Esquizofrenia e psicoses: antipsicóticos',rec:RC,items:[
 {t:'Olanzapina',rx:`Uso oral
1. Olanzapina 5 mg ...... 30 comprimidos
   Tomar 1 a 2 comprimidos à noite.`,n:'Dose usual 10–20 mg/dia. Muito ganho de peso e risco metabólico. Na rede pública via componente especializado (LME).'},
 {t:'Clorpromazina',rx:`Uso oral
1. Clorpromazina 100 mg ...... 30 comprimidos
   Tomar 1 comprimido à noite. Aumentar conforme orientação.`,n:'Dose usual 300–600 mg/dia. Sedação, hipotensão postural, efeito anticolinérgico, fotossensibilidade. Também em solução 40 mg/mL (1 gota = 1 mg).'},
 {t:'Haloperidol decanoato (depósito)',rx:`Uso intramuscular
1. Haloperidol decanoato 50 mg/mL ...... 1 ampola
   Aplicar 1 ampola (50 mg) IM profunda no glúteo a cada 4 semanas.`,n:'Para baixa adesão. Dose mensal ≈ 10–15 × a dose oral diária de haloperidol (máx. 100 mg na 1ª aplicação). Testar a tolerância ao haloperidol oral antes.'},
 {t:'Efeitos extrapiramidais',rx:`Uso oral
1. Biperideno 2 mg ...... 30 comprimidos
   Tomar 1 comprimido até 3 vezes ao dia se rigidez ou tremor.
2. Propranolol 40 mg ...... 30 comprimidos
   Tomar meio comprimido (20 mg) de 12 em 12 horas se inquietação (acatisia).`,n:'Distonia aguda (torção de pescoço, olhos para cima): biperideno 5 mg IM ou prometazina 50 mg IM. Discinesia tardia: encaminhar. Febre, rigidez intensa e confusão: síndrome neuroléptica maligna, emergência.'},
 {t:'Quetiapina',rx:`Uso oral
1. Quetiapina 25 mg ...... 30 comprimidos
2. Quetiapina 100 mg ...... 60 comprimidos
   Dia 1: 25 mg de 12 em 12 horas. Dia 2: 50 mg de 12 em 12 horas. Dia 3: 100 mg de 12 em 12 horas. Dia 4: 150 mg de 12 em 12 horas.
   Depois: 150 a 300 mg de 12 em 12 horas, conforme orientação.`,n:'Esquizofrenia: dose usual 300–750 mg/dia (máx. 800). Liberação prolongada (XR): 1 vez ao dia à noite. Sedação e hipotensão postural no início; ganho de peso, glicemia e lipídios (monitorar); menos extrapiramidal e prolactina que risperidona e haloperidol. Cautela com QT longo. Idoso com demência: aumenta mortalidade, evitar. Na rede pública pelo componente especializado (LME, PCDT de esquizofrenia). Receita de Controle Especial (C1) em 2 vias.'}]},
rx_alc:{s:'Álcool e drogas',t:'Álcool e outras drogas',rec:RC+' (diazepam: '+RB+')',items:[
 {t:'Abstinência alcoólica leve a moderada (ambulatorial)',rx:`Uso oral
1. Diazepam 10 mg ...... 20 comprimidos
   Dia 1: 1 comprimido de 6 em 6 horas. Dia 2: de 8 em 8 horas. Dia 3: de 12 em 12 horas. Dias 4 e 5: 1 comprimido à noite. Suspender após.
2. Tiamina 300 mg ...... 30 comprimidos
   Tomar 1 comprimido por dia.`,n:'Só ambulatorial se CIWA-Ar < 10–15, sem convulsão ou delirium prévios, com acompanhante e retorno em 24–48 h. Hepatopatia ou idoso: lorazepam 1–2 mg 8/8 h. Tiamina 100 mg IM antes de glicose se desnutrido. CIWA-Ar > 15, convulsão, alucinação ou confusão: emergência. Diazepam em Notificação B (azul).'},
 {t:'Naltrexona (reduzir consumo e recaída)',rx:`Uso oral
1. Naltrexona 50 mg ...... 30 comprimidos
   Tomar 1 comprimido por dia.`,n:'Não usar com opioides (precipita abstinência), em hepatite aguda ou insuficiência hepática. TGO/TGP no início e em 1–3 meses. Duração mínima de 3–6 meses com acompanhamento.'},
 {t:'Dissulfiram (só com desejo e consentimento)',rx:`Uso oral
1. Dissulfiram 250 mg ...... 30 comprimidos
   Tomar 1 comprimido pela manhã. Iniciar só após 12 horas ou mais sem álcool.`,n:'Nunca dar sem o conhecimento da pessoa. Com álcool causa rubor, vômito, taquicardia e hipotensão (perigoso). Evitar em cardiopatia, psicose, gestação. Cuidado com álcool escondido (xaropes, perfume, vinagre).'},
 {t:'Cocaína e crack: sintomas',rx:`Uso oral
1. Diazepam 10 mg ...... 10 comprimidos
   Tomar 1 comprimido se ansiedade ou agitação intensa, até 3 vezes ao dia, por poucos dias.`,n:'Não há remédio específico para a dependência de cocaína: acolhimento, redução de danos, TCC, CAPS AD, tratar comorbidades (depressão, TDAH). Dor torácica após cocaína: urgência, benzodiazepínico e evitar betabloqueador. Topiramato tem evidência fraca.'}]},
rx_bul:{s:'Bulimia',t:'Bulimia e compulsão alimentar',rec:RC,items:[
 {t:'Fluoxetina (bulimia nervosa)',rx:`Uso oral
1. Fluoxetina 20 mg ...... 90 cápsulas
   Tomar 1 cápsula pela manhã por 1 semana; depois 2 cápsulas por 1 semana; depois 3 cápsulas (60 mg) pela manhã.`,n:'Dose de bulimia é 60 mg/dia (maior que na depressão). Sempre com psicoterapia (TCC) e nutricionista. Dosar potássio e magnésio e fazer ECG se purgação frequente. Bupropiona é contraindicada (convulsão). Encaminhar ao CAPS ou ambulatório especializado se IMC < 17,5, distúrbio eletrolítico, purgação diária, ideação suicida, gestação ou sem resposta.'},
 {t:'Transtorno de compulsão alimentar (adulto)',rx:`Uso oral
1. Lisdexanfetamina 30 mg ...... 30 cápsulas
   Tomar 1 cápsula pela manhã. Aumentar 20 mg por semana até 50–70 mg.`,n:'Aprovada para compulsão alimentar moderada a grave em adultos. Notificação de Receita A (amarela). Alternativa: topiramato (off-label) ou ISRS; TCC é a 1ª linha.'}]},
rx_tdah:{s:'TDAH',t:'TDAH: criança e adulto',rec:'Estimulantes: Notificação de Receita A (amarela) + receita, validade 30 dias, até 30 dias de tratamento. Atomoxetina e bupropiona: Receita de Controle Especial (C1)',items:[
 {t:'Metilfenidato de curta ação',rx:`Uso oral
1. Metilfenidato 10 mg ...... 30 comprimidos
   Tomar meio comprimido (5 mg) no café da manhã e meio no almoço. Aumentar 5–10 mg por semana conforme orientação.`,n:'Criança ≥ 6 anos e adulto. Dose usual 0,3–1 mg/kg/dia (máx. 60 mg/dia), 2–3 tomadas, a última até 16 h (insônia). Efeito de 3–4 h.'},
 {t:'Metilfenidato de longa ação',rx:`Uso oral
1. Metilfenidato de liberação prolongada 18 mg (OROS) ...... 30 comprimidos
   Tomar 1 comprimido pela manhã, inteiro. Aumentar 18 mg por semana conforme orientação.`,n:'Máx. 54 mg (criança) ou 72 mg (adulto). Alternativa: metilfenidato LA cápsula 10–40 mg pela manhã. Efeito de 8–12 h.'},
 {t:'Lisdexanfetamina',rx:`Uso oral
1. Lisdexanfetamina 30 mg ...... 30 cápsulas
   Tomar 1 cápsula pela manhã. A cápsula pode ser aberta e dissolvida em água ou iogurte.`,n:'≥ 6 anos. Aumentar 10–20 mg por semana até 30–70 mg. Menor potencial de abuso entre os estimulantes. Notificação A.'},
 {t:'Atomoxetina (não estimulante)',rx:`Uso oral
1. Atomoxetina 40 mg ...... 30 cápsulas
   Tomar 1 cápsula pela manhã por 1 semana; depois, conforme orientação, até 80 mg por dia.`,n:'Criança < 70 kg: 0,5 mg/kg/dia por 3 dias, depois 1,2 mg/kg/dia (máx. 1,4 mg/kg ou 100 mg). Efeito em 4–8 semanas. Opção com tiques, ansiedade ou uso de substâncias. Alerta: ideação suicida no início, hepatotoxicidade rara. Receita C1.'},
 {t:'Alternativas',rx:`Uso oral
1. Clonidina 0,1 mg ...... 30 comprimidos
   Tomar meio comprimido à noite por 1 semana; depois 1 comprimido à noite.`,n:'Off-label para criança com tiques ou insônia, associada ou isolada (checar PA e FC, não suspender de repente). Adulto: bupropiona 150–300 mg (C1). Antes de tratar: rastreio com SNAP-IV (criança) ou ASRS-18 (adulto), avaliar comorbidades, PA, FC, peso e altura; ECG se cardiopatia, síncope ou morte súbita na família. Contraindicações dos estimulantes: cardiopatia estrutural, arritmia, HAS não controlada, hipertireoidismo, glaucoma, IMAO, psicose, anorexia. Seguimento: PA, FC, peso e altura (curva) a cada consulta; pausas no fim de semana só se perda de peso ou crescimento.'}]},
rx_ans:{s:'Ansiolíticos',t:'Ansiolíticos e hipnóticos',rec:RB+' para benzodiazepínicos',items:[
 {t:'Crise de ansiedade / uso curto',rx:`Uso oral
1. Clonazepam 0,5 mg ...... 30 comprimidos
   Tomar ½ a 1 comprimido até 2 vezes ao dia, se necessário, por até 2 semanas.`,n:'Benzodiazepínico só por tempo curto, enquanto o ISRS começa a agir. Evitar em idosos (quedas), gestantes, etilistas e DPOC grave. Não associar a álcool nem dirigir.'},
 {t:'Diazepam (abstinência leve ou ansiedade aguda)',rx:`Uso oral
1. Diazepam 5 mg ...... 30 comprimidos
   Tomar 1 comprimido até 3 vezes ao dia, se necessário, por até 2 semanas.`,n:'Meia-vida longa: preferido para desmame de outros benzodiazepínicos.'},
 {t:'Ansiolítico não benzodiazepínico',rx:`Uso oral
1. Hidroxizina 25 mg ...... 30 comprimidos
   Tomar 1 comprimido à noite ou até 3 vezes ao dia, se necessário.`,n:'Receita simples. Causa sonolência. Para ansiedade crônica, o tratamento de escolha é ISRS + psicoterapia (aba Antidepressivos).'},
 {t:'Desmame de benzodiazepínico',rx:`Uso oral
1. Diazepam 5 mg ...... [__] comprimidos
   Tomar [__] comprimido(s) por dia. Reduzir [¼ de comprimido] a cada 2 semanas, conforme orientação.`,n:'Reduzir 10–25% da dose a cada 1–2 semanas; desacelerar na fase final. Converter para diazepam (clonazepam 0,5 mg ≈ diazepam 10 mg; alprazolam 0,5 mg ≈ diazepam 10 mg; lorazepam 1 mg ≈ diazepam 10 mg).'}]},
rx_ad:{s:'Antidepressivos',t:'Antidepressivos',rec:RC,items:[
 {t:'Fluoxetina',rx:`Uso oral
1. Fluoxetina 20 mg ...... 30 cápsulas
   Tomar 1 cápsula pela manhã, após o café.`,n:'Ansiedade intensa: iniciar 10 mg. Dose máxima 60–80 mg/dia. Efeito em 2–4 semanas; reavaliar em 4 semanas e aumentar 20 mg se resposta parcial. Manter 6–12 meses após remissão.'},
 {t:'Sertralina',rx:`Uso oral
1. Sertralina 50 mg ...... 30 comprimidos
   Tomar ½ comprimido por dia por 7 dias, depois 1 comprimido por dia.`,n:'Dose máxima 200 mg/dia, aumentos de 50 mg a cada 2–4 semanas. Boa opção em cardiopatas, gestantes e lactantes. Disponibilidade varia: conferir REMUME.'},
 {t:'Escitalopram',rx:`Uso oral
1. Escitalopram 10 mg ...... 30 comprimidos
   Tomar 1 comprimido por dia, pela manhã.`,n:'Ansiedade intensa ou idosos: iniciar 5 mg (½ comprimido) por 1 semana. Dose máxima 20 mg/dia (10 mg em > 65 anos ou hepatopatia). Pode prolongar o QT: cuidado com outros fármacos que prolongam QT e cardiopatia. Bem tolerado, poucas interações. Disponibilidade no SUS varia: conferir REMUME.'},
 {t:'Amitriptilina',rx:`Uso oral
1. Amitriptilina 25 mg ...... 30 comprimidos
   Tomar 1 comprimido à noite.`,n:'Dor crônica, enxaqueca, insônia: 12,5–50 mg à noite. Depressão: até 150 mg/dia. Evitar em idosos, cardiopatas (ECG se > 40 anos ou cardiopatia), glaucoma de ângulo fechado e HPB. Risco em superdosagem: dispensar pouca quantidade se risco de suicídio.'},
 {t:'Nortriptilina',rx:`Uso oral
1. Nortriptilina 25 mg ...... 30 cápsulas
   Tomar 1 cápsula à noite.`,n:'Tricíclico mais bem tolerado que a amitriptilina (menos hipotensão e sedação). Dose usual 50–150 mg/dia.'}]},
rx_ap:{s:'Antipsicóticos',t:'Antipsicóticos',rec:RC,items:[

 {t:'Agitação psicomotora (na unidade)',rx:`Uso intramuscular
1. Haloperidol 5 mg/mL ...... 1 ampola
   Aplicar 1 ampola IM.
2. Prometazina 25 mg/mL ...... 2 ampolas
   Aplicar 2 ampolas (50 mg) IM.`,n:'Antes: abordagem verbal e ambiente seguro. Monitorar sinais vitais. Pode repetir em 30–60 min. Avaliar causa orgânica (hipoglicemia, intoxicação, abstinência). Acionar SAMU/CAPS conforme o caso.'},
 {t:'Risperidona',rx:`Uso oral
1. Risperidona 1 mg ...... 60 comprimidos
   Tomar 1 comprimido à noite por 3 dias, depois 1 comprimido de 12 em 12 horas.`,n:'Dose usual 2–6 mg/dia. Monitorar peso, glicemia, lipídios e prolactina. Início em primeiro episódio psicótico deve ser compartilhado com CAPS/psiquiatria.'}]},
rx_anal:{s:'Analgésicos',t:'Analgésicos e anti-inflamatórios',rec:RS+' (opioides: '+RA2+')',items:[
 {t:'Dipirona',rx:`Uso oral
1. Dipirona 500 mg ...... 20 comprimidos
   Tomar 1 a 2 comprimidos de 6 em 6 horas, se dor ou febre.`,n:'Máximo 4 g/dia. Gotas: 500 mg/mL, 20 gotas ≈ 500 mg.'},
 {t:'Paracetamol',rx:`Uso oral
1. Paracetamol 500 mg ...... 20 comprimidos
   Tomar 1 a 2 comprimidos de 6 em 6 horas, se dor ou febre.`,n:'Máximo 4 g/dia (3 g em idosos, etilistas e hepatopatas). Preferido na gestação.'},
 {t:'Ibuprofeno',rx:`Uso oral
1. Ibuprofeno 600 mg ...... 15 comprimidos
   Tomar 1 comprimido de 8 em 8 horas, após as refeições, por até 5 dias.`,n:'Evitar em DRC (TFG < 30), úlcera ou sangramento digestivo, ICC, uso de anticoagulante, 3º trimestre de gestação. Considerar omeprazol em idosos.'},
 {t:'Enxaqueca: crise',rx:`Uso oral
1. Sumatriptano 50 mg ...... 6 comprimidos
   Tomar 1 comprimido no início da crise. Se a dor voltar, pode repetir após 2 horas. Máximo de 4 comprimidos (200 mg) em 24 horas.
2. Naproxeno 500 mg ...... 10 comprimidos
   Tomar 1 comprimido no início da crise, junto com o sumatriptano, se necessário.`,n:'Contraindicado em DAC, AVC/AIT prévio, doença arterial periférica, HAS não controlada, enxaqueca hemiplégica ou com aura de tronco, uso de ergotamina nas últimas 24 h. Cuidado com ISRS/IRSN (síndrome serotoninérgica). Limitar a ≤ 9 dias/mês para evitar cefaleia por uso excessivo. ≥ 4 crises/mês: profilaxia (propranolol 40–160 mg/dia, amitriptilina 12,5–50 mg à noite, topiramato). Crise leve: dipirona 1 g ou AINE + metoclopramida 10 mg.'},
 {t:'Cólica abdominal / renal',rx:`Uso oral
1. Butilbrometo de escopolamina 10 mg ...... 20 comprimidos
   Tomar 1 comprimido de 8 em 8 horas, se dor.
2. Dipirona 500 mg ...... 20 comprimidos
   Tomar 2 comprimidos de 6 em 6 horas, se dor.`,n:'Cólica renal: acrescentar AINE se não houver contraindicação. Febre, anúria ou dor refratária: encaminhar.'},
 {t:'Dor moderada (opioide fraco)',rx:`Uso oral
1. Paracetamol 500 mg + codeína 30 mg ...... 20 comprimidos
   Tomar 1 comprimido de 6 em 6 horas, se dor, por até 5 dias.`,n:'Receita de Controle Especial em 2 vias. Alternativa: tramadol 50 mg 1 cápsula 8/8 h (máx. 400 mg/dia; risco de convulsão e síndrome serotoninérgica com ISRS). Prescrever laxativo se uso > 3 dias.'},
 {t:'Cefaleia e enxaqueca na gestante: crise',rx:`Uso oral
1. Paracetamol 750 mg ...... 20 comprimidos
   Tomar 1 a 2 comprimidos (até 1 g) no início da dor, se necessário de 6 em 6 horas. Máximo de 4 g por dia.
2. Metoclopramida 10 mg ...... 10 comprimidos
   Tomar 1 comprimido junto com o paracetamol, se náusea ou crise de enxaqueca, até de 8 em 8 horas.
3. Rizatriptana 10 mg ...... 4 comprimidos
   Se a dor não melhorar em 2 horas com o paracetamol, tomar 1 comprimido. Pode repetir após 2 horas se a dor voltar. Máximo de 2 comprimidos por dia.`,n:'Triptano se o paracetamol não resolver: rizatriptana 10 mg (5 mg se usa propranolol, máximo de 3 cp de 5 mg ao dia) ou sumatriptano 50 mg; os registros de gestantes não mostram aumento de malformações (sumatriptano tem mais dados). Não constam na RENAME: compra própria. Na urgência: metoclopramida 10 mg IV/IM, clorpromazina 0,1 mg/kg IM/IV ou prometazina 25 mg IM, com hidratação. Dipirona só pontual e evitar no 3º trimestre. Contraindicados: ergotamina e derivados (uterotônicos), AINE após 20 semanas, AAS em dose analgésica, valproato, topiramato. Profilaxia se crises frequentes: propranolol 20–40 mg 12/12 h ou amitriptilina 10–25 mg à noite. Cefaleia nova ou diferente após 20 semanas: medir PA e pensar em pré-eclâmpsia; sinais de alarme (pior dor da vida, déficit, febre, convulsão, puerpério): urgência.'}]},
rx_tab:{s:'Tabagismo',t:'Tratamento do tabagismo',rec:RS+' (bupropiona: '+RC+')',items:[
 {t:'Adesivo de nicotina',rx:`Uso transdérmico

2. Nicotina adesivo 14 mg ...... 14 adesivos
   Aplicar 1 adesivo por dia por 2 semanas.
3. Nicotina adesivo 7 mg ...... 14 adesivos
   Aplicar 1 adesivo por dia por 2 semanas.`,n:'Mais de 20 cigarros/dia: iniciar 21 mg. 10–20 cigarros/dia: iniciar 14 mg. Retirar à noite se insônia ou sonhos vívidos. Parar de fumar no dia em que começar o adesivo.'},
 {t:'Goma ou pastilha de nicotina (fissura)',rx:`Uso oral
1. Nicotina goma de mascar 2 mg ...... [__] unidades
   Mascar 1 goma quando houver fissura, até 15 por dia, por até 12 semanas. Mascar até sentir o sabor e deixar parada entre a bochecha e a gengiva.`,n:'Associar ao adesivo é mais eficaz que cada um isolado. Não comer nem beber 15 min antes e durante o uso.'},
 {t:'Bupropiona',rx:`Uso oral
1. Bupropiona 150 mg ...... 60 comprimidos
   Tomar 1 comprimido pela manhã por 3 dias, depois 1 comprimido pela manhã e 1 às 16 h (intervalo mínimo de 8 h), por 12 semanas.`,n:'Iniciar 1–2 semanas antes da data de parada. Contraindicada em epilepsia, transtorno alimentar, uso de IMAO, abstinência de álcool ou benzodiazepínico. Controlar PA.'}]},

rx_par:{s:'Antiparasitários',t:'Antiparasitários e ectoparasitoses',rec:RS,items:[

1. Metronidazol 250 mg ...... 15 comprimidos

 {t:'Escabiose',rx:`Uso tópico
1. Permetrina loção 5% ...... 1 frasco
   Aplicar do pescoço aos pés à noite e retirar no banho após 8 a 12 horas. Repetir após 7 dias.`,n:'Alternativa: ivermectina 6 mg, 200 mcg/kg dose única, repetir em 7–14 dias (não usar em gestantes e < 15 kg). Tratar contactantes; lavar roupas de cama e uso em água quente.'},

rx_cv:{s:'HAS e ICC',t:'Hipertensão e insuficiência cardíaca',rec:'Receita simples (uso contínuo; validade conforme protocolo local)',items:[
 {t:'HAS: BRA',rx:`Uso oral
1. Losartana 50 mg ...... 30 comprimidos
   Tomar 1 comprimido por dia.`,n:'Pode aumentar para 50 mg 12/12 h (máx. 100 mg/dia). Dosar potássio e creatinina em 1–2 semanas. Contraindicada na gestação. Não associar a IECA.'},
 {t:'HAS: IECA',rx:`Uso oral
1. Enalapril 10 mg ...... 60 comprimidos
   Tomar 1 comprimido de 12 em 12 horas.`,n:'Dose 5–40 mg/dia. Tosse seca em ~10% (trocar por losartana). Angioedema: suspender e nunca reintroduzir. Potássio e creatinina em 1–2 semanas (aceitável aumento de Cr até 30%). Contraindicado na gestação. Captopril 25 mg 8/8–12/12 h como alternativa.'},
 {t:'HAS: bloqueador de canal de cálcio',rx:`Uso oral
1. Anlodipino 5 mg ...... 30 comprimidos
   Tomar 1 comprimido por dia.`,n:'Máx. 10 mg/dia. Efeito adverso comum: edema maleolar (dose-dependente). Boa opção em idosos e pessoas negras.'},
 {t:'HAS: diurético tiazídico',rx:`Uso oral
1. Hidroclorotiazida 25 mg ...... 30 comprimidos
   Tomar 1 comprimido pela manhã.`,n:'Dose 12,5–25 mg. Alternativa mais potente e de ação longa: clortalidona 12,5–25 mg. Monitorar sódio, potássio, glicemia e ácido úrico. Menos eficaz se TFG < 30 (usar furosemida).'},
 {t:'HAS: combinação tripla usual',rx:`Uso oral
1. Losartana 50 mg ...... 60 comprimidos
   Tomar 1 comprimido de 12 em 12 horas.
2. Anlodipino 10 mg ...... 30 comprimidos
   Tomar 1 comprimido por dia.
3. Hidroclorotiazida 25 mg ...... 30 comprimidos
   Tomar 1 comprimido pela manhã.`,n:'HAS resistente (fora da meta com 3 classes em dose otimizada, incluindo diurético): acrescentar espironolactona 25 mg/dia se K < 4,5 e TFG > 45. Antes, confirmar adesão, técnica de medida e MRPA/MAPA, e investigar causas secundárias (apneia, hiperaldosteronismo, DRC).'},
 {t:'HAS: betabloqueador (com indicação específica)',rx:`Uso oral
1. Atenolol 50 mg ...... 30 comprimidos
   Tomar 1 comprimido por dia.`,n:'Não é primeira linha isolada. Indicar em DAC, pós-IAM, ICC (usar carvedilol/metoprolol), FA para controle de frequência, enxaqueca (propranolol 40 mg 12/12 h). Evitar em asma.'},
 {t:'HAS na gestação',rx:`Uso oral
1. Metildopa 250 mg ...... 90 comprimidos
   Tomar 1 comprimido de 8 em 8 horas.`,n:'Dose 750 mg a 2 g/dia. Alternativa: nifedipino retard 20 mg 12/12 h. IECA e BRA são contraindicados. PA ≥ 160x110 ou sinais de pré-eclâmpsia: encaminhar com urgência à maternidade.'},
 {t:'ICFEr: betabloqueador',rx:`Uso oral
1. Carvedilol 3,125 mg ...... 60 comprimidos
   Tomar 1 comprimido de 12 em 12 horas, junto com as refeições.`,n:'Iniciar com o paciente euvolêmico. Dobrar a dose a cada 2 semanas (6,25 → 12,5 → 25 mg 12/12 h; 50 mg 12/12 h se > 85 kg), conforme FC > 60 e PAS > 90. Alternativas: succinato de metoprolol 25 mg/dia até 200 mg; bisoprolol 1,25 mg até 10 mg.'},
 {t:'ICFEr: IECA ou BRA',rx:`Uso oral
1. Enalapril 2,5 mg ...... 60 comprimidos
   Tomar 1 comprimido de 12 em 12 horas.`,n:'Titular a cada 2 semanas até 10–20 mg 12/12 h. Intolerância: losartana 25 mg/dia até 150 mg/dia. Potássio e creatinina 1–2 semanas após cada ajuste. Sacubitril/valsartana (componente especializado) se persistir sintomático.'},
 {t:'ICFEr: antagonista mineralocorticoide',rx:`Uso oral
1. Espironolactona 25 mg ...... 30 comprimidos
   Tomar 1 comprimido por dia.`,n:'Indicar se FE ≤ 35% e sintomática, com K < 5,0 e TFG > 30. Potássio e creatinina em 3 dias, 1 semana, depois mensal por 3 meses. Suspender se K > 5,5. Ginecomastia: comum.'},
 {t:'ICFEr: iSGLT2',rx:`Uso oral
1. Dapagliflozina 10 mg ...... 30 comprimidos
   Tomar 1 comprimido por dia.`,n:'Benefício com ou sem diabetes. No SUS, conforme critérios do PCDT vigente. Não iniciar se TFG < 25. Orientar higiene genital e suspender em jejum prolongado ou doença aguda.'},
 {t:'ICC: diurético de alça (congestão)',rx:`Uso oral
1. Furosemida 40 mg ...... 30 comprimidos
   Tomar 1 comprimido pela manhã.`,n:'Dose pelo estado volêmico (20–80 mg, até 2x/dia). Orientar pesagem diária: ganho > 2 kg em 3 dias pede reavaliação. Reduzir quando euvolêmico. Monitorar potássio, sódio e função renal. Restrição hídrica só em hiponatremia ou congestão refratária.'}]},
rx_dm:{s:'Diabetes',t:'Diabetes: antidiabéticos e insulina',rec:'Receita simples (uso contínuo; validade conforme protocolo local)',items:[
 {t:'Metformina (início)',rx:`Uso oral contínuo
1. Metformina 850 mg ...... 60 comprimidos
   Tomar 1 comprimido após o almoço por 2 semanas. Depois, 1 comprimido após o café da manhã e 1 após o jantar.`,n:'Começar com 500–850 mg/dia e subir a cada 1–2 semanas até 2 g/dia (máx. 2.550 mg). Sempre com refeição. TFG 30–44: máx. 1 g/dia; TFG < 30: suspender. Uso prolongado: dosar B12 anualmente. Intolerância gastrintestinal: metformina XR.'},
 {t:'Metformina + gliclazida',rx:`Uso oral contínuo
1. Metformina 850 mg ...... 90 comprimidos
   Tomar 1 comprimido após o café da manhã, o almoço e o jantar.
2. Gliclazida 30 mg (liberação prolongada) ...... 30 comprimidos
   Tomar 1 comprimido no café da manhã.`,n:'Gliclazida MR pode subir até 120 mg/dia (4 comprimidos juntos no café). Orientar sobre hipoglicemia e não pular refeição. Evitar glibenclamida em idosos e na DRC.'},
 {t:'iSGLT2: dapagliflozina',rx:`Uso oral contínuo
1. Dapagliflozina 10 mg ...... 30 comprimidos
   Tomar 1 comprimido por dia.`,n:'Benefício em doença cardiovascular, IC e DRC (iniciar com TFG ≥ 25). Higiene genital (candidíase), hidratação. Suspender em doença aguda com vômito ou desidratação e 3 dias antes de cirurgia (cetoacidose euglicêmica). No SUS: conferir critérios do PCDT e da REMUME.'},
 {t:'Insulina NPH ao deitar',rx:`Uso subcutâneo contínuo
1. Insulina humana NPH 100 UI/mL ...... frascos ou canetas suficientes para 30 dias
   Aplicar 10 UI por via subcutânea às 22 horas.
2. Seringas de insulina com agulha curta ...... 30 unidades
3. Tiras reagentes, lancetas e glicosímetro ...... conforme protocolo do município
   Medir a glicemia em jejum todos os dias e anotar.`,n:'Início: 10 UI ou 0,1–0,2 UI/kg ao deitar, mantendo a metformina. Subir 2 UI a cada 3 dias até glicemia de jejum de 80–130 mg/dL; reduzir 4 UI (ou 10%) se hipoglicemia. Ver a calculadora Insulina e a folha de hipoglicemia.'}]},
rx_lip:{s:'Colesterol',t:'Dislipidemia: estatinas',rec:'Receita simples (uso contínuo)',items:[
 {t:'Sinvastatina (moderada intensidade)',rx:`Uso oral contínuo
1. Sinvastatina 40 mg ...... 30 comprimidos

rx_resp:{s:'Asma e DPOC',t:'Asma e DPOC: inalatórios',rec:'Receita simples (uso contínuo)',items:[
 {t:'Asma: budesonida + formoterol (manutenção e alívio)',rx:`Uso inalatório contínuo

 {t:'Asma: beclometasona + salbutamol',rx:`Uso inalatório contínuo

Uso inalatório se necessário
2. Salbutamol 100 mcg/dose aerossol ...... 1 frasco
   Inalar 2 a 4 jatos com espaçador se falta de ar ou chiado, até de 4 em 4 horas.`,n:'Salbutamol sozinho, sem corticoide inalatório, não é recomendado na asma. Usa salbutamol mais de 2 vezes por semana: subir a etapa.'},
 {t:'DPOC: broncodilatador de longa ação',rx:`Uso inalatório contínuo

Uso inalatório se necessário
2. Salbutamol 100 mcg/dose aerossol ...... 1 frasco
   Inalar 2 a 4 jatos com espaçador se falta de ar.`,n:'Alternativa: tiotrópio (com ou sem olodaterol) ou formoterol. Corticoide inalatório só se exacerbações frequentes e eosinófilos ≥ 300/µL. Vacinas, reabilitação e cessação do tabagismo.'}]},
rx_end:{s:'Tireoide',t:'Hipotireoidismo',rec:'Receita simples (uso contínuo)',items:[
 {t:'Levotiroxina',rx:`Uso oral contínuo
1. Levotiroxina sódica 50 mcg ...... 30 comprimidos
   Tomar 1 comprimido em jejum, 30 a 60 minutos antes do café da manhã, todos os dias.`,n:'Dose plena: cerca de 1,6 mcg/kg/dia em adulto jovem. Idoso ou cardiopata: começar com 12,5–25 mcg e subir a cada 4–6 semanas. TSH em 6–8 semanas após cada ajuste. Separar 4 h de cálcio, ferro e antiácidos. Gestação: aumentar cerca de 30%.'}]},
rx_uro:{s:'Próstata',t:'Hiperplasia prostática benigna',rec:'Receita simples (uso contínuo)',items:[

 {t:'Tansulosina',rx:`Uso oral contínuo
1. Tansulosina 0,4 mg ...... 30 cápsulas
   Tomar 1 cápsula por dia, 30 minutos após a mesma refeição.`,n:'Menos hipotensão que a doxazosina. Avisar o oftalmologista antes de cirurgia de catarata.'},
 {t:'Finasterida (próstata aumentada)',rx:`Uso oral contínuo
1. Finasterida 5 mg ...... 30 comprimidos

rx_gest:{s:'Gestação',t:'Gestação e puerpério',rec:RS,items:[
 {t:'Pré-natal: ácido fólico e sulfato ferroso',rx:`Uso oral

2. Sulfato ferroso 40 mg de ferro elementar ...... 30 comprimidos
   Tomar 1 comprimido por dia, 30 minutos antes do almoço, com suco de fruta cítrica.`,n:'Ácido fólico desde 30 dias antes de engravidar. 5 mg/dia se DTN prévio, epilepsia em uso de anticonvulsivante, obesidade ou DM (na falta de 0,4 mg, a rede costuma ter 5 mg). Ferro durante toda a gestação e até 3 meses pós-parto.'},
 {t:'Risco de pré-eclâmpsia: AAS e cálcio',rx:`Uso oral

   Tomar 1 comprimido por dia, à noite, da 12ª à 36ª semana.
2. Carbonato de cálcio 1.250 mg (500 mg de cálcio) ...... 60 comprimidos
   Tomar 1 comprimido no almoço e 1 no jantar, longe do sulfato ferroso.`,n:'AAS se 1 fator de alto risco (pré-eclâmpsia prévia, HAS crônica, DM, DRC, lúpus/SAF, gemelar) ou 2 ou mais moderados (primigesta, IMC > 30, idade ≥ 35, história familiar). Cálcio se a dieta for pobre em cálcio.'},
 {t:'Puerpério: sulfato ferroso',rx:`Uso oral
1. Sulfato ferroso 40 mg de ferro elementar ...... 90 comprimidos
   Tomar 1 comprimido por dia, 30 minutos antes do almoço, por 3 meses.`,n:'Contracepção na amamentação: minipílula (Prescrições, Contracepção), DIU ou implante.'}]},
rx_ped:{s:'Puericultura',t:'Puericultura: vitaminas e ferro',rec:RS,items:[
 {t:'Vitamina D',rx:`Uso oral
1. Colecalciferol (vitamina D3) solução oral ...... 1 frasco
   Dar 400 UI por dia, em uma tomada, do nascimento até 1 ano de idade.`,n:'SBP: 400 UI/dia até 12 meses e 600 UI/dia de 12 a 24 meses. A concentração muda entre marcas (por exemplo 200 UI ou 500 UI por gota): escreva o número de gotas da marca dispensada.'},
 {t:'Ferro profilático (6 a 24 meses)',rx:`Uso oral
1. Sulfato ferroso solução oral 25 mg/mL de ferro elementar ...... 1 frasco
   Dar [__] gotas (1 mg/kg de ferro) 1 vez ao dia, longe do leite, dos 6 aos 24 meses.`,n:'Com 20 gotas/mL, 1 gota tem 1,25 mg: gotas = peso (kg) × 0,8. Prematuro ou baixo peso: 2 mg/kg/dia a partir de 30 dias. Calcule em Doses pediátricas.'}]},
rx_oto:{s:'Ouvido e olhos',t:'Otite e conjuntivite',rec:RS+' (antibiótico oral: '+RA+')',items:[
 {t:'Otite média aguda (adulto)',rx:`Uso oral
1. Amoxicilina 500 mg ...... 21 cápsulas
   Tomar 1 cápsula de 8 em 8 horas por 7 dias.
2. Dipirona 500 mg ...... 20 comprimidos
   Tomar 1 a 2 comprimidos de 6 em 6 horas, se dor ou febre.`,n:'Criança: amoxicilina 80–90 mg/kg/dia de 12/12 h, calculada pelo peso em Antibióticos por infecção. Falha em 48–72 h ou amoxicilina no último mês: amoxicilina + clavulanato 875/125 mg 12/12 h. Alergia: azitromicina 500 mg/dia por 3 dias.'},
 {t:'Otite externa',rx:`Uso otológico
1. Ciprofloxacino 0,3% + hidrocortisona 1% solução otológica ...... 1 frasco
   Pingar 3 gotas no ouvido [direito/esquerdo] de 12 em 12 horas por 7 dias. Deitar de lado por 5 minutos depois de pingar.

Uso oral
2. Ibuprofeno 400 mg ...... 15 comprimidos

    const m=nome.match(/^(.*?\d+(?:[.,]\d+)?\s*(?:mg|mcg|g|ui|ml|%|mg\/ml)(?:\s*\+\s*[^\d]*\d+(?:[.,]\d+)?\s*(?:mg|mcg|g))?)\s+(.*)$/i);

  else if(/xarope|suspens|solu[cç][aã]o oral|\bml\b|colher/.test(all))forma='liq';else if(/jato|spray|puff|inala|bombinha|aerossol/.test(all))forma='inal';
  else if(/adesivo/.test(all))forma='ades';else if(/pomada|creme|loção|locao|gel\b/.test(all))forma='pom';
  let q=1;const qm=ins.match(/(\d+(?:[.,]\d+)?|½|meio|uma?|dois|duas|tr[eê]s)\s*(?:a\s*\d+\s*)?(comprimidos?|comp\.?|cp|c[aá]psulas?|caps?|gotas?|ml|colher(?:es)?|ui|unidades|jatos?|puffs?|adesivos?|aplicador)/);
  if(qm){const w=qm[1];q=w==='½'||w==='meio'?.5:/^uma?$/.test(w)?1:/^(dois|duas)$/.test(w)?2:/^tr/.test(w)?3:parseFloat(w.replace(',','.'))}
  else if(/½|meio comprimido/.test(ins))q=.5;
  const r={nome,forma,m:'',t:'',n:'',obs:''};const set=(...k)=>k.forEach(x=>r[x]=qtxt(q));

  if(/se (dor|febre|necess|precisar|falta de ar|n[aá]usea|crise|fissura)/.test(ins)){obs.push('só se precisar'+((ins.match(/se (dor|febre|falta de ar|n[aá]usea|crise)[^,.;]*/)||[''])[0]?': '+ins.match(/se (dor|febre|falta de ar|n[aá]usea|crise)[^,.;]*/)[0]:''))}
  else if(/6\s*(em|\/)\s*6|4 vezes|4x/.test(ins)){set('m','t','n');obs.push('de 6 em 6 horas (4 vezes ao dia)')}

function parseList(text){

  for(const l of lines){

    if(isInstr(l)&&cur){cur.ins+=' '+l.trim();continue}

}

function svgToPng(svg,img,out,fname){

  const im=new Image();
  im.onload=()=>{try{const c=document.createElement('canvas');c.width=w*2;c.height=h*2;const x=c.getContext('2d');x.scale(2,2);x.drawImage(im,0,0);img.src=c.toDataURL('image/png')}catch(e){img.src=url}out.hidden=false;
    if(fname)saveImage(img.src,fname);
    out.scrollIntoView({block:'start'})};
  im.onerror=()=>{img.src=url;out.hidden=false};
  im.src=url;
}

}

  const drawSheet=()=>{$('#sheet').innerHTML=sheetSVG().replace('<svg ','<svg style="width:100%;height:auto;display:block" ');$('#es-out').hidden=true};
  const drawRows=()=>{
    rowsEl.innerHTML=ESQ.rows.map((r,i)=>`<div class="card" style="gap:8px;border-left:8px solid ${r.cor}">
      <div class="inline"><input data-i="${i}" data-f="nome" value="${esc(r.nome)}" aria-label="Remédio e dose" placeholder="Remédio e dose"><button class="btn small" data-del="${i}" aria-label="Remover">✕</button></div>
      <div class="grid2" style="grid-template-columns:repeat(3,1fr)">${PER.map(([k,l])=>`<div class="field"><label for="es-${i}-${k}">${l}</label><input id="es-${i}-${k}" data-i="${i}" data-f="${k}" value="${esc(r[k])}" inputmode="decimal" placeholder="—"></div>`).join('')}</div>
      <div class="grid2"><div class="field"><label for="es-${i}-forma">Forma</label><select id="es-${i}-forma" data-i="${i}" data-f="forma">${fopt(r.forma)}</select></div>
      <div class="field"><label for="es-${i}-obs">Observação</label><input id="es-${i}-obs" data-i="${i}" data-f="obs" value="${esc(r.obs)}" placeholder="em jejum, com comida, só se dor"></div></div>
      <div class="bar">${COLORS.map(c=>`<button class="btn small" data-i="${i}" data-cor="${c}" aria-label="Cor" style="width:28px;height:28px;padding:0;border-radius:50%;background:${c};border:${c===r.cor?'3px solid var(--fg)':'1px solid var(--line)'}"></button>`).join('')}</div>
    </div>`).join('')||'<p class="note">Nenhum remédio ainda. Cole a lista acima ou toque em "Adicionar remédio".</p>';
    rowsEl.querySelectorAll('[data-f]').forEach(el=>el.addEventListener('input',()=>{ESQ.rows[+el.dataset.i][el.dataset.f]=el.value;drawSheet()}));
    rowsEl.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ESQ.rows.splice(+b.dataset.del,1);drawRows()});
    rowsEl.querySelectorAll('[data-cor]').forEach(b=>b.onclick=()=>{ESQ.rows[+b.dataset.i].cor=b.dataset.cor;drawRows()});
    drawSheet();
  };
  const txt=$('#es-txt');txt.value=ESQ.txt||'';let deb;
  txt.addEventListener('input',()=>{ESQ.txt=txt.value;clearTimeout(deb);deb=setTimeout(()=>{if(!txt.value.trim())return;const n=setFromText(txt.value);$('#es-exn').hidden=true;
    if($('#es-nome').value==='Maria (exemplo)')$('#es-nome').value='';
    m.querySelectorAll('[id^="es-c-"]').forEach(c=>c.checked=ESQ.cuid.has(c.dataset.k));
    drawRows();if(n)toast(n+' remédio(s) no esquema');else toast('Não encontrei remédios no texto')},450)});
  $('#es-add').onclick=()=>{if(ESQ.ex){ESQ.rows=[];ESQ.ex=false;ESQ.nome=''}ESQ.rows.push({nome:'',forma:'comp',m:'',t:'',n:'',obs:'',cor:COLORS[ESQ.rows.length%COLORS.length]});renderESQ(m)};
  const clr=$('#es-clr');clr.onclick=()=>{if(!clr.dataset.c){clr.dataset.c=1;clr.textContent='Toque de novo para limpar';setTimeout(()=>{if(clr.isConnected){clr.textContent='Limpar tudo';delete clr.dataset.c}},3000);return}
    ESQ={ex:false,nome:'',data:isoD(today()),retorno:'',unidade:ESQ.unidade,extra:'',cuid:new Set(['agua','todo','trazer']),rows:[]};renderESQ(m)};
  $('#es-nome').oninput=e=>{ESQ.nome=e.target.value;drawSheet()};
  $('#es-data').oninput=e=>{ESQ.data=e.target.value;drawSheet()};
  $('#es-ret').oninput=e=>{ESQ.retorno=e.target.value;drawSheet()};
  $('#es-uni').oninput=e=>{ESQ.unidade=e.target.value;store.set('kitaps:unidade',e.target.value);drawSheet()};
  $('#es-extra').oninput=e=>{ESQ.extra=e.target.value;drawSheet()};
  m.querySelectorAll('[id^="es-c-"]').forEach(c=>c.onchange=()=>{c.checked?ESQ.cuid.add(c.dataset.k):ESQ.cuid.delete(c.dataset.k);drawSheet()});
  $('#es-print').onclick=printSheet;
  $('#es-img').onclick=()=>svgToPng(sheetSVG(),$('#es-png'),$('#es-out'),'esquema-remedios'+(ESQ.nome?'-'+ESQ.nome.trim().split(/\s+/)[0].toLowerCase():'')+'.png');
  drawRows();
}
/* ---------- MEV: orientações de estilo de vida (linguagem para o paciente) ---------- */
const ALIM='Faça da comida de verdade a base: arroz, feijão, legumes, verduras, frutas, ovos, carnes e peixes. Evite ultraprocessados (salgadinho, biscoito recheado, embutidos, refrigerante, macarrão instantâneo).';
const ATIV='Faça atividade física: pelo menos 150 minutos por semana (ex.: 30 minutos de caminhada, 5 dias por semana), e exercícios de força 2 vezes por semana. Qualquer movimento já ajuda: comece aos poucos.';
const FUMO='Pare de fumar. A unidade de saúde oferece grupo e remédios gratuitos para ajudar.';
const ALC='Evite bebida alcoólica.';
const M={
mev_has:{s:'Hipertensão',t:'Pressão alta',pr:'Orientado(a) sobre MEV para HAS: redução de sal (< 5 g/dia), alimentação baseada no Guia Alimentar, atividade física ≥ 150 min/sem, controle de peso, cessação do tabagismo, redução do álcool, adesão e automonitorização da PA.',items:[
 'Use pouco sal: no máximo 1 colher de chá rasa por dia para toda a comida. Tempere com alho, cebola, cheiro-verde, limão e ervas.',
 'Evite temperos prontos (caldo em cubo, sachê), embutidos (salsicha, presunto, mortadela), enlatados e salgadinhos: têm muito sal.',
 'Coma frutas, verduras e legumes todos os dias e prefira feijão, arroz integral e aveia.',ATIV,
 'Se estiver acima do peso, perder um pouco (5 a 10%) já baixa a pressão.',FUMO,'Evite bebida alcoólica ou beba pouco.',
 'Durma bem e procure maneiras de diminuir o estresse.',
 'Tome os remédios todos os dias, mesmo quando a pressão estiver boa. Não pare sem falar com a equipe.',
 'Meça a pressão quando puder e anote para mostrar na consulta.']},
mev_dm:{s:'Diabetes',t:'Diabetes',pr:'Orientado(a) sobre MEV para DM: alimentação baseada no Guia Alimentar com redução de açúcares e ultraprocessados, regularidade nas refeições, atividade física ≥ 150 min/sem, controle de peso, cessação do tabagismo, cuidado diário com os pés e reconhecimento de hipoglicemia.',items:[
 'Evite açúcar, doces, refrigerante e suco de caixinha ou em pó. Prefira a fruta inteira ao suco.',
 'Monte o prato: metade com verduras e legumes, um quarto com arroz, mandioca, batata ou macarrão e um quarto com feijão, ovo, carne ou peixe.',
 'Faça as refeições em horários regulares e não fique muito tempo sem comer, principalmente se usa insulina.',
 'Prefira alimentos integrais: arroz integral, aveia, pão integral.',ATIV,

 'Se sentir tremor, suor frio, fraqueza ou tontura: tome 1 colher de sopa de açúcar em água ou um copo de suco e meça a glicemia.',FUMO,ALC]},
mev_obes:{s:'Obesidade',t:'Sobrepeso e obesidade',pr:'Orientado(a) sobre MEV para excesso de peso: alimentação baseada no Guia Alimentar, redução de ultraprocessados e bebidas açucaradas, atividade física progressiva até 150–300 min/sem, sono adequado, meta inicial de perda de 5–10% do peso.',items:[
 'A meta inicial é perder 5 a 10% do peso. Isso já traz benefício para a saúde.',ALIM,
 'Troque refrigerante e suco por água. Tenha sempre uma garrafa de água por perto.',
 'Coma devagar, sentado à mesa, sem televisão ou celular, e com atenção na comida.',
 'Cozinhe em casa sempre que puder e planeje as compras da semana.',

 'Procure os grupos da unidade de saúde e a Academia da Saúde, se houver.']},
mev_lip:{s:'Colesterol',t:'Colesterol alto e risco do coração',pr:'Orientado(a) sobre MEV para dislipidemia/risco cardiovascular: redução de gorduras saturadas e trans e de ultraprocessados, aumento de fibras, atividade física ≥ 150 min/sem, controle de peso, cessação do tabagismo, moderação do álcool.',items:[
 'Diminua frituras, carnes gordas, pele de frango, linguiça, bacon, manteiga e alimentos com gordura trans (biscoito recheado, margarina dura, salgadinho).',
 'Prefira carnes magras, frango sem pele, peixe e ovos cozidos. Use pouco óleo.',
 'Coma mais fibras: aveia, feijão, frutas com casca, verduras e legumes.',ATIV,FUMO,
 'Evite bebida alcoólica: ela aumenta os triglicerídeos.',

mev_drc:{s:'Rins',t:'Doença renal crônica',pr:'Orientado(a) sobre MEV para DRC: restrição de sal (< 5 g/dia), ingestão proteica adequada ao estágio, evitar anti-inflamatórios e nefrotóxicos, controle de PA e glicemia, atividade física, cessação do tabagismo, hidratação conforme orientação.',items:[
 'Use pouco sal e evite temperos prontos, embutidos e enlatados.',
 'Não exagere nas carnes: coma porções moderadas, conforme orientação da equipe.',
 'Não tome anti-inflamatórios (ibuprofeno, diclofenaco, nimesulida, cetoprofeno) nem chás e remédios por conta própria. Para dor, use dipirona ou paracetamol.',
 'Beba água conforme a orientação da equipe (há casos em que é preciso limitar).',
 'Controle bem a pressão e o diabetes: é o que mais protege os rins.',ATIV,FUMO,
 'Sempre avise qualquer médico ou dentista que você tem doença nos rins.']},
mev_icc:{s:'Coração (ICC)',t:'Insuficiência cardíaca',pr:'Orientado(a) sobre MEV para IC: restrição de sal, pesagem diária com sinais de alerta, atividade física leve a moderada conforme tolerância, evitar AINE, cessação do tabagismo e do álcool, adesão às medicações, vacinação.',items:[
 'Use pouco sal e evite temperos prontos, embutidos, enlatados e salgadinhos.',
 'Pese-se todo dia, de manhã, depois de urinar e antes do café. Se ganhar mais de 2 kg em 3 dias, procure a unidade.',
 'Procure a unidade se tiver mais falta de ar, inchaço nas pernas ou barriga, ou precisar dormir com mais travesseiros.',
 'Faça caminhadas leves e aumente aos poucos, sempre no seu ritmo. Pare se tiver falta de ar forte ou dor no peito.',
 'Não use anti-inflamatórios (ibuprofeno, diclofenaco, nimesulida).',
 'Não fume e não beba bebida alcoólica.',
 'Tome os remédios todos os dias, mesmo se estiver bem.',
 'Tome as vacinas da gripe, da covid e da pneumonia.']},
mev_gest:{s:'Gestação',t:'Gestação saudável',pr:'Orientada sobre MEV na gestação: alimentação baseada no Guia Alimentar, ganho de peso adequado ao IMC pré-gestacional, atividade física moderada, suspensão de álcool, tabaco e outras drogas, suplementação, sinais de alarme.',items:[
 ALIM,
 'Coma de 3 em 3 horas, em pequenas porções, se tiver enjoo. Biscoito de água e sal ao acordar ajuda.',
 'Não beba nenhuma bebida alcoólica, não fume e não use drogas durante a gravidez.',
 'Lave bem frutas e verduras e não coma carne crua ou malpassada (protege da toxoplasmose).',
 'Faça caminhadas ou exercícios leves, se a equipe liberar: cerca de 30 minutos na maior parte dos dias.',
 'Tome o ácido fólico e o sulfato ferroso como orientado.',
 'Procure a maternidade se tiver sangramento, perda de líquido, dor de cabeça forte, visão embaçada, inchaço repentino, febre ou se o bebê parar de mexer.']},
mev_cri:{s:'Criança',t:'Criança saudável',pr:'Orientados responsáveis sobre alimentação conforme Guia Alimentar para crianças < 2 anos (AME até 6 meses, alimentação complementar sem açúcar e ultraprocessados), sono seguro, tempo de tela, prevenção de acidentes e vacinação.',items:[
 'Até 6 meses: só leite materno, sem água, chá ou outros leites. Mamar até 2 anos ou mais.',
 'A partir de 6 meses: comida amassada (não liquidificada) de verdade, com feijão, legumes, carnes e frutas.',
 'Não dê açúcar, mel, refrigerante, suco de caixinha, biscoito recheado ou salgadinho antes dos 2 anos.',
 'Bebê dorme de barriga para cima, no berço, sem travesseiro, protetor ou bichos de pelúcia.',
 'Evite telas (TV, celular) antes dos 2 anos e limite a 1 hora por dia dos 2 aos 5 anos.',
 'Brinque, converse e leia com a criança todos os dias.',
 'Previna acidentes: remédios e produtos de limpeza longe do alcance, cadeirinha no carro, tela nas janelas.',
 'Mantenha as vacinas em dia e traga a Caderneta da Criança em toda consulta.']},
mev_dep:{s:'Depressão',t:'Depressão',pr:'Orientado(a) sobre MEV e autocuidado em saúde mental: atividade física regular, rotina de sono, ativação comportamental, rede de apoio, evitar álcool e outras drogas, adesão ao tratamento e plano de segurança.',items:[
 'Mantenha uma rotina: horário para acordar, comer e dormir.',
 'Faça alguma atividade física, mesmo leve: caminhar 20 a 30 minutos já melhora o humor.',
 'Planeje uma atividade prazerosa ou útil por dia, mesmo sem vontade. A disposição costuma vir depois.',
 'Converse com pessoas de confiança e participe de grupos da unidade ou da comunidade.',
 'Evite bebida alcoólica e outras drogas: pioram a depressão e atrapalham o remédio.',
 'Tome o remédio todos os dias. Ele leva de 2 a 4 semanas para começar a fazer efeito. Não pare sem falar com a equipe.',
 'Se tiver pensamentos de se machucar, procure ajuda na hora: unidade de saúde, CVV (ligue 188, 24 horas) ou SAMU (192).']},
mev_ans:{s:'Ansiedade',t:'Ansiedade',pr:'Orientado(a) sobre MEV para ansiedade: técnicas de respiração e relaxamento, atividade física regular, higiene do sono, redução de cafeína e álcool, rede de apoio, psicoterapia.',items:[
 'Quando a ansiedade apertar, respire devagar: puxe o ar pelo nariz contando até 4, segure até 4 e solte pela boca contando até 6. Repita por 2 a 5 minutos.',
 'Faça atividade física regular: caminhada, dança, bicicleta.',
 'Diminua café, chá preto, chimarrão, refrigerante de cola e energético, principalmente à tarde e à noite.',
 'Evite bebida alcoólica: ela alivia na hora e piora a ansiedade depois.',

mev_sono:{s:'Insônia',t:'Insônia (higiene do sono)',pr:'Orientado(a) sobre higiene do sono: horários regulares, restrição de cochilos, cafeína, álcool e telas à noite, ambiente adequado, uso da cama só para dormir.',items:[
 'Deite e levante sempre no mesmo horário, inclusive no fim de semana.',
 'Evite cochilar de dia. Se precisar, no máximo 20 minutos antes das 15 h.',
 'Não tome café, chá preto, chimarrão, refrigerante de cola ou energético depois das 16 h.',
 'Evite bebida alcoólica e cigarro à noite.',
 'Desligue TV e celular 1 hora antes de deitar.',
 'Deixe o quarto escuro, silencioso e com temperatura agradável.',
 'Se não dormir em 20 minutos, levante, faça algo calmo com pouca luz e volte quando tiver sono.',

mev_tab:{s:'Tabagismo',t:'Parar de fumar',pr:'Realizada abordagem breve para cessação do tabagismo; orientado(a) sobre estratégias comportamentais, manejo da fissura e oferta do tratamento na unidade.',items:[
 'Marque uma data para parar de fumar, de preferência nas próximas 2 semanas.',
 'Conte para a família e os amigos e peça apoio.',
 'Tire de casa cigarros, isqueiros e cinzeiros.',
 'A vontade forte de fumar dura poucos minutos: beba água gelada, respire fundo, escove os dentes ou mastigue uma cenoura ou um cravo.',
 'Evite situações que lembram o cigarro (café, bebida alcoólica) nas primeiras semanas.',
 'Se tiver uma recaída, não desista: cada tentativa ajuda a parar de vez.',
 'A unidade de saúde tem grupo e remédios gratuitos (adesivo, goma, bupropiona).']},
mev_alc:{s:'Álcool',t:'Uso de álcool',pr:'Realizada intervenção breve para uso de álcool (AUDIT __); orientado(a) sobre redução de danos, metas de consumo e sinais de abstinência.',items:[
 'Combine uma meta: parar ou diminuir. Se for diminuir, defina quantos dias por semana e quantas doses.',
 'Fique pelo menos 2 dias por semana sem beber.',
 'Beba devagar, alterne com água e coma antes e durante.',
 'Evite os lugares e as pessoas que levam a beber mais.',
 'Nunca dirija depois de beber.',
 'Não pare de repente se bebe muito todo dia: pode dar tremor e convulsão. Fale com a equipe para parar com segurança.',
 'Procure a unidade ou o CAPS AD para ajuda. Existem grupos como os Alcoólicos Anônimos.']},
mev_hpb:{s:'Próstata',t:'Próstata aumentada (HPB)',pr:'Orientado sobre medidas comportamentais para LUTS/HPB: redução de líquidos à noite, cafeína e álcool, micção dupla, revisão de medicações e treinamento vesical.',items:[
 'Beba menos líquido nas 2 horas antes de dormir, mas mantenha a água durante o dia.',
 'Diminua café, chá preto, refrigerante e bebida alcoólica, principalmente à noite.',
 'Urine antes de deitar e antes de sair de casa.',
 'Depois de urinar, espere um pouco e tente de novo (micção dupla).',
 'Evite remédios para gripe e alergia sem orientação: podem prender a urina.',
 'Procure a unidade se não conseguir urinar, tiver sangue na urina ou ardência com febre.']},
mev_ivas:{s:'Gripe/resfriado',t:'Gripe e resfriado',pr:'Orientado(a) sobre cuidados domiciliares em IVAS: hidratação, lavagem nasal, repouso, sintomáticos, etiqueta respiratória e sinais de alarme.',items:[
 'Beba bastante água, sucos e sopas.',
 'Lave o nariz com soro fisiológico várias vezes ao dia.',
 'Descanse e se alimente bem.',
 'Cubra a boca com o braço ao tossir ou espirrar e lave as mãos com frequência.',
 'Use máscara perto de idosos, bebês, gestantes e pessoas doentes.',
 'Não tome antibiótico sem receita: não funciona contra vírus.',
 'Procure a unidade se tiver falta de ar, febre por mais de 3 dias, piora depois de melhorar ou dor de ouvido forte.']},
mev_diar:{s:'Diarreia',t:'Diarreia e vômitos',pr:'Orientado(a) sobre Plano A: SRO após cada evacuação/vômito, manutenção da alimentação, higiene das mãos e da água, sinais de alarme.',items:[
 'Tome o soro de reidratação oral depois de cada evacuação líquida ou vômito, em pequenos goles.',
 'Continue comendo, em pequenas porções: arroz, batata, frango, banana, maçã, sopas.',
 'Evite refrigerante, suco de caixinha, doces e frituras enquanto durar a diarreia.',
 'Lave as mãos depois de usar o banheiro e antes de comer ou cozinhar.',
 'Beba água filtrada ou fervida, ou com 2 gotas de hipoclorito por litro (espere 30 minutos).',
 'Procure a unidade se tiver sangue nas fezes, febre alta, muita sonolência, urinar pouco ou não conseguir beber.']}
};
function mevSVG(c,items,nome){
  const W=800,F='Arial, Helvetica, sans-serif';let y=0,o='';
  o+=`<text x="30" y="58" font-family="${F}" font-size="36" font-weight="700" fill="#111">${X(c.t)}</text>`;
  o+=`<text x="30" y="92" font-family="${F}" font-size="22" fill="#333">Orientações para cuidar da sua saúde${nome?' · '+X(nome):''}</text>`;
  y=116;
  items.forEach(t=>{const L=wrapT(t,52),hh=L.length*30+26;
    o+=`<rect x="20" y="${y}" width="760" height="${hh}" rx="10" fill="#fff" stroke="#adb5bd" stroke-width="2"/><circle cx="46" cy="${y+28}" r="9" fill="#6a3fd1"/>`;
    L.forEach((l,j)=>o+=`<text x="70" y="${y+36+j*30}" font-family="${F}" font-size="23" fill="#111">${X(l)}</text>`);
    y+=hh+10});
  const u=ESQ.unidade||store.get('kitaps:unidade')||'';
  if(u){o+=`<text x="30" y="${y+28}" font-family="${F}" font-size="20" fill="#333">${X(u)}</text>`;y+=40}
  y+=16;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${y}" width="${W}" height="${y}"><rect width="${W}" height="${y}" fill="#fff"/>${o}</svg>`;
}
function mevText(c){return c.t+'\n'+c.items.map(i=>'• '+i).join('\n')}
function renderMEV(m,id){
  const c=M[id];
  m.innerHTML=`<section class="panel">
    <div class="ph"><h2>${esc(c.t)}${edTag(c.ed)}</h2><span class="code">mudança de estilo de vida</span></div>
    <div class="card"><div class="lbl lbl-row"><span>Orientações para o paciente</span><button class="btn small" id="mv-ed" type="button">${icon('edit',14)} Editar</button></div>
      <div id="mv-edit" hidden></div>
      <div class="opts soft" style="grid-template-columns:1fr">${c.items.map((t,i)=>`<label class="opt"><input type="checkbox" id="mv-${i}" checked><span>${esc(t)}</span></label>`).join('')}</div>
      <p class="note">Desmarque o que não se aplica antes de copiar ou levar para a folha.</p></div>
    <div class="bar sticky-bar"><button class="btn primary small" id="mv-print">Imprimir</button><button class="btn small" id="mv-img">Baixar imagem</button><button class="btn small" id="mv-cp">Copiar orientações</button><button class="btn small" id="mv-pr">Copiar p/ prontuário</button><button class="btn small" id="mv-esq">Levar à folha</button><button class="btn small" id="mv-cs" type="button">+ Consulta</button></div>
    <div class="card"><div class="lbl">Registro no prontuário</div><pre class="rx">${esc(c.pr)}</pre></div>
    <div class="field"><label for="mv-nome">Nome do paciente na folha (opcional)</label><input id="mv-nome"></div>
    <div class="lbl">Folha para imprimir</div>
    <div id="sheet" class="card" style="padding:8px;background:#fff"></div>
    <div id="mv-out" hidden class="card"><p class="note">Se o download não começar, toque e segure a imagem para salvar ou compartilhar (WhatsApp, impressora).</p><img id="mv-png" alt="Orientações para o paciente" style="width:100%;border:1px solid var(--line);border-radius:8px"></div>
    <p class="note">Baseado no Guia Alimentar para a População Brasileira, no Guia de Atividade Física do MS e nos Cadernos de Atenção Básica. A folha impressa sai só com as orientações marcadas. Se Imprimir não abrir a janela de impressão, use Baixar imagem. "Levar à folha" coloca as orientações nos cuidados da aba Paciente.</p>
  </section>`;

function fxNode(n){
  const cls=n.k==='info'?'':n.k;
  return `<div class="node ${cls}">${n.h?`<h3>${n.h}</h3>`:''}${n.sub?`<div class="sub">${n.sub}</div>`:''}${n.li?`<ul>${n.li.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}${n.br?`<div class="branch">${n.br.map(b=>`<div class="node br-${b[0]}"><span class="tag ${b[0]}">${b[1]}</span><div>${b[2]}</div><div class="out">${b[3]}</div></div>`).join('')}</div>`:''}</div>`;
}
const fxText=s=>s.replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
function fxPlain(f){
  const L=[f.t.toUpperCase()];
  [...(f.pre||[]),...f.flow,...(f.post||[])].forEach(n=>{L.push('');if(n.a)L.push('('+fxText(n.a)+')');if(n.h)L.push(fxText(n.h)+':');if(n.sub)L.push(fxText(n.sub));
    (n.li||[]).forEach(x=>L.push('- '+fxText(x)));(n.br||[]).forEach(b=>L.push('- '+fxText(b[1])+': '+fxText(b[2])+' '+fxText(b[3])))});
  L.push('','Fonte: '+f.src);return L.join('\n');
}
