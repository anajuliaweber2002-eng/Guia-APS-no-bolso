 ef_geral:{s:'Geral',t:'Ectoscopia e sinais vitais',src:'semiologia',k:'exame fisico geral ectoscopia sinais vitais pressao arterial tecnica',sec:[
  {h:'Técnica',li:['Estado geral, nível de consciência, fácies, postura e marcha ao entrar na sala','Mucosas: coradas ou hipocoradas (graduar +/4+), úmidas ou secas; cianose, icterícia (esclera, sob luz natural)','Edema: cacifo na região pré-tibial e maleolar, graduar +/4+','PA: repouso de 5 min, sentado, braço na altura do coração, manguito com bolsa cobrindo 80% do braço; 2–3 medidas e usar a média; na 1ª consulta medir nos dois braços','Circunferência abdominal: ponto médio entre a última costela e a crista ilíaca, ao final da expiração']},
  {h:'Achados alterados',rows:[['PA diferente &gt; 15 mmHg entre os braços','Usar o braço de maior valor; investigar doença arterial (e dissecção se dor).'],['Queda de PAS ≥ 20 ou PAD ≥ 10 em pé (1–3 min)','Hipotensão ortostática: revisar medicamentos, hidratação, disautonomia.'],['Mucosas hipocoradas','Hemograma.'],['Icterícia','Bilirrubinas, enzimas hepáticas, hemograma.']]},
  {h:'Texto normal',normal:'BEG, LOTE, corado(a), hidratado(a), acianótico(a), anictérico(a), afebril, eupneico(a) em ar ambiente.\nPA [ ]x[ ] mmHg | FC [ ] bpm | FR [ ] irpm | Tax [ ] °C | SpO2 [ ]% em ar ambiente\nPeso [ ] kg | Altura [ ] m | IMC [ ] kg/m² | CA [ ] cm'}]},
 ef_cv:{s:'Cardiovascular',t:'Aparelho cardiovascular',src:'semiologia',k:'exame cardiovascular ausculta cardiaca focos sopro ictus pulsos edema estase jugular',sec:[
  {h:'Focos de ausculta',svg:EFSVG.cv,li:['Ausculte com o diafragma (sons agudos) e a campânula (B3, B4, estenose mitral)','Foco mitral em decúbito lateral esquerdo; foco aórtico com a pessoa sentada, inclinada para frente, em expiração','Ictus: 5º EIC E na linha hemiclavicular, 1–2 polpas digitais','Estase jugular: cabeceira a 45°, medir acima do ângulo de Louis (&gt; 3–4 cm é anormal); refluxo hepatojugular','Pulsos: radiais, femorais, poplíteos, pediosos e tibiais posteriores; comparar os lados','Sopros: tempo (sistólico/diastólico), foco, irradiação, intensidade 1 a 6']},
  {h:'Achados alterados',rows:[['Ritmo irregularmente irregular','Fibrilação atrial: ECG, CHA₂DS₂-VASc.'],['Sopro sistólico aórtico irradiado para carótidas','Estenose aórtica: ecocardiograma; se síncope, angina ou dispneia, prioridade.'],['Sopro sistólico mitral irradiado para axila','Insuficiência mitral: ecocardiograma.'],['B3, estase jugular, estertores, edema','Insuficiência cardíaca congestiva: BNP/eco, diurético.'],['Ictus desviado para baixo e para fora','Cardiomegalia: ECG, Rx, eco.'],['Pulsos pediosos ausentes, pele fria, sem pelos','Doença arterial periférica: índice tornozelo-braquial.'],['Edema unilateral com dor na panturrilha','TVP: Wells.']]},
  {h:'Texto normal',normal:'Ictus não visível, palpável no 5º EIC E na LHC, 1 polpa digital. RCR em 2T, BNF, sem sopros. Sem estase jugular a 45°. Pulsos periféricos palpáveis e simétricos. TEC < 3 s. Sem edema de MMII.'}]},
 ef_resp:{s:'Respiratório',t:'Aparelho respiratório',src:'semiologia',k:'exame respiratorio ausculta pulmonar murmurio estertores sibilos fremito percussao',sec:[
  {h:'Sequência',svg:EFSVG.resp,li:['Inspeção: padrão e frequência respiratória, tiragem, uso de musculatura acessória, formato do tórax, baqueteamento digital','Palpação: expansibilidade (mãos nas bases) e frêmito toracovocal ("trinta e três")','Percussão: som claro pulmonar; macicez (consolidação, derrame), hipersonoridade/timpanismo (enfisema, pneumotórax)','Ausculta: de cima para baixo, comparando os lados, com respiração pela boca; anterior, lateral e posterior']},
  {h:'Achados alterados',rows:[['Estertores finos localizados + FTV aumentado + febre','Pneumonia (CURB-65, Rx se disponível).'],['Macicez + FTV e MV abolidos','Derrame pleural: Rx e encaminhar.'],['Timpanismo + MV abolido + dispneia súbita','Pneumotórax: urgência.'],['Sibilos difusos','Asma, DPOC, bronquiolite, congestão.'],['Estertores finos bibasais "em velcro"','Fibrose pulmonar (ou congestão): Rx, TC, pneumologia.'],['Estridor','Obstrução alta (crupe, corpo estranho, anafilaxia): urgência.']]},
  {h:'Texto normal',normal:'Tórax simétrico, eupneico(a), sem uso de musculatura acessória. Expansibilidade preservada. FTV preservado e simétrico. Som claro pulmonar à percussão. MV presente bilateralmente, sem ruídos adventícios.'}]},
 ef_abd:{s:'Abdome',t:'Abdome',src:'semiologia',k:'exame abdome abdominal palpacao blumberg murphy giordano rovsing psoas hepatimetria ascite baco',sec:[
  {h:'Regiões e sequência',svg:EFSVG.abd,li:['Ordem: inspeção, ausculta, percussão e palpação (a ausculta antes, para não alterar os ruídos)','Palpação superficial e depois profunda, começando longe da dor','Fígado: hepatimetria 6–12 cm na LHC; borda à inspiração profunda','Baço: posição de Schuster (decúbito lateral direito); espaço de Traube','Ascite: macicez móvel de decúbito, piparote']},
  {h:'Sinais e o que sugerem',rows:[['Blumberg (dor à descompressão brusca)','Irritação peritoneal: abdome agudo, encaminhar.'],['Rovsing, psoas, obturador, dor em McBurney','Apendicite.'],['Murphy (parada da inspiração à palpação do hipocôndrio D)','Colecistite aguda.'],['Giordano (punho-percussão lombar dolorosa)','Pielonefrite ou litíase.'],['Massa pulsátil periumbilical','Aneurisma de aorta: USG; se dor, urgência.'],['Hepatomegalia','Enzimas, USG; pensar em esteatose, ICC, álcool, hepatites.']]},
  {h:'Texto normal',normal:'Abdome plano, RHA presentes, timpânico à percussão, flácido, indolor à palpação superficial e profunda, sem massas ou visceromegalias palpáveis. Blumberg e Murphy negativos. Giordano negativo bilateralmente.'}]},
 ef_neuro:{s:'Neurológico',t:'Exame neurológico',src:'semiologia',k:'exame neurologico forca reflexos babinski romberg coordenacao pares cranianos meningeos glasgow',sec:[
  {h:'Roteiro rápido',li:['Estado mental: consciência (Glasgow), orientação, linguagem','Pares cranianos: pupilas e reflexo fotomotor, movimentos oculares, mímica facial, língua e palato','Força (0 a 5): manobras de Mingazzini e Barré; comparar os lados','Reflexos: bicipital (C5–6), tricipital (C7), patelar (L4), aquileu (S1); cutâneo-plantar (Babinski)','Sensibilidade tátil, dolorosa e vibratória; coordenação: índex-nariz, calcanhar-joelho, movimentos alternados','Romberg (pés juntos, olhos fechados) e marcha; sinais meníngeos: rigidez de nuca, Kernig, Brudzinski']},
  {h:'Achados alterados',rows:[['Déficit súbito: face caída, braço que cai, fala alterada','AVC: SAMU 192, anotar a hora do início, glicemia capilar.'],['Babinski (extensão do hálux)','Lesão do trato piramidal.'],['Romberg positivo','Ataxia sensitiva (B12, neuropatia, tabes) ou vestibular.'],['Ataxia, dismetria e nistagmo','Lesão cerebelar: investigar com urgência se aguda.'],['Rigidez de nuca com febre','Meningite: urgência.'],['Tremor de repouso, rigidez, bradicinesia','Parkinsonismo: revisar medicamentos (metoclopramida, antipsicóticos), neurologia.']]},
  {h:'Texto normal',normal:'Vígil, orientado(a) em tempo e espaço, Glasgow 15. Pupilas isocóricas e fotorreagentes. Pares cranianos sem alterações. Força grau V nos 4 membros, tônus preservado. Reflexos profundos presentes e simétricos (2+), cutâneo-plantar em flexão bilateral. Sensibilidade preservada. Coordenação sem alterações. Romberg negativo. Marcha atípica. Sem sinais meníngeos.'}]},
 ef_cp:{s:'Cabeça e pescoço',t:'Cabeça e pescoço: oroscopia, otoscopia, linfonodos, tireoide',src:'semiologia',k:'otoscopia membrana timpanica otite oroscopia amigdala linfonodo tireoide rinoscopia',sec:[
  {h:'Otoscopia',svg:EFSVG.oto,li:['Tracionar o pavilhão para cima e para trás no adulto (para baixo e para trás na criança) e usar o maior espéculo que caiba','Segurar o otoscópio como uma caneta, com a mão apoiada na cabeça da pessoa','Normal: membrana íntegra, translúcida, cinza-perolada, cabo do martelo visível, triângulo luminoso anteroinferior']},
  {h:'Achados alterados',rows:[['MT abaulada, opaca e hiperemiada, com otalgia','Otite média aguda (amoxicilina; ver Doses pediátricas).'],['MT opaca, retraída, nível líquido, sem dor','Otite média com efusão: observar 3 meses.'],['Conduto edemaciado, dor ao tracionar o pavilhão','Otite externa: gotas otológicas, evitar água.'],['Amígdalas com exsudato','Centor/McIsaac.'],['Linfonodo &gt; 1 cm, endurecido, fixo, supraclavicular ou por mais de 4–6 semanas','Investigar (hemograma, sorologias, imagem, biópsia).'],['Nódulo de tireoide','TSH e USG de tireoide.']]},
  {h:'Texto normal',normal:'Oroscopia: mucosas úmidas e coradas, amígdalas grau [ ], sem hiperemia ou exsudato. Otoscopia: CAE pérvio, MT íntegras, translúcidas, com triângulo luminoso presente bilateralmente. Rinoscopia anterior: mucosa rósea, sem secreção. Linfonodos cervicais não palpáveis. Tireoide de tamanho normal, sem nódulos palpáveis.'}]},
 ef_pele:{s:'Pele',t:'Pele e anexos',src:'semiologia dermatológica',k:'pele lesao dermatologico macula papula placa nodulo vesicula hanseniase sensibilidade abcde',sec:[
  {h:'Como descrever uma lesão',li:['Tipo: mácula (plana), pápula (&lt; 1 cm elevada), placa (&gt; 1 cm), nódulo, vesícula, bolha, pústula, úlcera, crosta, escama, liquenificação','Cor, tamanho (em cm), forma, limites, superfície, número e distribuição (localizada, simétrica, em dermátomo)','Lesões pigmentadas: ABCDE e sinal do patinho feio (ver Melanoma)','Mancha hipocrômica, eritematosa ou área dormente: testar sensibilidade térmica, dolorosa e tátil (hanseníase)']},
  {h:'Achados alterados',rows:[['Lesão com alteração de sensibilidade','Suspeita de hanseníase: avaliar nervos, baciloscopia, notificar.'],['Lesão pigmentada assimétrica, irregular ou que mudou','Ver Melanoma; encaminhar à dermatologia com prioridade.'],['Úlcera em perna','Venosa (maléolo medial, edema, dermatite ocre) x arterial (pé, dolorosa, pulsos ausentes): ITB antes de compressão.']]},
  {h:'Texto normal',normal:'Pele íntegra, normocorada, hidratada, sem lesões. Fâneros sem alterações.'}]},
 ef_mama:{s:'Mamas',t:'Exame das mamas',src:'semiologia · INCA',k:'mama exame clinico das mamas nodulo descarga papilar axila quadrantes',sec:[
  {h:'Técnica',svg:EFSVG.mama,li:['Inspeção estática (braços ao longo do corpo) e dinâmica (mãos na cintura pressionando e braços elevados): assimetria, retrações, abaulamentos, pele em casca de laranja','Palpação em decúbito dorsal, braço sob a cabeça, com as polpas digitais em movimentos circulares, cobrindo toda a mama e o prolongamento axilar','Axilas, fossas supra e infraclaviculares sentada','Expressão mamilar só se houver queixa de descarga']},
  {h:'Achados alterados',rows:[['Nódulo endurecido, irregular, aderido','Mamografia diagnóstica e USG; encaminhar à mastologia com prioridade.'],['Retração de pele ou mamilo, casca de laranja','Suspeita de câncer: investigar com prioridade.'],['Descarga espontânea, uniductal, sanguinolenta ou cristalina','Investigar (mamografia, USG).'],['Descarga bilateral, multiductal, à expressão','Geralmente benigna: revisar medicamentos, prolactina e TSH se láctea.']]},
  {h:'Texto normal',normal:'Mamas simétricas, sem abaulamentos ou retrações, mamilos sem alterações. À palpação, sem nódulos ou espessamentos. Sem descarga papilar. Axilas e fossas supraclaviculares livres.'}]},
 ef_gin:{s:'Ginecológico',t:'Exame ginecológico',src:'semiologia · INCA',k:'ginecologico especular preventivo citopatologico colo toque bimanual vulva',sec:[
  {h:'Técnica',li:['Explicar, pedir consentimento, oferecer acompanhante; posição ginecológica','Inspeção da vulva e do períneo','Espéculo do tamanho adequado, introduzido oblíquo e girado; visualizar paredes, conteúdo e colo','Coleta do citopatológico: espátula de Ayre na ectocérvice (giro de 360°) e escova na endocérvice; lâmina identificada e fixada logo','Toque bimanual: colo (mobilização dolorosa?), útero (posição, volume, mobilidade) e anexos']},
  {h:'Achados alterados',rows:[['Dor à mobilização do colo + febre ou dor pélvica','Doença inflamatória pélvica: tratar e reavaliar em 72 h.'],['Lesão visível no colo','Encaminhar à colposcopia independente do citopatológico.'],['Útero aumentado e irregular','Mioma: USG transvaginal.'],['Massa anexial','USG transvaginal; urgência se dor intensa (torção) ou atraso menstrual (gestação ectópica).']]},
  {h:'Texto normal',normal:'Vulva e períneo sem lesões. Ao exame especular: paredes vaginais íntegras, conteúdo fisiológico, colo epitelizado, sem lesões visíveis. Coletado citopatológico [sim/não]. Toque bimanual: colo fibroelástico, indolor à mobilização, útero em AVF, de volume normal, anexos não palpáveis.'}]},
 ef_ped:{s:'Lactente',t:'Exame físico do lactente',src:'semiologia pediátrica · Caderneta da Criança',k:'exame fisico crianca lactente recem-nascido fontanela reflexo vermelho ortolani barlow moro testiculos',sec:[
  {h:'Pontos que não podem faltar',li:['Peso, comprimento e perímetro cefálico nas curvas da Caderneta','Fontanelas: anterior fecha entre 9 e 18 meses; abaulada (hipertensão intracraniana) ou deprimida (desidratação)','Reflexo vermelho com oftalmoscópio a 50 cm, em ambiente escuro','Pulsos femorais (coarctação de aorta) e ausculta cardíaca','Quadril: Ortolani e Barlow até 3 meses; depois, limitação da abdução e assimetria de pregas','Genitália: testículos na bolsa, hipospádia, aderência de pequenos lábios','Reflexos primitivos: Moro e preensão palmar somem até 4–6 meses']},
  {h:'Achados alterados',rows:[['Reflexo vermelho ausente, assimétrico ou leucocoria','Oftalmologia com urgência (catarata congênita, retinoblastoma).'],['Pulsos femorais fracos ou ausentes','Cardiologia pediátrica (coarctação).'],['Ortolani ou Barlow positivos','USG de quadril e ortopedia.'],['Testículo fora da bolsa após 6 meses','Cirurgia pediátrica.'],['PC fora de −2 a +2 escores-z ou crescendo rápido','Investigar (microcefalia, hidrocefalia).']]},
  {h:'Texto normal',normal:'BEG, ativo(a), reativo(a), corado(a), hidratado(a), acianótico(a), anictérico(a). Fontanela anterior normotensa, [ ] x [ ] cm. Reflexo vermelho presente bilateralmente. ACV: RCR 2T, BNF, sem sopros; pulsos femorais palpáveis. AR: MV+ sem RA. Abdome flácido, sem visceromegalias. Genitália típica, testículos tópicos. Ortolani e Barlow negativos. Reflexos primitivos presentes e simétricos.'}]},
 efp_lomb:{s:'Lombalgia',t:'Lombalgia e ciática',src:'semiologia ortopédica',k:'lombalgia lasegue ciatica radiculopatia l4 l5 s1 dermatomos schober exame',sec:[
  {h:'Lasègue',svg:EFSVG.lasegue,li:['Decúbito dorsal; elevar a perna estendida segurando o calcanhar','Positivo: dor irradiada abaixo do joelho entre 30° e 70° (dor só lombar ou atrás da coxa não conta)','Lasègue cruzado (dor ao elevar a perna sadia): muito específico para hérnia discal','Schober: marcar 10 cm acima de L5; na flexão deve aumentar ≥ 5 cm']},
  {h:'Raiz acometida',rows:[['L4','Fraqueza para estender o joelho; reflexo patelar diminuído; sensibilidade na face medial da perna.'],['L5','Fraqueza para estender o hálux e andar nos calcanhares; sensibilidade no dorso do pé.'],['S1','Fraqueza para andar na ponta dos pés; reflexo aquileu diminuído; sensibilidade na borda lateral e planta do pé.'],['Anestesia em sela, retenção urinária','Síndrome da cauda equina: urgência.']]},
  {h:'Texto normal',normal:'Coluna lombar sem deformidades, sem dor à palpação de processos espinhosos, contratura paravertebral [ausente]. Mobilidade preservada (Schober [ ] cm). Lasègue negativo bilateralmente. Força preservada em MMII (L4, L5, S1), reflexos patelar e aquileu presentes e simétricos, sensibilidade preservada.'}]},
 efp_ombro:{s:'Ombro doloroso',t:'Ombro doloroso',src:'semiologia ortopédica',k:'ombro dor manguito rotador neer hawkins jobe patte speed capsulite tendinite bursite',sec:[
  {h:'Testes',rows:[['Arco doloroso (dor entre 60° e 120° de abdução)','Síndrome do impacto / tendinopatia do supraespinal.'],['Neer (elevação passiva com o braço em rotação interna) e Hawkins (flexão a 90° + rotação interna)','Impacto subacromial.'],['Jobe (braços a 90°, 30° à frente, polegares para baixo, resistir)','Supraespinal (dor = tendinopatia; fraqueza = possível rotura).'],['Patte (rotação externa contra resistência com cotovelo a 90°)','Infraespinal.'],['Gerber / lift-off (afastar a mão das costas)','Subescapular.'],['Speed (flexão contra resistência com antebraço supinado)','Tendão da cabeça longa do bíceps.'],['Perda da rotação externa passiva e ativa','Capsulite adesiva (ombro congelado), comum em DM.'],['Fraqueza importante após trauma, idade &gt; 60','Possível rotura do manguito: USG e ortopedia.']]},
  {h:'Texto normal',normal:'Ombro [D/E] sem deformidades ou atrofias, sem dor à palpação. ADM ativa e passiva preservada. Arco doloroso ausente. Testes de Neer, Hawkins, Jobe, Patte, Gerber e Speed negativos.'}]},
 efp_joelho:{s:'Joelho',t:'Joelho',src:'semiologia ortopédica · regra de Ottawa',k:'joelho lachman gaveta mcmurray menisco ligamento derrame ottawa',sec:[
  {h:'Testes',rows:[['Derrame (sinal da tecla ou da ondulação)','Lesão intra-articular, artrose agudizada, gota, infecção (febre: puncionar/urgência).'],['Lachman (joelho a 20–30°, anteriorizar a tíbia) e gaveta anterior (90°)','Ligamento cruzado anterior.'],['Gaveta posterior','Ligamento cruzado posterior.'],['McMurray e Apley (rotação com flexão/compressão)','Lesão meniscal.'],['Estresse em valgo e varo a 30°','Ligamentos colaterais medial e lateral.'],['Dor à compressão patelar','Síndrome femoropatelar.']]},
  {h:'Raio-X após trauma (Ottawa)',li:['Idade ≥ 55 anos','Dor isolada na patela ou na cabeça da fíbula','Incapaz de fletir até 90°','Incapaz de dar 4 passos logo após o trauma e na consulta']},
  {h:'Texto normal',normal:'Joelho [D/E] sem edema, derrame ou sinais flogísticos. ADM preservada, sem crepitação. Lachman e gavetas negativos, McMurray negativo, estresse em varo e valgo estável.'}]},
 efp_vert:{s:'Vertigem',t:'Exame na vertigem',src:'AAO-HNS · HINTS',k:'vertigem dix-hallpike epley head roll hints nistagmo tontura vppb',sec:[
  {h:'Dix-Hallpike',svg:EFSVG.dix,li:['Sentado na maca, virar a cabeça 45° para o lado testado','Deitar rápido com a cabeça 20–30° abaixo da maca, segurando-a; observar os olhos por 30–60 s','Positivo (VPPB de canal posterior): nistagmo torcional para cima, com latência de segundos e duração &lt; 1 min, que cansa ao repetir']},
  {h:'Manobra de Epley (lado positivo)',li:['1. Posição final do Dix-Hallpike por 30–60 s','2. Girar a cabeça 90° para o outro lado, manter 30–60 s','3. Rolar o corpo para o mesmo lado, olhando para o chão, 30–60 s','4. Sentar devagar; pode repetir 2–3 vezes']},
  {h:'Vertigem contínua: HINTS',rows:[['Impulso cefálico','Alterado (sacada corretiva) sugere periférico; normal em vertigem contínua sugere central.'],['Nistagmo','Horizontal unidirecional: periférico. Muda de direção com o olhar ou vertical: central.'],['Skew (teste de cobertura)','Desvio vertical presente: central.'],['Qualquer achado central ou ataxia intensa','Emergência (suspeita de AVC).']]},
  {h:'Texto normal',normal:'Nistagmo espontâneo ausente. Dix-Hallpike negativo bilateralmente. Head roll negativo. Impulso cefálico normal. Romberg negativo, marcha sem alterações. Exame neurológico sem déficits.'}]},
 efp_tunel:{s:'Punho e mão',t:'Túnel do carpo e punho',src:'semiologia ortopédica',k:'tunel do carpo phalen tinel finkelstein de quervain mao formigamento',sec:[
  {h:'Testes',rows:[['Phalen (flexão máxima dos punhos por 60 s)','Parestesia no 1º ao 3º dedos: síndrome do túnel do carpo.'],['Tinel (percussão sobre o túnel do carpo)','Choque no território do mediano: túnel do carpo.'],['Atrofia tenar, fraqueza para abduzir o polegar','Túnel do carpo avançado: eletroneuromiografia e cirurgia.'],['Finkelstein (polegar na palma, desvio ulnar)','Dor no processo estiloide radial: tenossinovite de De Quervain.']]},
  {h:'Texto normal',normal:'Punhos e mãos sem edema ou deformidades, sem atrofias. Phalen e Tinel negativos bilateralmente. Finkelstein negativo. Força e sensibilidade preservadas.'}]},
 efp_pe:{s:'Pé diabético',t:'Pé diabético',src:'IWGDF · SBD',k:'pe diabetico monofilamento diapasao neuropatia pulsos itb ulcera calosidade',sec:[
  {h:'Monofilamento 10 g',svg:EFSVG.pe,li:['Mostrar antes na mão da pessoa; depois, olhos fechados','Aplicar perpendicular à pele até curvar, por cerca de 2 s, nos 4 pontos (hálux, 1ª, 3ª e 5ª cabeças metatarsais), evitando calos','Perda da sensibilidade em qualquer ponto = neuropatia (perda da sensibilidade protetora)','Diapasão 128 Hz na falange distal do hálux; reflexo aquileu; pulsos pediosos e tibiais posteriores']},
  {h:'Risco e seguimento (IWGDF)',rows:[['0: sem perda de sensibilidade e sem doença arterial','Exame anual.'],['1: perda de sensibilidade ou doença arterial','A cada 6–12 meses; orientar calçados e autoexame.'],['2: perda de sensibilidade + doença arterial ou deformidade','A cada 3–6 meses; calçado adequado, podologia.'],['3: úlcera ou amputação prévia, ou DRC terminal','A cada 1–3 meses; equipe especializada.'],['Úlcera ativa, pé quente e edemaciado (Charcot) ou isquemia','Encaminhar com prioridade; infecção grave: urgência.']]},
  {h:'Texto normal',normal:'Pés com pele íntegra, sem calosidades, fissuras ou micoses, unhas sem alterações, sem deformidades. Monofilamento 10 g: sensível nos 4 pontos bilateralmente. Diapasão 128 Hz: vibração presente. Reflexo aquileu presente. Pulsos pediosos e tibiais posteriores palpáveis e simétricos.'}]},
 efp_ulc:{s:'Úlceras',t:'Úlceras e feridas crônicas',src:'WOCN · NPIAP 2016 · IWGDF · protocolos de feridas da APS',k:'ulcera ferida curativo lesao por pressao escara venosa arterial neuropatica wagner push braden cobertura esfacelo necrose granulacao exsudato',rel:[['push','Escala PUSH'],['braden','Escala de Braden'],['itb','Calculadora ITB'],['efp_ven','Insuficiência venosa'],['efp_art','Insuficiência arterial'],['efp_pe','Pé diabético']],sec:[
  {h:'Onde costuma aparecer cada tipo',svg:EFSVG.ulc,li:['<b>Venosa:</b> terço distal da perna, sobretudo acima do maléolo medial (região da polaina)','<b>Arterial:</b> dedos, dorso do pé, calcanhar, maléolo lateral e região pré-tibial','<b>Neuropática (pé diabético):</b> planta, cabeças metatarsais, hálux, áreas de calo','<b>Lesão por pressão:</b> sobre proeminências ósseas (sacro, calcâneo, trocânter, ísquio, maléolos)']},
  {h:'Como descrever a ferida',li:['Localização e tempo de evolução','Tamanho: maior comprimento (sentido cabeça-pé) × maior largura perpendicular × profundidade, em cm; fotografar com régua','Leito: % de granulação (vermelho vivo), esfacelo (amarelo, aderido), necrose (preta ou marrom, seca ou úmida), epitelização (rosa, nas bordas)','Exsudato: ausente, pouco, moderado ou abundante; seroso, sanguinolento, purulento','Bordas: regulares ou irregulares, aderidas, maceradas, descoladas (solapamento), hiperqueratose','Pele ao redor: eritema, edema, maceração, dermatite ocre, eczema, calor','Odor (após limpeza), dor (0–10), sinais de infecção, exposição de tendão ou osso']},
  {h:'Diferenciar pelo exame',rows:[['Venosa','Rasa, bordas irregulares, leito com granulação ou fibrina, muito exsudato. Pele com hiperpigmentação ocre, eczema, lipodermatoesclerose, edema e varizes. Pulsos presentes. Dor que melhora com a perna elevada.'],['Arterial','Profunda, “em saca-bocado”, bordas regulares, leito pálido ou necrótico, pouco exsudato. Pele fria, brilhante, sem pelos, pulsos diminuídos ou ausentes, enchimento capilar &gt; 2 s. Dor intensa que piora com a perna elevada e à noite.'],['Neuropática','Indolor, sobre área de pressão plantar, com calo ao redor (hiperqueratose). Pé quente, pulsos presentes, monofilamento alterado.'],['Mista','Sinais venosos com ITB entre 0,5 e 0,8: compressão só reduzida e com especialista.'],['Atípica (pensar em outras causas)','Localização incomum, não cicatriza em 3 meses de tratamento adequado, bordas elevadas ou vegetantes: biópsia (carcinoma, pioderma gangrenoso, vasculite, hanseníase).']]},
  {h:'Lesão por pressão: estágios (NPIAP)',rows:[['Estágio 1','Pele íntegra com eritema que não embranquece à digitopressão.'],['Estágio 2','Perda parcial da pele: leito vermelho-rosado úmido ou bolha íntegra/rompida, sem esfacelo.'],['Estágio 3','Perda total da pele, gordura visível, pode ter esfacelo, sem osso, tendão ou músculo expostos.'],['Estágio 4','Perda total com exposição de fáscia, músculo, tendão, cartilagem ou osso.'],['Não classificável','Leito coberto por esfacelo ou escara que impede ver a profundidade.'],['Tissular profunda','Área vermelho-escura, marrom ou púrpura persistente, ou bolha com sangue.']]},
  {h:'Pé diabético: classificação de Wagner',rows:[['Grau 0','Sem úlcera, pé de risco (deformidade, calo).'],['Grau 1','Úlcera superficial.'],['Grau 2','Úlcera profunda até tendão, cápsula ou osso, sem abscesso.'],['Grau 3','Úlcera profunda com abscesso, osteomielite ou artrite séptica: encaminhar com urgência.'],['Grau 4','Gangrena localizada (dedos, antepé): urgência vascular.'],['Grau 5','Gangrena de todo o pé: urgência.']]},
  {h:'Infecção (IWGDF/IDSA)',rows:[['Sem infecção','Sem sinais inflamatórios ou purulência: não usar antibiótico.'],['Leve','2 ou mais: edema ou endurecimento, eritema de 0,5 a 2 cm ao redor, dor ou sensibilidade, calor, secreção purulenta. Antibiótico oral 1–2 semanas (cefalexina 500 mg 6/6 h ou amoxicilina-clavulanato 875/125 mg 12/12 h).'],['Moderada','Eritema &gt; 2 cm ou acometendo estruturas profundas (abscesso, osteomielite, fasciíte), sem sinais sistêmicos: avaliar no mesmo dia, raio-X, discutir internação.'],['Grave','Com sinais sistêmicos (febre, FC &gt; 90, FR &gt; 20, leucocitose): urgência.'],['Osso palpável com a sonda (probe-to-bone) ou exposto','Osteomielite provável: raio-X e encaminhar.']]},
  {h:'Cobertura conforme o leito',rows:[['Limpeza','Soro fisiológico 0,9% morno em jato (seringa 20 mL, agulha 40×12) em toda troca; secar só a pele ao redor.'],['Granulação, pouco exsudato','Ácidos graxos essenciais (AGE), hidrocoloide ou espuma; manter úmido.'],['Esfacelo','Hidrogel ou papaína 4–10%; desbridamento instrumental conservador se capacitado.'],['Muito exsudato','Alginato de cálcio ou espuma; proteger a pele ao redor (creme barreira).'],['Infectada ou colonizada crítica','Cobertura com prata ou PHMB, trocas mais frequentes; antibiótico sistêmico só se infecção clínica.'],['Necrose seca em membro isquêmico','Não desbridar nem umedecer: manter seca e encaminhar ao vascular.'],['Úlcera venosa','Compressão é o tratamento principal (se ITB ≥ 0,8): bota de Unna ou bandagem multicamadas, trocar a cada 5–7 dias.']]},
  {h:'Texto para o O do SOAP',normal:'Úlcera em [terço distal medial da perna D], medindo [ ] × [ ] cm, profundidade [superficial / __ cm], bordas [regulares, aderidas], leito com [__% granulação, __% esfacelo, sem necrose], exsudato [pouco, seroso], sem odor fétido. Pele perilesional [com hiperpigmentação ocre, sem eritema ou calor]. Sem exposição de tendão ou osso. Pulsos pediosos e tibiais posteriores [palpáveis]. ITB [ ]. Escala PUSH: [ ].'}]},
 efp_ven:{s:'Insuf. venosa',t:'Insuficiência venosa crônica',src:'SBACV · ESVS 2022 · CEAP 2020',k:'insuficiencia venosa varizes ceap edema dermatite ocre lipodermatoesclerose trendelenburg perthes meia de compressao ulcera venosa',rel:[['efp_ulc','Úlceras'],['itb','Calculadora ITB'],['wells_tvp','Wells TVP'],['efp_art','Insuficiência arterial']],sec:[
  {h:'Anamnese',li:['Peso, dor, cansaço e queimação nas pernas, piores no fim do dia e no calor, que melhoram com elevação','Edema vespertino, cãibras noturnas, prurido, pernas inquietas','Fatores: gestações, obesidade, ortostatismo prolongado, história familiar, TVP prévia (síndrome pós-trombótica)','Sinais de alarme: edema unilateral súbito e doloroso (TVP), sangramento de variz, tromboflebite (cordão endurecido, quente e doloroso)']},
  {h:'Exame (paciente em pé, pernas expostas da virilha aos pés)',svg:EFSVG.ven,li:['Inspeção: telangiectasias, veias reticulares, varizes (≥ 3 mm), coroa flebectásica no tornozelo, edema, hiperpigmentação ocre, eczema, lipodermatoesclerose (pele endurecida, “garrafa invertida”), atrofia branca, úlcera aberta ou cicatrizada','Palpação: cacifo, temperatura, dor no trajeto venoso, cordões endurecidos; medir a circunferência da panturrilha bilateral','Pulsos distais sempre (antes de prescrever compressão) e ITB se pulsos fracos ou fatores de risco','Sinal de Stemmer (não consegue pinçar a pele do dorso do 2º dedo): sugere linfedema']},
  {h:'Testes clínicos',rows:[['Brodie-Trendelenburg','Deitado, elevar a perna para esvaziar as veias, garrotear a coxa abaixo da virilha e pôr de pé: enchimento rápido após soltar o garrote indica refluxo da junção safeno-femoral; enchimento rápido com o garrote, refluxo de perfurantes.'],['Perthes','Garrote na coxa, paciente caminha: varizes que esvaziam indicam sistema profundo pérvio; se pioram e doem, suspeitar obstrução profunda.'],['Schwartz (percussão)','Percutir a variz embaixo e sentir a onda na safena acima: veia insuficiente.'],['Na prática','O Doppler venoso (eco-Doppler) confirma o refluxo e é solicitado quando há indicação de tratamento intervencionista.']]},
  {h:'Classificação clínica CEAP e conduta',rows:[['C0','Sem sinais visíveis (podem existir sintomas). MEV.'],['C1','Telangiectasias ou veias reticulares (&lt; 3 mm). Estético; MEV.'],['C2','Varizes (≥ 3 mm). MEV, meia 20–30 mmHg se sintomas; encaminhar se sintomas refratários ou complicações.'],['C3','Edema de origem venosa. Meia 20–30 ou 30–40 mmHg, elevação, exercícios de panturrilha.'],['C4a','Pigmentação ocre ou eczema. Compressão, hidratar a pele, corticoide tópico no eczema; encaminhar ao vascular.'],['C4b','Lipodermatoesclerose ou atrofia branca. Compressão e encaminhar (alto risco de úlcera).'],['C4c','Coroa flebectásica.'],['C5','Úlcera venosa cicatrizada. Meia 30–40 mmHg contínua para evitar recidiva.'],['C6','Úlcera venosa ativa. Curativo + compressão (bota de Unna ou multicamadas) se ITB ≥ 0,8; encaminhar ao vascular.'],['Sufixo r','Recorrente (ex.: C2r, C6r).']]},
  {h:'Tratamento na APS',li:['Elevar as pernas 30 min 3–4 vezes ao dia, caminhar, exercitar a panturrilha, perder peso, evitar ficar muito tempo parado em pé ou sentado','Meia elástica de compressão graduada (3/4 ou 7/8), colocar ao acordar: 20–30 mmHg (C2–C3) ou 30–40 mmHg (C4–C6)','Não comprimir se ITB &lt; 0,5 ou doença arterial grave; ITB 0,5–0,8: compressão reduzida com especialista','Flebotônicos para sintomas e edema: diosmina + hesperidina 1.000 mg/dia, por 2–3 meses, reavaliando','Encaminhar ao vascular: C4b em diante, úlcera, varicorragia, tromboflebite de repetição ou próxima da junção safeno-femoral, sintomas que limitam apesar da compressão']},
  {h:'Diagnósticos diferenciais do edema',rows:[['TVP','Edema unilateral agudo, dor, empastamento da panturrilha: aplicar Wells TVP.'],['Linfedema','Edema duro, Stemmer positivo, acomete o dorso do pé.'],['Insuficiência cardíaca, renal ou hepática, hipotireoidismo','Edema bilateral simétrico com outros sinais sistêmicos.'],['Medicamentos','Anlodipino e outros BCC, pioglitazona, AINE, corticoide, pregabalina/gabapentina.'],['Lipedema','Mulher, gordura simétrica dolorosa nas pernas, poupando os pés.'],['Celulite','Unilateral, eritema, calor, febre (mais raro bilateral: pensar em dermatite de estase).']]},
  {h:'Texto para o O do SOAP',normal:'Membros inferiores (ortostatismo): [varizes em trajeto de safena magna à D/E], [telangiectasias], [edema +/4+ em tornozelos, depressível], [hiperpigmentação ocre em terço distal medial bilateral]. Sem lipodermatoesclerose, sem úlceras. Panturrilhas livres, sem empastamento, circunferência [ ] cm D / [ ] cm E. Pulsos pediosos e tibiais posteriores palpáveis e simétricos. Classificação CEAP: [C2/C3].'}]},
 efp_art:{s:'Insuf. arterial',t:'Doença arterial periférica',src:'SBACV · ESC/ESVS 2024 · AHA/ACC 2024',k:'doenca arterial periferica dap claudicacao intermitente pulsos itb indice tornozelo braquial fontaine rutherford buerger isquemia aguda cilostazol',rel:[['itb','Calculadora ITB'],['efp_ulc','Úlceras'],['efp_pe','Pé diabético'],['rcv','Risco CV'],['efp_ven','Insuficiência venosa']],sec:[
  {h:'Anamnese',li:['Claudicação intermitente: dor, cãibra ou cansaço na panturrilha (ou coxa e nádega) ao caminhar, que passa em até 10 min de repouso; anotar a distância','Dor em repouso: no pé, pior à noite e deitado, melhora com a perna pendente (dorme sentado)','Feridas que não cicatrizam, mudança de cor dos dedos','Fatores: tabagismo, diabetes, HAS, dislipidemia, DRC, idade ≥ 65, doença coronariana ou carotídea']},
  {h:'Exame',svg:EFSVG.pulsos,li:['Inspeção: palidez, cianose, rarefação de pelos, unhas espessas, pele fina e brilhante, atrofia muscular, úlceras e gangrena (dedos, calcanhar)','Temperatura comparando os dois lados com o dorso da mão','Pulsos: femoral (abaixo do ligamento inguinal), poplíteo (fossa poplítea com o joelho levemente fletido), tibial posterior (atrás do maléolo medial) e pedioso (dorso do pé, lateral ao tendão do hálux). Graduar: 0 ausente, 1+ diminuído, 2+ normal','Enchimento capilar no hálux: &gt; 2 s alterado','Ausculta de sopro femoral e abdominal','Teste de Buerger: elevar a perna a 45° por 1–2 min (palidez = isquemia) e depois deixar pendente (rubor tardio e demorado = isquemia grave)']},
  {h:'ITB (índice tornozelo-braquial)',li:['Repouso deitado por 5–10 min; manguito no braço e logo acima do maléolo','Medir a PAS com Doppler portátil (ou pela palpação, menos preciso) nos 2 braços, na tibial posterior e na pediosa de cada lado','ITB de cada perna = maior PAS do tornozelo daquele lado ÷ maior PAS braquial','Use a calculadora de ITB para fazer a conta e interpretar']},
  {h:'Interpretação do ITB',rows:[['&gt; 1,40','Artérias incompressíveis (calcificadas: diabetes, DRC). Não exclui DAP: índice hálux-braquial ou Doppler arterial.'],['1,00–1,40','Normal.'],['0,91–0,99','Limítrofe: repetir após exercício se sintomas.'],['0,70–0,90','DAP leve.'],['0,40–0,69','DAP moderada.'],['&lt; 0,40','DAP grave: risco de isquemia crítica.']]},
  {h:'Classificação de Fontaine e Rutherford',rows:[['Fontaine I · Rutherford 0','Assintomático (ITB alterado). Tratar fatores de risco.'],['Fontaine IIa · Rutherford 1','Claudicação leve (&gt; 200 m). Tratamento clínico e caminhada.'],['Fontaine IIb · Rutherford 2–3','Claudicação moderada a grave (&lt; 200 m). Tratamento clínico; encaminhar se limita a vida apesar dele.'],['Fontaine III · Rutherford 4','Dor isquêmica em repouso: encaminhar com prioridade (isquemia crônica que ameaça o membro).'],['Fontaine IV · Rutherford 5–6','Úlcera ou gangrena: encaminhar com prioridade; infecção ou gangrena úmida, urgência.']]},
  {h:'Tratamento na APS',li:['Parar de fumar (o principal), caminhar 30–45 min pelo menos 3 vezes por semana até a dor moderada, parar e retomar','AAS 100 mg/dia (ou clopidogrel 75 mg) se sintomático ou revascularizado','Estatina de alta intensidade (atorvastatina 40–80 mg ou rosuvastatina 20–40 mg), meta de LDL &lt; 55','PA &lt; 130/80 (IECA/BRA), controle glicêmico, cuidado diário dos pés','Cilostazol 100 mg 12/12 h para claudicação que limita (contraindicado na insuficiência cardíaca); reavaliar em 3 meses','Não usar meia de compressão se ITB &lt; 0,5']},
  {h:'Isquemia aguda: emergência',li:['Início súbito dos 6 P: dor (pain), palidez, ausência de pulso, parestesia, paralisia e frio (poiquilotermia)','Pensar em embolia (fibrilação atrial) ou trombose sobre placa','Acionar o SAMU ou encaminhar à emergência vascular imediatamente; não elevar o membro; heparina conforme orientação da regulação']},

const EW=(c,t)=>{let y=0;for(const k of c){if(k[0]==='g'){const d=(t-k[1])/k[2];if(d>-5&&d<5)y+=k[3]*Math.exp(-d*d/2)}else{const s=x=>1/(1+Math.exp(-x));y+=k[3]*s((t-k[1])/k[4])*s((k[2]-t)/k[4])}}return y};

  for(let x=0;x<=W+1e-6;x++)g+=`<path d="M${x} 0V${H}" stroke-width="${x%5?0.05:0.13}" opacity="${x%5?0.35:0.7}"/>`;
  for(let y=0;y<=H;y++)g+=`<path d="M0 ${y}H${W}" stroke-width="${y%5?0.05:0.13}" opacity="${y%5?0.35:0.7}"/>`;
  P.forEach((p,i)=>{let d='';
    for(let t=0;t<=p.ms;t+=2){let v=p.f?p.f(t):0;for(const b of p.b)v+=EW(b[1],t-b[0]);const y=Math.min(H-0.3,Math.max(0.3,B-v));d+=(t?'L':'M')+(x0+t/40).toFixed(2)+' '+y.toFixed(2)}
    tr+=`<path d="${d}" style="stroke:var(--fg)" stroke-width="0.32" fill="none" stroke-linejoin="round"/>`;
    if(p.lab)tr+=`<rect x="${x0+0.5}" y="0.5" width="${(p.lab.length*F*0.58+1.2).toFixed(2)}" height="${(F*1.35).toFixed(2)}" rx="0.8" style="fill:var(--surface)" opacity="0.85"/><text x="${x0+1.1}" y="${(F*1.12).toFixed(2)}" font-size="${F}" style="fill:var(--fg)">${p.lab}</text>`;
    if(i)tr+=`<path d="M${x0} 0V${H}" style="stroke:var(--fg)" stroke-width="0.35"/>`;
    x0+=p.ms/40});
  (o.ann||[]).forEach(a=>{const x1=a[0]/40,x2=a[1]/40,y=a[2];tr+=`<path d="M${x1} ${y}H${x2}M${x1} ${y-1}V${y+1}M${x2} ${y-1}V${y+1}" style="stroke:var(--accent)" stroke-width="0.3"/><text x="${(x1+x2)/2}" y="${y-1.2}" font-size="${f2}" text-anchor="middle" style="fill:var(--accent)" font-weight="600">${a[3]}</text>`});
  (o.lbl||[]).forEach(a=>{tr+=`<text x="${a[0]/40}" y="${a[1]}" font-size="${f2}" text-anchor="middle" style="fill:var(--accent)" font-weight="600">${a[2]}</text>`});
  return `<svg class="ecg" viewBox="0 0 ${W} ${H}" role="img" font-family="system-ui,sans-serif"><g style="stroke:var(--accent2)">${g}</g>${tr}</svg>`;
}

  {h:'Taquicardia sinusal',svg:ECGSVG.taqsin,li:['P sinusal antes de cada QRS, FC &gt; 100 (raramente acima de 220 − idade)','Tratar a causa: febre, dor, desidratação, anemia, hipertireoidismo, TEP, ansiedade, cafeína, salbutamol']},
  {h:'Fibrilação atrial',svg:ECGSVG.fa,li:['RR irregularmente irregular, sem onda P, linha de base com ondas f finas ou grosseiras','Estável com FC alta: controlar a FC (metoprolol 25–50 mg 12/12 h ou diltiazem; digoxina se IC com FE reduzida); meta inicial &lt; 110 em repouso','Anticoagular conforme CHA₂DS₂-VASc (ver calculadora); avaliar sangramento com HAS-BLED','Início há menos de 48 h, sintomas importantes ou instabilidade: serviço de urgência','Investigar: TSH, eletrólitos, função renal, ecocardiograma; álcool, apneia do sono, HAS']},
  {h:'Flutter atrial',svg:ECGSVG.flutter,li:['Ondas F em “dente de serra” a cerca de 300 por minuto, melhor vistas em DII, DIII e aVF','Condução 2:1 (FC 150) é a mais comum: desconfie de taquicardia regular fixa em 150','Conduta parecida com a da FA (controle de FC e anticoagulação); encaminhar à cardiologia (ablação)']},
  {h:'TSV paroxística (reentrada)',svg:ECGSVG.tsv,li:['Regular, QRS estreito, FC 150–250, início e fim súbitos','P não visível ou retrógrada logo após o QRS (pseudo-r′ em V1, pseudo-S em DII)','Estável: manobra vagal modificada (Valsalva soprando uma seringa de 10 mL por 15 s, depois deitar e elevar as pernas)','Adenosina 6 mg IV em bolus rápido com flush de 20 mL de SF, depois 12 mg (em ambiente monitorado)','Após reverter: ECG em ritmo sinusal (procurar pré-excitação) e encaminhar à cardiologia']},
  {h:'Taquicardia ventricular',svg:ECGSVG.tv,li:['QRS largo, regular, FC 100–250','Favorecem TV: dissociação AV, batimentos de captura ou fusão, concordância precordial (todos positivos ou negativos de V1 a V6), eixo extremo, cardiopatia ou infarto prévio','Emergência: SAMU. Sem pulso: RCP e desfibrilação']},
  {h:'Fibrilação ventricular',svg:ECGSVG.fv,li:['Ondas caóticas, sem QRS identificável','Parada cardíaca: RCP e desfibrilar imediatamente']},
  {h:'Extrassístoles',svg:ECGSVG.esv,rows:[['Ventricular (ESV)','Precoce, QRS largo e bizarro sem P antes, T oposta ao QRS, pausa compensatória.'],['Supraventricular (ESSV)','P precoce com morfologia diferente, QRS estreito igual ao de base.'],['Bigeminismo, trigeminismo','Uma extrassístole a cada 1 ou 2 batimentos normais.'],['Isoladas, sem sintomas e sem cardiopatia','Benignas: reduzir cafeína, álcool e estimulantes; checar K, Mg e TSH.'],['Frequentes, sintomáticas, em salvas, ou com cardiopatia ou síncope','Holter, ecocardiograma e cardiologia; betabloqueador para sintomas.']]}]},
 ecg_bradi:{s:'Bradiarritmias',t:'ECG: bradiarritmias e bloqueios AV',src:'SBC 2022 · AHA ACLS 2020 · ECG na prática',k:'ecg bradicardia bradiarritmia bav bloqueio atrioventricular primeiro grau mobitz wenckebach bavt total marcapasso atropina',rel:[['ecg_taqui','Taquiarritmias'],['ecg_passo','Passo a passo']],sec:[
  {h:'Primeiro: está estável?',li:['FC &lt; 50 com hipotensão, síncope, confusão, dor torácica ou congestão: instável, SAMU','Atropina 1 mg IV a cada 3–5 min (máx. 3 mg) enquanto aguarda; marcapasso transcutâneo onde houver','Revisar causas: betabloqueador, verapamil ou diltiazem, digoxina, amiodarona, ivabradina, donepezila; hipercalemia, hipotireoidismo, hipotermia, IAM inferior, apneia do sono']},
  {h:'Bradicardia sinusal',svg:ECGSVG.bradsin,li:['Ritmo sinusal com FC &lt; 50','Comum em atletas, no sono e com betabloqueador','Sintomática (tontura, síncope, cansaço) ou pausas &gt; 3 s: Holter e cardiologia (doença do nó sinusal)']},
  {h:'BAV de 1º grau',svg:ECGSVG.bav1,li:['PR &gt; 200 ms constante, toda P é conduzida','Geralmente benigno: revisar medicamentos que lentificam o nó AV']},
  {h:'BAV de 2º grau Mobitz I (Wenckebach)',svg:ECGSVG.mob1,li:['PR aumenta progressivamente até uma P não ser conduzida; depois o ciclo recomeça','Em geral no nó AV e benigno (vagal, sono, atletas, medicamentos, IAM inferior)','Assintomático: observar e revisar medicamentos']},
  {h:'BAV de 2º grau Mobitz II',svg:ECGSVG.mob2,li:['PR constante com P bloqueada de repente, sem aumento prévio','Bloqueio abaixo do nó (His-Purkinje), QRS muitas vezes largo','Risco de evoluir para BAVT: encaminhar com prioridade (marcapasso); sintomático, urgência']},
  {h:'BAV 2:1 e avançado',svg:ECGSVG.bav21,li:['Uma P conduzida a cada duas: não dá para dizer se é Mobitz I ou II','QRS largo ou 2 ou mais P seguidas bloqueadas (BAV avançado): tratar como grave e encaminhar com prioridade']},
  {h:'BAV total (3º grau)',svg:ECGSVG.bavt,li:['P e QRS sem relação (dissociação AV): PP regular, RR regular e mais lento','Escape estreito (juncional, 40–60 bpm) ou largo (ventricular, 20–40 bpm)','Urgência: SAMU ou emergência para marcapasso; atropina pode não funcionar no escape largo']},
  {h:'Ritmo de marcapasso',svg:ECGSVG.mp,li:['Espícula vertical antes do QRS (estimulação ventricular: QRS largo, com padrão de BRE quando o eletrodo está no VD); espícula antes da P na estimulação atrial','Espícula sem QRS depois (falha de captura) ou espículas fora de hora (falha de sensibilidade): encaminhar ao serviço de marcapasso','Paciente com marcapasso e síncope ou FC abaixo da programada: urgência']}]},
 ecg_eixo:{s:'Eixo',t:'ECG: eixo elétrico do QRS',src:'SBC 2022 · ECG na prática',k:'ecg eixo eletrico desvio para esquerda direita hexaxial di avf quadrante isodifasica',rel:[['eixo','Calcular eixo'],['ecg_bloq','Bloqueios divisionais'],['ecg_sobrec','Sobrecargas']],sec:[
  {h:'Método rápido: DI e aVF',svg:ECGSVG.hex,rows:[['DI positivo e aVF positivo','Normal (0° a +90°).'],['DI positivo e aVF negativo','Olhe DII: positivo = 0° a −30° (normal); negativo = desvio para a esquerda (além de −30°).'],['DI negativo e aVF positivo','Desvio para a direita (+90° a +180°).'],['DI negativo e aVF negativo','Desvio extremo (−90° a ±180°, “terra de ninguém”).']]},
  {h:'Refinando o ângulo',li:['Positivo ou negativo = soma da parte acima e da parte abaixo da linha de base no QRS','Ache a derivação isodifásica (positivo ≈ negativo): o eixo é perpendicular a ela, do lado da derivação mais positiva','Exemplo: aVL isodifásico e DII positivo: eixo em +60°','Pares perpendiculares: DI e aVF, DII e aVL, DIII e aVR']},
  {h:'Causas',rows:[['Desvio para a esquerda (além de −30°)','Bloqueio divisional anterossuperior (o mais comum), SVE, IAM inferior antigo, WPW, marcapasso de VD, hipercalemia.'],['Desvio para a direita (além de +90°)','SVD (hipertensão pulmonar, DPOC, TEP), bloqueio divisional posteroinferior, IAM lateral, dextrocardia, troca de eletrodos. Pode ser normal em crianças e jovens longilíneos.'],['Desvio extremo','TV, hipercalemia grave, ritmo de marcapasso, troca de eletrodos.']]}]},
 ecg_sobrec:{s:'Sobrecargas',t:'ECG: sobrecargas atriais e ventriculares',src:'SBC 2022 · ECG na prática',k:'ecg sobrecarga hipertrofia sae sad sve svd sokolow cornell peguero strain p mitrale p pulmonale morris',rel:[['sve','Calcular critérios de SVE'],['ecg_eixo','Eixo'],['ecg_bloq','Bloqueios']],sec:[
  {h:'Sobrecarga atrial em DII',svg:ECGSVG.sobat,rows:[['Normal','P ≤ 120 ms e ≤ 2,5 mm.'],['Átrio esquerdo (SAE)','P com duração ≥ 120 ms, muitas vezes bífida (“P mitrale”). Causas: HAS, valvopatia mitral ou aórtica, disfunção do VE, FA prévia.'],['Átrio direito (SAD)','P com amplitude &gt; 2,5 mm, pontiaguda (“P pulmonale”). Causas: DPOC, hipertensão pulmonar, TEP, valvopatia tricúspide, cardiopatias congênitas.'],['Biatrial','P alta e larga ao mesmo tempo.']]},
  {h:'Sobrecarga atrial em V1',svg:ECGSVG.sobv1,rows:[['Normal','P bifásica: parte positiva (AD) &lt; 1,5 mm; parte negativa (AE) &lt; 1 mm e &lt; 40 ms.'],['SAE: índice de Morris','Parte negativa ≥ 1 mm de profundidade e ≥ 40 ms (cabe um quadradinho inteiro).'],['SAD','Parte positiva ≥ 1,5 mm. Na FA, o sinal de Peñaloza-Tranchesi (QRS pequeno em V1 que dobra em V2) sugere SAD.']]},
  {h:'Sobrecarga do ventrículo esquerdo (SVE)',svg:ECGSVG.sve,rows:[['Sokolow-Lyon','S de V1 + R de V5 ou V6 (o maior) &gt; 35 mm.'],['Cornell','R de aVL + S de V3 &gt; 28 mm (homem) ou &gt; 20 mm (mulher).'],['Peguero-Lo Presti (o mais sensível)','S mais profunda de qualquer derivação + S de V4 ≥ 28 mm (homem) ou ≥ 23 mm (mulher).'],['R de aVL','&gt; 11 mm sozinho já sugere SVE.'],['Padrão strain','Infra de ST com T invertida e assimétrica em V5, V6, DI e aVL: “alteração de repolarização secundária à SVE”.'],['Pode imitar','Supra de ST em V1–V3 (sem espelho inferior, com strain lateral): diferencial de IAM. Q estreitas inferolaterais: pensar em cardiomiopatia hipertrófica.'],['Na APS','Em hipertenso, SVE é lesão de órgão-alvo: alto risco CV, intensificar o tratamento, considerar ecocardiograma.']]},
  {h:'Sobrecarga do ventrículo direito (SVD)',svg:ECGSVG.svd,rows:[['R ampla em V1','R &gt; 7 mm ou R/S &gt; 1 em V1 (o critério principal).'],['Desvio do eixo para a direita','QRS negativo em DI e positivo em aVF.'],['S profunda em V5 e V6','S de V5 ou V6 &gt; 7–10 mm.'],['Strain de VD','Infra de ST com T invertida de V1 a V3.'],['Diferenciais da R ampla em V1','BRD, IAM posterior, WPW, dextrocardia, cardiomiopatia hipertrófica, criança.']]}]},
 ecg_bloq:{s:'Bloqueios de ramo',t:'ECG: bloqueios de ramo e divisionais',src:'SBC 2022 · ECG na prática',k:'ecg bloqueio de ramo direito esquerdo brd bre divisional anterossuperior bdas bdasd posteroinferior bdpi bifascicular rsr orelha de coelho sgarbossa',rel:[['ecg_eixo','Eixo'],['ecg_isq','Isquemia e Sgarbossa'],['ecg_bradi','Bloqueios AV']],sec:[
  {h:'Regra rápida: olhe V1',li:['QRS ≥ 120 ms (3 quadradinhos) = bloqueio de ramo completo','V1 com QRS predominantemente positivo (R′): <b>ramo direito</b>','V1 predominantemente negativo (QS ou rS largo): <b>ramo esquerdo</b>','Dica: como a seta do carro, para a direita a alavanca sobe (BRD positivo), para a esquerda desce (BRE negativo)','QRS 110–119 ms com a mesma morfologia: bloqueio incompleto (atraso de condução)']},
  {h:'Bloqueio de ramo direito (BRD)',svg:ECGSVG.brd,li:['QRS ≥ 120 ms','V1: rSR′ (“orelha de coelho”), com T negativa','V5, V6, DI e aVL: onda S larga e empastada','Isolado e assintomático é comum e geralmente benigno (pode ser normal)','Novo, com dispneia súbita: pensar em TEP. Com BDAS: bifascicular']},
  {h:'Bloqueio de ramo esquerdo (BRE)',svg:ECGSVG.bre,li:['QRS ≥ 120 ms','V1: QS ou rS largo; V5, V6, DI e aVL: R larga e entalhada, sem onda q','ST e T opostos ao QRS (secundários)','Quase sempre indica doença cardíaca: ecocardiograma (cardiomiopatia, HAS, valvopatia aórtica, isquemia)','Impede analisar SVE e isquemia pelos critérios habituais. BRE novo ou presumido novo com dor torácica: tratar como síndrome coronariana (critérios de Sgarbossa)']},
  {h:'Bloqueio divisional anterossuperior (BDAS)',svg:ECGSVG.bdas,li:['Eixo além de −45° (desvio para a esquerda)','rS em DII, DIII e aVF, com S de DIII maior que S de DII','qR em DI e aVL','QRS &lt; 120 ms (se não houver BRD associado)','Isolado é frequente e benigno; investigar HAS e cardiopatia']},
  {h:'Outros',rows:[['Bloqueio divisional posteroinferior (BDPI)','Eixo além de +90°, rS em DI e aVL, qR em DII, DIII e aVF. Raro: só após excluir SVD, biotipo longilíneo e IAM lateral.'],['Bifascicular (BRD + BDAS ou BDPI)','Risco de BAV total: síncope ou pré-síncope é urgência; assintomático, cardiologia.'],['Bifascicular + BAV de 1º grau','Chamado de “trifascicular”: encaminhar com prioridade.'],['BRE alternando com BRD','Doença grave do sistema de condução: urgência.']]}]},
 ecg_isq:{s:'Isquemia',t:'ECG: isquemia, lesão e necrose',src:'SBC 2022 · 4ª Definição Universal de IAM · ECG na prática',k:'ecg isquemia infarto iam supra de st infra de st onda t invertida onda q area inativa wellens de winter avr sgarbossa pericardite repolarizacao precoce brugada',rel:[['u_tor','Urgência: dor torácica'],['ecg_passo','Derivações e paredes'],['rcv','Risco CV']],sec:[
  {h:'Supra de ST (lesão)',svg:ECGSVG.isq1,li:['Medir no ponto J (fim do QRS) em relação à linha PR','≥ 1 mm em 2 derivações contíguas (exceto V2–V3)','Em V2–V3: ≥ 2 mm em homens ≥ 40 anos; ≥ 2,5 mm em homens &lt; 40; ≥ 1,5 mm em mulheres','Imagem em espelho (infra nas derivações opostas) reforça o infarto','Com dor torácica: IAM com supra, SAMU e reperfusão (ver Urgência: dor torácica)']},
  {h:'Infra de ST e onda T',svg:ECGSVG.isq2,li:['Infra horizontal ou descendente ≥ 0,5 mm em 2 derivações contíguas: isquemia subendocárdica (SCA sem supra)','Infra de V1 a V3 com R ampla: pensar em IAM posterior, fazer V7–V9','T invertida simétrica ≥ 1 mm em 2 contíguas com R proeminente: isquemia','T hiperaguda (alta, larga e simétrica): fase muito precoce do IAM','Diferenciais: strain de SVE, bloqueios de ramo, efeito digitálico, hipocalemia, pós-taquicardia']},
  {h:'Onda Q patológica (área inativa)',li:['Q ≥ 40 ms ou ≥ 25% da altura do R, em 2 derivações contíguas','Complexos QS de V1 a V3, ou ausência de progressão de R','Indica infarto prévio: prevenção secundária (AAS, estatina de alta intensidade, betabloqueador, IECA/BRA) e ecocardiograma','Q estreitas inferolaterais com SVE: cardiomiopatia hipertrófica']},
  {h:'Padrões de alto risco',rows:[['Wellens','Fora da dor, T bifásica (positiva-negativa) ou profundamente invertida em V2–V3, sem Q: lesão crítica da descendente anterior proximal. Não fazer teste de esforço; encaminhar com urgência.'],['De Winter','Infra de ST ascendente no ponto J com T alta e simétrica de V1 a V6: equivalente de IAM com supra.'],['Supra em aVR + infra difuso','Supra em aVR com infra em 6 ou mais derivações: tronco da coronária esquerda, multiarterial ou isquemia difusa grave.'],['BRE com dor (Sgarbossa)','Supra de ST ≥ 1 mm concordante com o QRS; infra ≥ 1 mm concordante em V1–V3; supra discordante ≥ 25% da S (critério de Smith).'],['IAM posterior','Infra de V1 a V3 com R ampla e T positiva: V7–V9 com supra ≥ 0,5 mm.']]},
  {h:'Diferenciais do supra de ST',svg:ECGSVG.isq3,rows:[['Pericardite','Supra difuso e côncavo, infra do PR (supra do PR em aVR), sem imagem em espelho e sem Q; dor pleurítica que melhora sentado, atrito.'],['Repolarização precoce','Jovem, supra côncavo com entalhe no ponto J, T altas, estável em ECGs seriados.'],['Brugada tipo 1','Supra ≥ 2 mm em V1–V2 em cúpula, descendente, com T negativa: risco de morte súbita, encaminhar à cardiologia; febre pode desmascarar.'],['Outros','SVE, BRE, hipercalemia, aneurisma de VE (supra persistente com Q após IAM), Takotsubo, ritmo de marcapasso.']]}]},
 ecg_qt:{s:'QT',t:'ECG: intervalo QT',src:'SBC 2022 · AHA · CredibleMeds · ECG na prática',k:'ecg qt qtc longo curto bazett fridericia framingham torsades medicamentos prolongam',rel:[['qtc','Calcular QTc'],['ecg_padroes','Distúrbios eletrolíticos']],sec:[
  {h:'Como medir',svg:ECGSVG.qt,li:['Do início do QRS ao fim da onda T, em DII ou V5 (onde a T termina mais nítida)','Fim da T: onde a tangente à descida da T cruza a linha de base; não incluir a onda U','Medir o RR anterior ao QT medido (ou usar a FC)','Corrigir pela FC: Bazett superestima com FC alta; prefira Fridericia ou Framingham (use a calculadora)']},
  {h:'Valores',rows:[['Normal','QTc 350–450 ms no homem, até 470 ms na mulher, até 460 ms na criança.'],['Longo','Acima do normal; &gt; 500 ms: risco alto de torsades de pointes.'],['Aumento &gt; 60 ms após iniciar um remédio','Risco alto mesmo com QTc &lt; 500.'],['Curto','QTc &lt; 350 ms; &lt; 330 ms: risco, pensar em QT curto congênito, hipercalcemia, efeito digitálico.']]},
  {h:'Remédios comuns na APS que prolongam o QT',li:['Antibióticos: azitromicina, claritromicina, eritromicina, levofloxacino, ciprofloxacino, moxifloxacino, fluconazol','Antieméticos e procinéticos: ondansetrona, domperidona, bromoprida e metoclopramida (em altas doses)','Psicotrópicos: haloperidol, clorpromazina, quetiapina, risperidona, citalopram e escitalopram (dose dependente), tricíclicos (amitriptilina, nortriptilina), lítio','Outros: metadona, hidroxicloroquina, amiodarona, sotalol, tamoxifeno','O risco aumenta com hipocalemia, hipomagnesemia, bradicardia, sexo feminino, idade avançada, IC, DRC e associação de remédios']},
  {h:'Conduta',li:['QTc &gt; 500 ms ou aumento &gt; 60 ms: suspender ou trocar o remédio, corrigir K (manter &gt; 4) e Mg','QT longo sem causa, síncope ou história familiar de morte súbita: cardiologia (QT longo congênito)','Torsades de pointes: emergência, sulfato de magnésio 2 g IV']}]},
 ecg_padroes:{s:'Padrões típicos',t:'ECG: eletrólitos, TEP, WPW e outros padrões',src:'SBC 2022 · ECG na prática',k:'ecg hipercalemia hipocalemia potassio calcio tep s1q3t3 wpw pre-excitacao onda delta hipotermia osborn digital digitalico baixa voltagem derrame pericardico dpoc davd epsilon',rel:[['ecg_isq','Isquemia'],['ecg_qt','QT'],['wells_tep','Wells TEP']],sec:[
  {h:'Potássio',svg:ECGSVG.k,rows:[['Hipercalemia, em sequência','T apiculada, estreita e simétrica → PR longo e P achatada → QRS largo → padrão sinusoidal, FV ou assistolia.'],['Conduta na hipercalemia','K ≥ 6,5 ou qualquer alteração no ECG: emergência. Gluconato de cálcio 10% 10 mL IV em 2–3 min (estabiliza a membrana), insulina regular 10 UI + glicose 50% 50 mL IV, salbutamol inalatório; transferir.'],['Hipocalemia','T achatada, onda U proeminente, infra de ST, QT(U) longo, extrassístoles. Repor K e Mg; abaixo de 2,5 ou com arritmia, urgência.']]},
  {h:'Cálcio',rows:[['Hipercalcemia','QT curto por encurtamento do ST.'],['Hipocalcemia','QT longo por alongamento do ST (a T é normal).']]},
  {h:'Pré-excitação, hipotermia e digital',svg:ECGSVG.pad,rows:[['WPW (pré-excitação)','PR &lt; 120 ms, onda delta (início empastado do QRS), QRS largo, ST-T secundários. Encaminhar à cardiologia (ablação). Em FA pré-excitada, não usar adenosina, verapamil, diltiazem, betabloqueador ou digoxina.'],['Hipotermia','Onda J de Osborn (corcova no fim do QRS), bradicardia, QT longo, tremor na linha de base.'],['Efeito digitálico','Infra de ST “em colher” (em pá), T achatada, QT curto: esperado em quem usa digoxina.'],['Intoxicação digitálica','Náusea, visão amarelada, confusão + ESV bigeminadas, taquicardia atrial com BAV, TV bidirecional, bradiarritmias: suspender, dosar digoxina e K, urgência.']]},
  {h:'Tromboembolismo pulmonar',svg:ECGSVG.tep,li:['Taquicardia sinusal é o achado mais comum','S1Q3T3: S em DI, Q e T invertida em DIII (pouco sensível)','BRD novo, T invertida de V1 a V4, desvio do eixo para a direita, SAD','ECG normal não afasta TEP: use Wells e a clínica']},
  {h:'Outros padrões',rows:[['Baixa voltagem','QRS &lt; 5 mm em todas as derivações do plano frontal e &lt; 10 mm nas precordiais: derrame pericárdico, obesidade, DPOC, hipotireoidismo, amiloidose.'],['Alternância elétrica','QRS que alterna de altura a cada batimento + baixa voltagem + taquicardia: tamponamento cardíaco, emergência.'],['DPOC','Baixa voltagem, P pulmonale, desvio para a direita, progressão lenta de R.'],['Cardiomiopatia arritmogênica do VD','Onda épsilon (entalhe após o QRS) e T invertida de V1 a V3 em jovem com palpitação ou síncope: cardiologia.'],['Brugada','Ver Isquemia, diferenciais do supra.']]}]}
});

 fcecg:{t:'Frequência cardíaca pelo ECG',code:'25 mm/s · 1 quadradinho = 40 ms',f:[{k:'q',l:'Quadradinhos (1 mm) entre dois R seguidos',v:'20'},{k:'c',l:'Ou, se irregular: nº de QRS na tira de 10 s',v:''}],
  calc:v=>{const fc=v.c>0?v.c*6:v.q>0?1500/v.q:0;if(!fc)return null;const cls=fc<50||fc>100?(fc<40||fc>150?'bad':'warn'):'ok';
   return {cls,big:`${nf(fc,0)} <small>bpm</small>`,sub:[v.c>0?'Ritmo irregular: QRS em 10 s × 6.':`RR = ${nf(v.q*40,0)} ms (${nf(v.q,0)} quadradinhos × 40 ms).`,fc<50?'Bradicardia: ver bradiarritmias.':fc>100?'Taquicardia: ver taquiarritmias.':'FC normal (50–100 bpm).'],
    line:`FC pelo ECG: ${nf(fc,0)} bpm.`}}},
 eixo:{t:'Eixo elétrico do QRS',code:'método DI + aVF (+ DII)',f:[{k:'di',l:'QRS em DI',o:[['p','Positivo'],['n','Negativo'],['i','Isodifásico']]},{k:'avf',l:'QRS em aVF',o:[['p','Positivo'],['n','Negativo'],['i','Isodifásico']]},{k:'dii',l:'QRS em DII',o:[['p','Positivo'],['n','Negativo'],['i','Isodifásico']]}],
  calc:v=>{const k=v.di+v.avf;let r;

function addCons(k,t,x){
  if(!x||!x.trim()){toast('Nada para levar ainda');return}
  const t2=String(t).replace(/\s+/g,' ').replace(/(editada|minha|editado)$/i,'').trim();
  if(CONS.it.some(i=>i.k===k&&i.x===x)){toast('Já está na consulta');return}
  CONS.it.push({k,t:t2,x:x.trim()});saveCons();toast('Adicionado ao modo consulta');

function consCompose(){
  let t=(CONS.text||'').replace(/\s+$/,'');
  const by=k=>CONS.it.filter(i=>i.k===k);
  const ef=by('ef').map(i=>i.x).join('\n'),ca=by('calc').map(i=>'- '+i.x).join('\n'),rx=by('rx').map(i=>i.x).join('\n\n'),or=by('or').map(i=>i.x).join('\n');
  const after=(re,block)=>{const m=t.match(re);if(m){const p=m.index+m[0].length;t=t.slice(0,p)+'\n'+block+t.slice(p)}else t+=(t?'\n\n':'')+block};
  const before=(re,block)=>{const m=t.match(re);if(m)t=t.slice(0,m.index)+block+'\n\n'+t.slice(m.index);else t+=(t?'\n\n':'')+block};
  if(ef)after(/^O:[^\n]*$/m,ef);
  if(ca)before(/^A:[^\n]*$/m,'Escalas e cálculos:\n'+ca);
  if(rx)t+=(t?'\n\n':'')+'Prescrição:\n'+rx;
  if(or)t+=(t?'\n\n':'')+'Orientações:\n'+or;
  return t.trim();
}

/* Datas */
const DAY=864e5;
function parseD(s){if(!s)return null;const [y,mo,d]=s.split('-').map(Number);if(!y||!mo||!d)return null;return new Date(y,mo-1,d,12)}
function isoD(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function brD(d){return d.toLocaleDateString('pt-BR')}
function diffDays(a,b){return Math.round((b-a)/DAY)}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}
function sd(days){const w=Math.floor(days/7),d=days-w*7;return w+'s'+d+'d'}
function today(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate(),12)}
function tri(days){return days<14*7?'1º trimestre':days<28*7?'2º trimestre':'3º trimestre'}
// Discrepância aceitável DUM x USG conforme IG na USG (ACOG 2017)
function usgLimit(gaDays){const w=gaDays/7;return w<9?5:w<16?7:w<22?10:w<28?14:21}

function renderIG(m){
  const exDum=isoD(addDays(today(),-(20*7+3)));
  m.innerHTML=`<section class="panel">
    <div class="ph"><h2>Idade gestacional e DPP</h2><span class="code">Regra de Naegele · DUM + 280 d</span></div>
    <div class="card">
      <div class="grid2">
        <div class="field"><label for="ig-dum">DUM</label><input type="date" id="ig-dum" value="${exDum}"></div>
        <div class="field"><label for="ig-ref">Data de referência</label><input type="date" id="ig-ref" value="${isoD(today())}"></div>
      </div>
      <details id="ig-usgbox"><summary>Corrigir pela USG (opcional)</summary>
        <div class="grid2" style="margin-top:10px">
          <div class="field"><label for="ig-ud">Data da USG</label><input type="date" id="ig-ud"></div>
          <div class="field"><label>IG na USG</label><div class="inline"><input id="ig-uw" inputmode="numeric" placeholder="sem" aria-label="Semanas na USG"><input id="ig-udd" inputmode="numeric" placeholder="dias" aria-label="Dias na USG"></div></div>
        </div>
      </details>
      <p class="ex" id="ig-ex">Exemplo: substitua pela DUM da gestante</p>
    </div>
    ${resultBox('ig-r')}
    ${copyBtn()}
    <p class="note">Quando DUM e USG divergem além do limite para a IG da USG (≤8s6d: 5 d; 9–15s6d: 7 d; 16–21s6d: 10 d; 22–27s6d: 14 d; ≥28 s: 21 d), use a datação pela USG. A USG mais precoce é a mais confiável.</p>
  </section>`;
  let line='';
  const upd=()=>{
    const r=$('#ig-r'),dum=parseD($('#ig-dum').value),ref=parseD($('#ig-ref').value)||today();
    const ud=parseD($('#ig-ud').value),uw=num($('#ig-uw').value),udd=num($('#ig-udd').value)||0;
    let html='',parts=[];r.className='result';
    let dumGA=null,dumDPP=null,usgGA=null,usgDPP=null;
    if(dum){dumGA=diffDays(dum,ref);dumDPP=addDays(dum,280)}
    if(ud&&!isNaN(uw)){const gaU=uw*7+udd;usgGA=gaU+diffDays(ud,ref);usgDPP=addDays(ud,280-gaU)}
    if(dumGA==null&&usgGA==null){r.innerHTML='<div class="sub">Informe a DUM ou os dados da USG.</div>';line='';return}
    let useUSG=false,disc=null,lim=null;
    if(dumGA!=null&&usgGA!=null){disc=dumGA-usgGA;lim=usgLimit(uw*7+udd);useUSG=Math.abs(disc)>lim}
    else if(usgGA!=null)useUSG=true;
    const ga=useUSG?usgGA:dumGA,dpp=useUSG?usgDPP:dumDPP;
    if(ga<0||ga>44*7){r.className='result warn';r.innerHTML='<div class="sub">Datas fora da faixa de uma gestação (0 a 44 semanas). Confira os campos.</div>';line='';return}
    html+=`<div class="lbl">IG em ${brD(ref)} · ${useUSG?'pela USG':'pela DUM'}</div>`;
    html+=`<div class="big">${Math.floor(ga/7)}<small>sem</small> ${ga%7}<small>dias</small></div>`;
    html+=`<div class="sub">DPP <b>${brD(dpp)}</b> · ${tri(ga)}</div><div class="rows">`;
    if(dumGA!=null)html+=`<div><span>Pela DUM (${brD(dum)})</span><span>${sd(dumGA)} · DPP ${brD(dumDPP)}</span></div>`;
    if(usgGA!=null)html+=`<div><span>Pela USG (${brD(ud)}, ${uw}s${udd}d)</span><span>${sd(usgGA)} · DPP ${brD(usgDPP)}</span></div>`;
    if(disc!=null)html+=`<div><span>Diferença DUM − USG</span><span class="${useUSG?'warn':'ok'}">${disc>0?'+':''}${disc} d (limite ${lim} d)</span></div>`;
    html+='</div>';
    if(disc!=null)html+=`<div class="sub">${useUSG?'Diferença acima do limite: datar pela USG.':'Diferença dentro do limite: manter a DUM.'}</div>`;
    r.innerHTML=html;
    parts.push(`IG ${sd(ga)} em ${brD(ref)} (${useUSG?'por USG de '+brD(ud)+' com '+uw+'s'+udd+'d':'pela DUM'})`);
    if(dum)parts.push(`DUM ${brD(dum)}`);
    parts.push(`DPP ${brD(dpp)}`);
    line=parts.join(' | ');
  };
  m.querySelectorAll('input').forEach(i=>i.addEventListener('input',()=>{$('#ig-ex').hidden=true;upd()}));
  upd();bindCopy(()=>line);
}

function ckdepi(scr,age,fem){const k=fem?0.7:0.9,a=fem?-0.241:-0.302;return 142*Math.pow(Math.min(scr/k,1),a)*Math.pow(Math.max(scr/k,1),-1.2)*Math.pow(0.9938,age)*(fem?1.012:1)}
function renderTFG(m){

/* Insulina — DM2 na APS (NPH/Regular), conforme Caderno AB 36 e PCDT DM2 */
function nphTitrate(dose,gj,hypo){
  // retorna [nova dose, texto, classe]
  if(hypo||gj<70){const red=Math.max(4,Math.round(dose*0.1));return [Math.max(0,dose-red),`Hipoglicemia: reduzir ${red} UI (4 UI ou 10%, o que for maior). Investigar causa.`,'bad']}
  if(gj<80)return [Math.max(0,dose-2),'Jejum abaixo da meta: reduzir 2 UI.','warn'];
  if(gj<=130)return [dose,'Jejum na meta (80–130): manter a dose.','ok'];
  if(gj<=180)return [dose+2,'Jejum acima da meta: aumentar 2 UI e reavaliar em 3 dias.','warn'];
  return [dose+4,'Jejum > 180: aumentar 4 UI e reavaliar em 3 dias.','bad'];
}

        <li>Se necessário, Regular antes de 2–3 refeições (basal-bolus)</li>
        <li>Compartilhar com endocrinologia se basal-bolus, hipoglicemias recorrentes ou meta não atingida</li></ul></div>
    </div>
    <div class="node"><h3>Em toda reavaliação</h3><ul>
      <li>Adesão, técnica de aplicação, rodízio de locais, armazenamento da insulina</li>
      <li>Hipoglicemias: frequência, gravidade, horário (regra dos 15 na aba Insulina)</li>
      <li>Função renal (TFG) para ajuste de metformina, sulfonilureia e iSGLT2</li>
      <li>iSGLT2: orientar higiene genital (candidíase), hidratação, suspender em jejum prolongado, cirurgia ou doença aguda (risco de cetoacidose euglicêmica)</li></ul></div>

  </section>`;
}

/* Risco cardiovascular — Escore de Risco Global de Framingham (D'Agostino 2008), categorias SBC */
function framingham(fem,age,tc,hdl,sbp,trt,smk,dm){
  const L=Math.log;
  const s=fem?2.32888*L(age)+1.20904*L(tc)-0.70833*L(hdl)+(trt?2.82263:2.76157)*L(sbp)+0.52873*smk+0.69154*dm-26.1931
             :3.06117*L(age)+1.12370*L(tc)-0.93263*L(hdl)+(trt?1.99881:1.93303)*L(sbp)+0.65451*smk+0.57367*dm-23.9802;
  return 1-Math.pow(fem?0.95012:0.88936,Math.exp(s));
}

/* Rastreios por idade e sexo */
function rastreios(o){
  const {age,fem,colo,sexo,hist,gest,fumo,am,fhmama,fhcolo,frat}=o;const R=[];
  const add=(st,t,d,src,alt)=>R.push({st,t,d,src,alt});
  // Colo do útero
  if(colo){
    if(hist)add('no','Citopatológico (colo do útero)','Não indicado após histerectomia total por causa benigna.','INCA 2016');
    else if(age<25)add('no','Citopatológico (colo do útero)','Rastreio começa aos 25 anos.','INCA 2016');
    else if(age<=64)add(sexo?'yes':'maybe','Citopatológico (colo do útero)',sexo?'25 a 64 anos: 2 exames anuais; se ambos normais, a cada 3 anos.':'Indicado a quem já teve atividade sexual (25 a 64 anos).','INCA 2016','Teste de DNA-HPV (a cada 5 anos, 25–64 anos) sendo implantado no SUS desde 2024: confira se já está disponível no seu município.');
    else add('maybe','Citopatológico (colo do útero)','Acima de 64 anos: pode encerrar se tiver 2 exames negativos nos últimos 5 anos. Nunca rastreada: 2 exames com intervalo de 1 a 3 anos.','INCA 2016');
  }
  // Mama
  if(fem){
    if(age>=50&&age<=69)add('yes','Mamografia','50 a 69 anos: a cada 2 anos.','MS/INCA','SBM/CBR/FEBRASGO: anual dos 40 aos 74 anos. O MS anunciou em 2025 ampliação do acesso (40–49 sob demanda e até 74 anos): confira a nota técnica vigente.');
    else if(age>=40&&age<50)add('maybe','Mamografia','40 a 49 anos: fora da faixa do rastreio organizado do MS; decisão compartilhada.','MS/INCA','SBM/CBR/FEBRASGO recomendam anual a partir de 40 anos.');
    else if(age>69&&age<=74)add('maybe','Mamografia','70 a 74 anos: decisão compartilhada conforme saúde geral.','MS/INCA','Sociedades: manter até 74 anos ou mais se expectativa de vida > 7 anos.');
    else add('no','Mamografia',age<40?'Rastreio não indicado antes dos 40 anos sem risco elevado.':'Acima de 74 anos: individualizar.','MS/INCA');
    if(fhmama)add('maybe','Mama: risco elevado','História familiar importante (parente de 1º grau < 50 anos, câncer de mama bilateral ou masculino, ovário): rastreio anual a partir dos 35 anos e considerar encaminhamento para avaliação de risco.','INCA');
  }
  // Colorretal
  if(age>=50&&age<=75)add('yes','Câncer colorretal','50 a 75 anos: pesquisa de sangue oculto nas fezes (imunoquímico) anual, ou colonoscopia a cada 10 anos.','Caderno AB 29','USPSTF: começar aos 45 anos.');
  else if(age>=45&&age<50)add('maybe','Câncer colorretal','45 a 49 anos: USPSTF recomenda começar; no Brasil, a referência da APS é a partir dos 50.','USPSTF 2021');
  else if(age>75&&age<=85)add('maybe','Câncer colorretal','76 a 85 anos: individualizar conforme rastreios prévios e saúde geral.','USPSTF 2021');
  else add('no','Câncer colorretal','Fora da faixa de rastreio.','Caderno AB 29');
  if(fhcolo)add('maybe','Colorretal: risco elevado','Parente de 1º grau com câncer colorretal ou adenoma avançado: colonoscopia a partir dos 40 anos (ou 10 anos antes do caso mais jovem), a cada 5 anos.','Consenso');
  // Próstata
  if(!fem&&age>=50&&age<=69)add('maybe','Próstata (PSA)','Rastreio populacional não recomendado pelo MS/INCA. Se a pessoa pedir, fazer decisão compartilhada sobre riscos e benefícios.','MS/INCA','SBU: oferecer a partir de 50 anos (45 se negro ou com história familiar).');
  // Osteoporose
  if(fem&&age>=65)add('yes','Densitometria óssea','Mulheres com 65 anos ou mais.','USPSTF / consensos');
  else if(fem&&age>=50&&frat)add('maybe','Densitometria óssea','Pós-menopausa < 65 anos com fatores de risco (baixo peso, fratura prévia, corticoide, tabagismo, história familiar): considerar, idealmente com FRAX.','USPSTF / consensos');
  else if(!fem&&age>=70)add('maybe','Densitometria óssea','Homens com 70 anos ou mais: evidência limitada; considerar se fatores de risco.','Consensos');
  // Pulmão
  if(fumo&&age>=50&&age<=80&&am>=20)add('maybe','Câncer de pulmão','50 a 80 anos com ≥ 20 anos-maço, fumante atual ou parou há < 15 anos: TC de baixa dose anual (USPSTF). Não é programa do SUS; oferecer cessação do tabagismo.','USPSTF 2021');
  // AAA
  if(!fem&&fumo&&age>=65&&age<=75)add('maybe','Aneurisma de aorta abdominal','Homem 65 a 75 anos que já fumou: USG de abdome uma vez.','USPSTF 2019');
  // Cardiometabólico
  if(age>=18)add('yes','Pressão arterial','Medir em toda consulta; ao menos anual a partir de 18 anos (a cada 2 anos se < 120x80 e sem fatores de risco).','Caderno AB 37');
  if(age>=35&&age<=70)add('maybe','Diabetes','Glicemia de jejum/HbA1c se sobrepeso ou obesidade, HAS, história familiar ou outros fatores de risco; repetir a cada 3 anos se normal.','MS / USPSTF');
  if((!fem&&age>=35)||(fem&&age>=45))add('yes','Dislipidemia','Perfil lipídico: homens ≥ 35 e mulheres ≥ 45 anos (mais cedo se risco cardiovascular aumentado).','Caderno AB 29');
  // Sorologias
  add('yes','HIV','Ao menos uma vez na vida; repetir após exposição de risco e periodicamente (a cada 3–6 meses) em populações-chave e PrEP.','MS');
  add('yes','Sífilis','Pessoas com vida sexual ativa conforme risco; gestantes no 1º e 3º trimestres e no parto.','MS');
  add('yes','Hepatite B','Testar ao menos uma vez (HBsAg); vacinar se não imune.','PCDT Hepatite B');
  add(age>=40?'yes':'maybe','Hepatite C',age>=40?'Pessoas com 40 anos ou mais: testar ao menos uma vez.':'Testar se fatores de risco (uso de drogas, transfusão antes de 1993, HIV, diálise, tatuagem em locais sem controle, populações-chave).','PCDT Hepatite C');
  if(gest)add('yes','Gestante','TR de HIV, sífilis, hepatites B e C no 1º trimestre (ou 1ª consulta), repetir HIV e sífilis no 3º trimestre e no parto; toxoplasmose, glicemia, urocultura conforme pré-natal.','MS');
  return R;
}

const drugsIn=t=>{const tt=norm(t);return DRUGS.filter(d=>new RegExp(norm(d[1])).test(tt))};
function drugCard(d,o){
  const [n,,lim,drc,ge,la,be]=d;const rows=[];const all=!o.gest&&!o.lact&&!o.idoso;
  const low=o.tfg>0&&lim>0&&o.tfg<lim;
  rows.push(['DRC',drc,low]);
  if(all||o.gest)rows.push(['Gestação',ge,/contraindicad|não usar|evitar|suspender/i.test(ge)]);
  if(all||o.lact)rows.push(['Lactação',la,/contraindicad|evitar|suspender/i.test(la)]);
  if((all||o.idoso)&&be)rows.push(['Idoso (Beers)',be,/^evitar/i.test(be)]);
  const flag=rows.some(r=>r[2]);
  return `<div class="node" style="${flag?'border-color:var(--warn)':''}"><h3>${esc(n)}</h3><div class="rows">${rows.map(([k,v,w])=>`<div><span>${k}</span><span style="text-align:right;${w?'color:var(--warn);font-weight:600':''}">${esc(v)}</span></div>`).join('')}</div></div>`;
}

<button class="upd" id="upd" hidden>Nova versão do Kit: toque para atualizar</button>
<script>
/* PWA: funciona offline e se atualiza sozinho quando há versão nova */
if('serviceWorker' in navigator){
  let refreshing=false;
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      const check=()=>reg.update().catch(()=>{});
      setInterval(check,30*60*1000);
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});
    }).catch(()=>{});
  });
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing)return;
    const b=document.getElementById('upd');
    // Se a pessoa ainda não interagiu, recarrega direto; senão oferece o botão
    if(!window.__touched){refreshing=true;location.reload();return}
    b.hidden=false;b.onclick=()=>{refreshing=true;location.reload()};
  });
  ['input','pointerdown','keydown'].forEach(e=>addEventListener(e,()=>{window.__touched=true},{once:true,capture:true}));
}
</script>
