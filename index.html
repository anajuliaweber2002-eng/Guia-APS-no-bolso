<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
.upd{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;border:0;border-radius:999px;background:var(--accent);color:var(--accent-fg);font:600 .9rem var(--f-ui);padding:10px 18px;box-shadow:0 4px 14px rgb(0 0 0/.25);cursor:pointer}</style>

<body>
<style>
/* Layout: uma coluna estreita tipo ficha de prontuário; cabeçalho fixo com abas SOAP/Calculadoras e trilho de chips */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --sunk:#e8eeec; --line:#cfdad7;
  --fg:#15211f; --muted:#52625f; --accent:#0d6b60; --accent-fg:#ffffff; --accent-soft:#d5ebe7;
  --ok:#1f7a3a; --ok-soft:#dff1e4; --warn:#93600a; --warn-soft:#f8ecd3; --bad:#a3262a; --bad-soft:#f7dede;
  --f-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#172120; --sunk:#1e2a28; --line:#2e3d3a;
  --fg:#e4ecea; --muted:#9aaba7; --accent:#4fc1b1; --accent-fg:#06211d; --accent-soft:#18403a;
  --ok:#6fcf8a; --ok-soft:#163423; --warn:#e6b45a; --warn-soft:#3a2c12; --bad:#f08a8a; --bad-soft:#3d1a1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#172120; --sunk:#1e2a28; --line:#2e3d3a;
  --fg:#e4ecea; --muted:#9aaba7; --accent:#4fc1b1; --accent-fg:#06211d; --accent-soft:#18403a;
  --ok:#6fcf8a; --ok-soft:#163423; --warn:#e6b45a; --warn-soft:#3a2c12; --bad:#f08a8a; --bad-soft:#3d1a1b; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px 0;display:grid;gap:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.rx{margin:0;white-space:pre-wrap;font:13px/1.5 var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto}
.rxcard h3{margin:0;font-size:.95rem}
.rec{font-size:.82rem;background:var(--accent-soft);color:var(--fg);border-radius:8px;padding:8px 12px}
h1{margin:0;font-size:1.15rem;letter-spacing:-.01em}
h1 small{font-weight:500;color:var(--muted);font-size:.8rem;margin-left:6px}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg{flex:1 1 auto;max-width:480px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:600 .8rem var(--f-ui);padding:6px 7px;white-space:nowrap;border-radius:999px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 .85rem var(--f-ui);padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}

main .wrap{padding-block:16px 48px;display:grid;gap:16px}
.panel{display:grid;gap:14px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
h2{margin:0;font-size:1.05rem;text-wrap:balance}
.code{font:600 .72rem var(--f-mono);color:var(--muted);letter-spacing:.04em}
.note{color:var(--muted);font-size:.82rem;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}

textarea.soap{width:100%;min-height:60vh;resize:vertical;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--fg);font:13.5px/1.55 var(--f-mono);padding:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 .88rem var(--f-ui);padding:9px 14px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.small{padding:6px 10px;font-size:.8rem}
.sticky-bar{position:sticky;bottom:0;background:var(--bg);padding-block:8px calc(8px + env(safe-area-inset-bottom,0px))}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field label,.lbl{font-size:.74rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input,select{width:100%;font:500 1rem var(--f-ui);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
.inline{display:flex;gap:6px}
.inline input{flex:1}
.sexo{display:flex;gap:6px}
.sexo label{flex:1}

.result{border-radius:var(--r);padding:14px;display:grid;gap:6px;background:var(--sunk)}
.result .big{font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.result .big small{font-size:.9rem;font-weight:600;color:var(--muted);margin-left:4px}
.result .sub{font-size:.9rem}
.pill{display:inline-block;font:700 .78rem var(--f-ui);padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid currentColor}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.result.ok{background:var(--ok-soft)} .result.warn{background:var(--warn-soft)} .result.bad{background:var(--bad-soft)}
.result.ok,.result.warn,.result.bad{color:var(--fg)}
.rows{display:grid;gap:4px;font-size:.9rem;font-variant-numeric:tabular-nums}
.rows div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-block:3px}
.rows div span:first-child{color:var(--muted)}
.alert{border-left:4px solid var(--bad);background:var(--bad-soft);padding:10px 12px;border-radius:6px;font-size:.9rem}
.ex{font:600 .7rem var(--f-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--warn)}

.q{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;margin:0;display:grid;gap:8px}
.q legend{padding:0;font-size:.92rem;font-weight:500;float:left;width:100%}
.q legend b{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px;clear:both}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:block;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:.8rem;line-height:1.25;background:var(--bg);height:100%}
.opt span i{font-style:normal;font-family:var(--f-mono);color:var(--muted);margin-right:4px}
.opt input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.opt input:checked+span i{color:inherit}
.soft .opt input:checked+span{background:var(--accent-soft);color:var(--fg);border-color:var(--accent)}
.soft .opt span{padding-left:34px;position:relative}
.soft .opt span::before{content:'';position:absolute;left:10px;top:9px;width:14px;height:14px;border:2px solid var(--muted);border-radius:4px}
.soft .opt input:checked+span::before{background:var(--accent);border-color:var(--accent)}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.scale{width:100%;border-collapse:collapse;font-size:.84rem;font-variant-numeric:tabular-nums}
.scale td{padding:5px 6px;border-top:1px solid var(--line);vertical-align:top}
.scale td:first-child{white-space:nowrap;font-weight:600;width:1%}
.scale tr.on td{background:var(--accent-soft)}
details{font-size:.86rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:.88rem;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
footer{color:var(--muted);font-size:.78rem}
.flow{display:grid;gap:0;counter-reset:st}
.node{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;font-size:.9rem}
.node h3{margin:0;font-size:.95rem}
.node.step h3::before{counter-increment:st;content:counter(st);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:.75rem;margin-right:8px;vertical-align:1px}
.node.dec{border-style:dashed;border-color:var(--warn);background:var(--warn-soft)}
.node.dec h3{color:var(--fg)}
.node.goal{background:var(--ok-soft);border-color:var(--ok)}
.node ul{margin:0;padding-left:18px;display:grid;gap:3px}
.arrow{justify-self:center;width:2px;height:22px;background:var(--line);position:relative}
.arrow::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--line);border-bottom:0}
.arrow:has(span){height:34px}
.arrow span{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:min(280px,calc(50vw - 36px));font:600 .72rem/1.2 var(--f-ui);color:var(--muted)}
.branch{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.branch .node{font-size:.85rem}
.tag{font:700 .68rem var(--f-ui);text-transform:uppercase;letter-spacing:.06em}
.out{font-weight:600}
.sec-h{margin:6px 0 0;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
@media print{@page{margin:8mm}body{background:#fff}body::before,header,.toast{display:none!important}main .wrap>section>*:not(#sheet){display:none!important}#sheet{border:0!important;padding:0!important}main .wrap{padding:0!important;max-width:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <div class="wrap">
    <div class="top">
      <h1>Kit APS <small>bolso</small></h1>
      <div class="seg" role="tablist" aria-label="Seção">

  </div>
</header>

<main>
  <div class="wrap" id="main"></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1600)}
function copy(text,ta){
  const done=()=>toast('Copiado');
  const fallback=()=>{const el=ta||Object.assign(document.createElement('textarea'),{value:text});if(!ta){el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el)}el.focus();el.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}if(!ta)el.remove();toast(ok?'Copiado':'Texto selecionado: copie manualmente')};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fallback)}else fallback();
}

function parseList(text){

  for(const l of lines){
    if(/^\s*(uso (oral|nasal|t[oó]pico|intramuscular|transd[eé]rmico|inalat[oó]rio|subcut[aâ]neo|retal|vaginal|externo)|receitu|prescri[cç][aã]o:?$)/i.test(l))continue;
    if(isInstr(l)&&cur){cur.ins+=' '+l.trim();continue}

  return rows.length;
}

    </div>
    <div id="es-rows" style="display:grid;gap:10px"></div>
    <div class="bar"><button class="btn" id="es-add">+ Adicionar remédio</button><button class="btn" id="es-clr">Limpar tudo</button></div>
    <fieldset class="q"><legend>Cuidados (aparecem com figura)</legend><div class="opts" style="grid-template-columns:1fr">
      ${CUID.map(([k,t])=>`<label class="opt"><input type="checkbox" id="es-c-${k}" data-k="${k}"${ESQ.cuid.has(k)?' checked':''}><span>${esc(t)}</span></label>`).join('')}</div>
      <div class="field" style="clear:both"><label for="es-extra">Outros cuidados (um por linha)</label><textarea id="es-extra" class="soap" style="min-height:70px">${esc(ESQ.extra)}</textarea></div>
      <div class="grid2"><div class="field"><label for="es-ret">Retorno</label><input type="date" id="es-ret" value="${ESQ.retorno}"></div>
      <div class="field"><label for="es-uni">Unidade / telefone</label><input id="es-uni" value="${esc(ESQ.unidade)}" placeholder="UBS ___ · tel."></div></div>
    </fieldset>
    <div class="lbl">Folha para o paciente</div>
    <div id="sheet" class="card" style="padding:8px;background:#fff"></div>
    <div class="bar sticky-bar"><button class="btn primary" id="es-print">Imprimir</button><button class="btn" id="es-img">Baixar imagem</button></div>
    <div id="es-out" hidden class="card"><p class="note">Se o download não começar, toque e segure a imagem para salvar ou compartilhar (WhatsApp, impressora).</p><img id="es-png" alt="Esquema de remédios do paciente" style="width:100%;border:1px solid var(--line);border-radius:8px"></div>
    <p class="note">Se o botão Imprimir não abrir a janela de impressão, use "Baixar imagem". Os dados do paciente ficam só nesta tela e somem ao fechar a página.</p>
  </section>`;
  const rowsEl=$('#es-rows');
  const drawSheet=()=>{$('#sheet').innerHTML=sheetSVG().replace('<svg ','<svg style="width:100%;height:auto;display:block" ');$('#es-out').hidden=true};
  const drawRows=()=>{
    rowsEl.innerHTML=ESQ.rows.map((r,i)=>`<div class="card" style="gap:8px;border-left:8px solid ${r.cor}">
      <div class="inline"><input data-i="${i}" data-f="nome" value="${esc(r.nome)}" aria-label="Remédio e dose" placeholder="Remédio e dose"><button class="btn small" data-del="${i}" aria-label="Remover">✕</button></div>
      <div class="grid2" style="grid-template-columns:repeat(3,1fr)">${PER.map(([k,l])=>`<div class="field"><label for="es-${i}-${k}">${l}</label><input id="es-${i}-${k}" data-i="${i}" data-f="${k}" value="${esc(r[k])}" inputmode="decimal" placeholder="—"></div>`).join('')}</div>
      <div class="grid2"><div class="field"><label for="es-${i}-forma">Forma</label><select id="es-${i}-forma" data-i="${i}" data-f="forma">${fopt(r.forma)}</select></div>
      <div class="field"><label for="es-${i}-obs">Observação</label><input id="es-${i}-obs" data-i="${i}" data-f="obs" value="${esc(r.obs)}" placeholder="em jejum, com comida, só se dor"></div></div>
      <div class="bar">${COLORS.map(c=>`<button class="btn small" data-i="${i}" data-cor="${c}" aria-label="Cor" style="width:28px;height:28px;padding:0;border-radius:50%;background:${c};border:${c===r.cor?'3px solid var(--fg)':'1px solid var(--line)'}"></button>`).join('')}</div>
    </div>`).join('')||'<p class="note">Nenhum remédio ainda. Cole a lista acima ou toque em "Adicionar remédio".</p>';
    rowsEl.querySelectorAll('[data-f]').forEach(el=>el.addEventListener('input',()=>{ESQ.rows[+el.dataset.i][el.dataset.f]=el.value;drawSheet()}));
    rowsEl.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ESQ.rows.splice(+b.dataset.del,1);drawRows()});
    rowsEl.querySelectorAll('[data-cor]').forEach(b=>b.onclick=()=>{ESQ.rows[+b.dataset.i].cor=b.dataset.cor;drawRows()});
    drawSheet();
  };
  const txt=$('#es-txt');txt.value=ESQ.txt||'';let deb;
  txt.addEventListener('input',()=>{ESQ.txt=txt.value;clearTimeout(deb);deb=setTimeout(()=>{if(!txt.value.trim())return;const n=setFromText(txt.value);$('#es-exn').hidden=true;
    if($('#es-nome').value==='Maria (exemplo)')$('#es-nome').value='';
    m.querySelectorAll('[id^="es-c-"]').forEach(c=>c.checked=ESQ.cuid.has(c.dataset.k));
    drawRows();if(n)toast(n+' remédio(s) no esquema');else toast('Não encontrei remédios no texto')},450)});
  $('#es-add').onclick=()=>{if(ESQ.ex){ESQ.rows=[];ESQ.ex=false;ESQ.nome=''}ESQ.rows.push({nome:'',forma:'comp',m:'',t:'',n:'',obs:'',cor:COLORS[ESQ.rows.length%COLORS.length]});renderESQ(m)};
  const clr=$('#es-clr');clr.onclick=()=>{if(!clr.dataset.c){clr.dataset.c=1;clr.textContent='Toque de novo para limpar';setTimeout(()=>{if(clr.isConnected){clr.textContent='Limpar tudo';delete clr.dataset.c}},3000);return}
    ESQ={ex:false,nome:'',data:isoD(today()),retorno:'',unidade:ESQ.unidade,extra:'',cuid:new Set(['agua','todo','trazer']),rows:[]};renderESQ(m)};
  $('#es-nome').oninput=e=>{ESQ.nome=e.target.value;drawSheet()};
  $('#es-data').oninput=e=>{ESQ.data=e.target.value;drawSheet()};
  $('#es-ret').oninput=e=>{ESQ.retorno=e.target.value;drawSheet()};
  $('#es-uni').oninput=e=>{ESQ.unidade=e.target.value;store.set('kitaps:unidade',e.target.value);drawSheet()};
  $('#es-extra').oninput=e=>{ESQ.extra=e.target.value;drawSheet()};
  m.querySelectorAll('[id^="es-c-"]').forEach(c=>c.onchange=()=>{c.checked?ESQ.cuid.add(c.dataset.k):ESQ.cuid.delete(c.dataset.k);drawSheet()});
  $('#es-print').onclick=printSheet;
  $('#es-img').onclick=()=>svgToPng(sheetSVG(),$('#es-png'),$('#es-out'),'esquema-remedios'+(ESQ.nome?'-'+ESQ.nome.trim().split(/\s+/)[0].toLowerCase():'')+'.png');
  drawRows();
}
/* ---------- MEV: orientações de estilo de vida (linguagem para o paciente) ---------- */
const ALIM='Faça da comida de verdade a base: arroz, feijão, legumes, verduras, frutas, ovos, carnes e peixes. Evite ultraprocessados (salgadinho, biscoito recheado, embutidos, refrigerante, macarrão instantâneo).';
const ATIV='Faça atividade física: pelo menos 150 minutos por semana (ex.: 30 minutos de caminhada, 5 dias por semana), e exercícios de força 2 vezes por semana. Qualquer movimento já ajuda: comece aos poucos.';
const FUMO='Pare de fumar. A unidade de saúde oferece grupo e remédios gratuitos para ajudar.';
const ALC='Evite bebida alcoólica.';
const M={
mev_has:{s:'Hipertensão',t:'Pressão alta',pr:'Orientado(a) sobre MEV para HAS: redução de sal (< 5 g/dia), alimentação baseada no Guia Alimentar, atividade física ≥ 150 min/sem, controle de peso, cessação do tabagismo, redução do álcool, adesão e automonitorização da PA.',items:[
 'Use pouco sal: no máximo 1 colher de chá rasa por dia para toda a comida. Tempere com alho, cebola, cheiro-verde, limão e ervas.',

mev_dm:{s:'Diabetes',t:'Diabetes',pr:'Orientado(a) sobre MEV para DM: alimentação baseada no Guia Alimentar com redução de açúcares e ultraprocessados, regularidade nas refeições, atividade física ≥ 150 min/sem, controle de peso, cessação do tabagismo, cuidado diário com os pés e reconhecimento de hipoglicemia.',items:[

mev_obes:{s:'Obesidade',t:'Sobrepeso e obesidade',pr:'Orientado(a) sobre MEV para excesso de peso: alimentação baseada no Guia Alimentar, redução de ultraprocessados e bebidas açucaradas, atividade física progressiva até 150–300 min/sem, sono adequado, meta inicial de perda de 5–10% do peso.',items:[
 'A meta inicial é perder 5 a 10% do peso. Isso já traz benefício para a saúde.',ALIM,

mev_lip:{s:'Colesterol',t:'Colesterol alto e risco do coração',pr:'Orientado(a) sobre MEV para dislipidemia/risco cardiovascular: redução de gorduras saturadas e trans e de ultraprocessados, aumento de fibras, atividade física ≥ 150 min/sem, controle de peso, cessação do tabagismo, moderação do álcool.',items:[

mev_drc:{s:'Rins',t:'Doença renal crônica',pr:'Orientado(a) sobre MEV para DRC: restrição de sal (< 5 g/dia), ingestão proteica adequada ao estágio, evitar anti-inflamatórios e nefrotóxicos, controle de PA e glicemia, atividade física, cessação do tabagismo, hidratação conforme orientação.',items:[
 'Use pouco sal e evite temperos prontos, embutidos e enlatados.',
 'Não exagere nas carnes: coma porções moderadas, conforme orientação da equipe.',

mev_icc:{s:'Coração (ICC)',t:'Insuficiência cardíaca',pr:'Orientado(a) sobre MEV para IC: restrição de sal, pesagem diária com sinais de alerta, atividade física leve a moderada conforme tolerância, evitar AINE, cessação do tabagismo e do álcool, adesão às medicações, vacinação.',items:[
 'Use pouco sal e evite temperos prontos, embutidos, enlatados e salgadinhos.',
 'Pese-se todo dia, de manhã, depois de urinar e antes do café. Se ganhar mais de 2 kg em 3 dias, procure a unidade.',
 'Procure a unidade se tiver mais falta de ar, inchaço nas pernas ou barriga, ou precisar dormir com mais travesseiros.',
 'Faça caminhadas leves e aumente aos poucos, sempre no seu ritmo. Pare se tiver falta de ar forte ou dor no peito.',

 'Não fume e não beba bebida alcoólica.',
 'Tome os remédios todos os dias, mesmo se estiver bem.',
 'Tome as vacinas da gripe, da covid e da pneumonia.']},
mev_gest:{s:'Gestação',t:'Gestação saudável',pr:'Orientada sobre MEV na gestação: alimentação baseada no Guia Alimentar, ganho de peso adequado ao IMC pré-gestacional, atividade física moderada, suspensão de álcool, tabaco e outras drogas, suplementação, sinais de alarme.',items:[
 ALIM,
 'Coma de 3 em 3 horas, em pequenas porções, se tiver enjoo. Biscoito de água e sal ao acordar ajuda.',
 'Não beba nenhuma bebida alcoólica, não fume e não use drogas durante a gravidez.',

mev_cri:{s:'Criança',t:'Criança saudável',pr:'Orientados responsáveis sobre alimentação conforme Guia Alimentar para crianças < 2 anos (AME até 6 meses, alimentação complementar sem açúcar e ultraprocessados), sono seguro, tempo de tela, prevenção de acidentes e vacinação.',items:[
 'Até 6 meses: só leite materno, sem água, chá ou outros leites. Mamar até 2 anos ou mais.',

 'Não dê açúcar, mel, refrigerante, suco de caixinha, biscoito recheado ou salgadinho antes dos 2 anos.',

 'Evite telas (TV, celular) antes dos 2 anos e limite a 1 hora por dia dos 2 aos 5 anos.',

 'Previna acidentes: remédios e produtos de limpeza longe do alcance, cadeirinha no carro, tela nas janelas.',
 'Mantenha as vacinas em dia e traga a Caderneta da Criança em toda consulta.']},
mev_dep:{s:'Depressão',t:'Depressão',pr:'Orientado(a) sobre MEV e autocuidado em saúde mental: atividade física regular, rotina de sono, ativação comportamental, rede de apoio, evitar álcool e outras drogas, adesão ao tratamento e plano de segurança.',items:[
 'Mantenha uma rotina: horário para acordar, comer e dormir.',

 'Converse com pessoas de confiança e participe de grupos da unidade ou da comunidade.',
 'Evite bebida alcoólica e outras drogas: pioram a depressão e atrapalham o remédio.',

mev_ans:{s:'Ansiedade',t:'Ansiedade',pr:'Orientado(a) sobre MEV para ansiedade: técnicas de respiração e relaxamento, atividade física regular, higiene do sono, redução de cafeína e álcool, rede de apoio, psicoterapia.',items:[
 'Quando a ansiedade apertar, respire devagar: puxe o ar pelo nariz contando até 4, segure até 4 e solte pela boca contando até 6. Repita por 2 a 5 minutos.',

 'Diminua café, chá preto, chimarrão, refrigerante de cola e energético, principalmente à tarde e à noite.',

mev_sono:{s:'Insônia',t:'Insônia (higiene do sono)',pr:'Orientado(a) sobre higiene do sono: horários regulares, restrição de cochilos, cafeína, álcool e telas à noite, ambiente adequado, uso da cama só para dormir.',items:[
 'Deite e levante sempre no mesmo horário, inclusive no fim de semana.',
 'Evite cochilar de dia. Se precisar, no máximo 20 minutos antes das 15 h.',

mev_tab:{s:'Tabagismo',t:'Parar de fumar',pr:'Realizada abordagem breve para cessação do tabagismo; orientado(a) sobre estratégias comportamentais, manejo da fissura e oferta do tratamento na unidade.',items:[
 'Marque uma data para parar de fumar, de preferência nas próximas 2 semanas.',

mev_alc:{s:'Álcool',t:'Uso de álcool',pr:'Realizada intervenção breve para uso de álcool (AUDIT __); orientado(a) sobre redução de danos, metas de consumo e sinais de abstinência.',items:[
 'Combine uma meta: parar ou diminuir. Se for diminuir, defina quantos dias por semana e quantas doses.',
 'Fique pelo menos 2 dias por semana sem beber.',
 'Beba devagar, alterne com água e coma antes e durante.',

mev_hpb:{s:'Próstata',t:'Próstata aumentada (HPB)',pr:'Orientado sobre medidas comportamentais para LUTS/HPB: redução de líquidos à noite, cafeína e álcool, micção dupla, revisão de medicações e treinamento vesical.',items:[
 'Beba menos líquido nas 2 horas antes de dormir, mas mantenha a água durante o dia.',

 'Urine antes de deitar e antes de sair de casa.',
 'Depois de urinar, espere um pouco e tente de novo (micção dupla).',
 'Evite remédios para gripe e alergia sem orientação: podem prender a urina.',
 'Procure a unidade se não conseguir urinar, tiver sangue na urina ou ardência com febre.']},
mev_ivas:{s:'Gripe/resfriado',t:'Gripe e resfriado',pr:'Orientado(a) sobre cuidados domiciliares em IVAS: hidratação, lavagem nasal, repouso, sintomáticos, etiqueta respiratória e sinais de alarme.',items:[
 'Beba bastante água, sucos e sopas.',

 'Descanse e se alimente bem.',

 'Use máscara perto de idosos, bebês, gestantes e pessoas doentes.',

mev_diar:{s:'Diarreia',t:'Diarreia e vômitos',pr:'Orientado(a) sobre Plano A: SRO após cada evacuação/vômito, manutenção da alimentação, higiene das mãos e da água, sinais de alarme.',items:[
 'Tome o soro de reidratação oral depois de cada evacuação líquida ou vômito, em pequenos goles.',

 'Evite refrigerante, suco de caixinha, doces e frituras enquanto durar a diarreia.',

};
function mevSVG(c,items,nome){
  const W=800,F='Arial, Helvetica, sans-serif';let y=0,o='';
  o+=`<text x="30" y="58" font-family="${F}" font-size="36" font-weight="700" fill="#111">${X(c.t)}</text>`;
  o+=`<text x="30" y="92" font-family="${F}" font-size="22" fill="#333">Orientações para cuidar da sua saúde${nome?' · '+X(nome):''}</text>`;
  y=116;
  items.forEach(t=>{const L=wrapT(t,52),hh=L.length*30+26;
    o+=`<rect x="20" y="${y}" width="760" height="${hh}" rx="10" fill="#fff" stroke="#adb5bd" stroke-width="2"/><circle cx="46" cy="${y+28}" r="9" fill="#0d6b60"/>`;
    L.forEach((l,j)=>o+=`<text x="70" y="${y+36+j*30}" font-family="${F}" font-size="23" fill="#111">${X(l)}</text>`);
    y+=hh+10});
  const u=ESQ.unidade||store.get('kitaps:unidade')||'';
  if(u){o+=`<text x="30" y="${y+28}" font-family="${F}" font-size="20" fill="#333">${X(u)}</text>`;y+=40}
  y+=16;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${y}" width="${W}" height="${y}"><rect width="${W}" height="${y}" fill="#fff"/>${o}</svg>`;
}
function mevText(c){return c.t+'\n'+c.items.map(i=>'• '+i).join('\n')}
function renderMEV(m,id){
  const c=M[id];

/* Datas */
const DAY=864e5;
function parseD(s){if(!s)return null;const [y,mo,d]=s.split('-').map(Number);if(!y||!mo||!d)return null;return new Date(y,mo-1,d,12)}
function isoD(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function brD(d){return d.toLocaleDateString('pt-BR')}
function diffDays(a,b){return Math.round((b-a)/DAY)}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}
function sd(days){const w=Math.floor(days/7),d=days-w*7;return w+'s'+d+'d'}
function today(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate(),12)}
function tri(days){return days<14*7?'1º trimestre':days<28*7?'2º trimestre':'3º trimestre'}
// Discrepância aceitável DUM x USG conforme IG na USG (ACOG 2017)
function usgLimit(gaDays){const w=gaDays/7;return w<9?5:w<16?7:w<22?10:w<28?14:21}

function renderIG(m){
  const exDum=isoD(addDays(today(),-(20*7+3)));
  m.innerHTML=`<section class="panel">
    <div class="ph"><h2>Idade gestacional e DPP</h2><span class="code">Regra de Naegele · DUM + 280 d</span></div>
    <div class="card">
      <div class="grid2">
        <div class="field"><label for="ig-dum">DUM</label><input type="date" id="ig-dum" value="${exDum}"></div>
        <div class="field"><label for="ig-ref">Data de referência</label><input type="date" id="ig-ref" value="${isoD(today())}"></div>
      </div>
      <details id="ig-usgbox"><summary>Corrigir pela USG (opcional)</summary>
        <div class="grid2" style="margin-top:10px">
          <div class="field"><label for="ig-ud">Data da USG</label><input type="date" id="ig-ud"></div>
          <div class="field"><label>IG na USG</label><div class="inline"><input id="ig-uw" inputmode="numeric" placeholder="sem" aria-label="Semanas na USG"><input id="ig-udd" inputmode="numeric" placeholder="dias" aria-label="Dias na USG"></div></div>
        </div>
      </details>
      <p class="ex" id="ig-ex">Exemplo: substitua pela DUM da gestante</p>
    </div>
    ${resultBox('ig-r')}
    ${copyBtn()}
    <p class="note">Quando DUM e USG divergem além do limite para a IG da USG (≤8s6d: 5 d; 9–15s6d: 7 d; 16–21s6d: 10 d; 22–27s6d: 14 d; ≥28 s: 21 d), use a datação pela USG. A USG mais precoce é a mais confiável.</p>
  </section>`;
  let line='';
  const upd=()=>{
    const r=$('#ig-r'),dum=parseD($('#ig-dum').value),ref=parseD($('#ig-ref').value)||today();
    const ud=parseD($('#ig-ud').value),uw=num($('#ig-uw').value),udd=num($('#ig-udd').value)||0;
    let html='',parts=[];r.className='result';
    let dumGA=null,dumDPP=null,usgGA=null,usgDPP=null;
    if(dum){dumGA=diffDays(dum,ref);dumDPP=addDays(dum,280)}
    if(ud&&!isNaN(uw)){const gaU=uw*7+udd;usgGA=gaU+diffDays(ud,ref);usgDPP=addDays(ud,280-gaU)}
    if(dumGA==null&&usgGA==null){r.innerHTML='<div class="sub">Informe a DUM ou os dados da USG.</div>';line='';return}
    let useUSG=false,disc=null,lim=null;
    if(dumGA!=null&&usgGA!=null){disc=dumGA-usgGA;lim=usgLimit(uw*7+udd);useUSG=Math.abs(disc)>lim}
    else if(usgGA!=null)useUSG=true;
    const ga=useUSG?usgGA:dumGA,dpp=useUSG?usgDPP:dumDPP;
    if(ga<0||ga>44*7){r.className='result warn';r.innerHTML='<div class="sub">Datas fora da faixa de uma gestação (0 a 44 semanas). Confira os campos.</div>';line='';return}
    html+=`<div class="lbl">IG em ${brD(ref)} · ${useUSG?'pela USG':'pela DUM'}</div>`;
    html+=`<div class="big">${Math.floor(ga/7)}<small>sem</small> ${ga%7}<small>dias</small></div>`;
    html+=`<div class="sub">DPP <b>${brD(dpp)}</b> · ${tri(ga)}</div><div class="rows">`;
    if(dumGA!=null)html+=`<div><span>Pela DUM (${brD(dum)})</span><span>${sd(dumGA)} · DPP ${brD(dumDPP)}</span></div>`;
    if(usgGA!=null)html+=`<div><span>Pela USG (${brD(ud)}, ${uw}s${udd}d)</span><span>${sd(usgGA)} · DPP ${brD(usgDPP)}</span></div>`;
    if(disc!=null)html+=`<div><span>Diferença DUM − USG</span><span class="${useUSG?'warn':'ok'}">${disc>0?'+':''}${disc} d (limite ${lim} d)</span></div>`;
    html+='</div>';
    if(disc!=null)html+=`<div class="sub">${useUSG?'Diferença acima do limite: datar pela USG.':'Diferença dentro do limite: manter a DUM.'}</div>`;
    r.innerHTML=html;
    parts.push(`IG ${sd(ga)} em ${brD(ref)} (${useUSG?'por USG de '+brD(ud)+' com '+uw+'s'+udd+'d':'pela DUM'})`);
    if(dum)parts.push(`DUM ${brD(dum)}`);
    parts.push(`DPP ${brD(dpp)}`);
    line=parts.join(' | ');
  };
  m.querySelectorAll('input').forEach(i=>i.addEventListener('input',()=>{$('#ig-ex').hidden=true;upd()}));
  upd();bindCopy(()=>line);
}

function ckdepi(scr,age,fem){const k=fem?0.7:0.9,a=fem?-0.241:-0.302;return 142*Math.pow(Math.min(scr/k,1),a)*Math.pow(Math.max(scr/k,1),-1.2)*Math.pow(0.9938,age)*(fem?1.012:1)}

/* Insulina — DM2 na APS (NPH/Regular), conforme Caderno AB 36 e PCDT DM2 */
function nphTitrate(dose,gj,hypo){
  // retorna [nova dose, texto, classe]
  if(hypo||gj<70){const red=Math.max(4,Math.round(dose*0.1));return [Math.max(0,dose-red),`Hipoglicemia: reduzir ${red} UI (4 UI ou 10%, o que for maior). Investigar causa.`,'bad']}
  if(gj<80)return [Math.max(0,dose-2),'Jejum abaixo da meta: reduzir 2 UI.','warn'];
  if(gj<=130)return [dose,'Jejum na meta (80–130): manter a dose.','ok'];
  if(gj<=180)return [dose+2,'Jejum acima da meta: aumentar 2 UI e reavaliar em 3 dias.','warn'];
  return [dose+4,'Jejum > 180: aumentar 4 UI e reavaliar em 3 dias.','bad'];
}

/* Risco cardiovascular — Escore de Risco Global de Framingham (D'Agostino 2008), categorias SBC */
function framingham(fem,age,tc,hdl,sbp,trt,smk,dm){
  const L=Math.log;
  const s=fem?2.32888*L(age)+1.20904*L(tc)-0.70833*L(hdl)+(trt?2.82263:2.76157)*L(sbp)+0.52873*smk+0.69154*dm-26.1931
             :3.06117*L(age)+1.12370*L(tc)-0.93263*L(hdl)+(trt?1.99881:1.93303)*L(sbp)+0.65451*smk+0.57367*dm-23.9802;
  return 1-Math.pow(fem?0.95012:0.88936,Math.exp(s));
}

    // Se a pessoa ainda não interagiu, recarrega direto; senão oferece o botão
    if(!window.__touched){refreshing=true;location.reload();return}
    b.hidden=false;b.onclick=()=>{refreshing=true;location.reload()};
  });
  ['input','pointerdown','keydown'].forEach(e=>addEventListener(e,()=>{window.__touched=true},{once:true,capture:true}));
}
</script>
</body>
</html>
